- name: IIS Deployment
  if: ${{ github.event_name == 'workflow_dispatch' }}
  shell: powershell
  env:
    SITE_NAME: JuiceShopSite
    DEPLOY_PATH: C:\SSDLC\Nexus_Unzips
    IIS_PATH: C:\inetpub\wwwroot\JuiceShop
  run: |
    Import-Module WebAdministration -ErrorAction Stop

    # Stop IIS site if it exists
    $site = Get-Website -Name $env:SITE_NAME -ErrorAction SilentlyContinue
    if ($null -ne $site) {
        Stop-Website -Name $env:SITE_NAME
    }

    # Clear IIS directory or create it if missing
    if (Test-Path $env:IIS_PATH) {
        Get-ChildItem $env:IIS_PATH -Recurse -Force | Remove-Item -Force -Recurse
    } else {
        New-Item -ItemType Directory -Path $env:IIS_PATH -Force | Out-Null
    }

    # Copy files from deployment folder
    Copy-Item -Path (Join-Path $env:DEPLOY_PATH '*') -Destination $env:IIS_PATH -Recurse -Force

    # Start IIS site or create if missing
    $site = Get-Website -Name $env:SITE_NAME -ErrorAction SilentlyContinue
    if ($null -ne $site) {
        Start-Website -Name $env:SITE_NAME
    } else {
        New-Website -Name $env:SITE_NAME -Port 8080 -PhysicalPath $env:IIS_PATH -Force | Out-Null
    }

    Write-Host "IIS deployment completed successfully."
