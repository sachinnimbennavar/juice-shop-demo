name: Juice Shop Deploy Only

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy latest builds from Nexus
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          FRONTEND_DEPLOY_PATH: C:\inetpub\wwwroot\juice-shop
          SERVER_DEPLOY_PATH: C:\JuiceShopServer
        run: |
          Write-Host "[INFO] Starting deployment..."

          # Prepare Basic Auth
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          # Function to get the latest build ZIP from Maven2 repo
          function Get-LatestArtifactZip($artifactId) {
              $metadataUrl = "${env:NEXUS_URL}/com/example/juiceshop/$artifactId/maven-metadata.xml"
              try {
                  Write-Host "[INFO] Fetching maven-metadata.xml from $metadataUrl ..."
                  $metadata = Invoke-RestMethod -Uri $metadataUrl -Headers $headers -UseBasicParsing
                  $latestVersion = $metadata.metadata.versioning.latest
                  if (-not $latestVersion) { throw "No latest version found in metadata." }
                  Write-Host "[INFO] Latest $artifactId version detected: $latestVersion"
                  $zipUrl = "${env:NEXUS_URL}/com/example/juiceshop/$artifactId/$latestVersion/$artifactId-$latestVersion.zip"
                  return $zipUrl, $latestVersion
              } catch {
                  Write-Host "[WARN] Cannot fetch metadata for $artifactId. Falling back to latest ZIP in repo."
                  return $null, $null
              }
          }

          # ===== FRONTEND =====
          $frontendUrl, $frontendVersion = Get-LatestArtifactZip "frontend-build"
          if ($frontendUrl) {
              Write-Host "[INFO] Downloading frontend ZIP from $frontendUrl ..."
              Invoke-WebRequest -Uri $frontendUrl -OutFile "frontend-build.zip" -Headers $headers
              Write-Host "[INFO] Extracting frontend to $env:FRONTEND_DEPLOY_PATH ..."
              Remove-Item -Recurse -Force "$env:FRONTEND_DEPLOY_PATH\*" -ErrorAction SilentlyContinue
              Expand-Archive -Path "frontend-build.zip" -DestinationPath $env:FRONTEND_DEPLOY_PATH -Force
              Write-Host "[SUCCESS] Frontend deployed successfully."
          } else {
              Write-Host "[WARN] No frontend-build build found."
          }

          # ===== SERVER =====
          $serverUrl, $serverVersion = Get-LatestArtifactZip "server-build"
          if ($serverUrl) {
              Write-Host "[INFO] Downloading server ZIP from $serverUrl ..."
              Invoke-WebRequest -Uri $serverUrl -OutFile "server-build.zip" -Headers $headers
              Write-Host "[INFO] Extracting server to $env:SERVER_DEPLOY_PATH ..."
              Remove-Item -Recurse -Force "$env:SERVER_DEPLOY_PATH\*" -ErrorAction SilentlyContinue
              Expand-Archive -Path "server-build.zip" -DestinationPath $env:SERVER_DEPLOY_PATH -Force
              Write-Host "[SUCCESS] Server deployed successfully."
          } else {
              Write-Host "[WARN] No server-build build found."
          }

          Write-Host "✅ Deployment completed successfully!"
