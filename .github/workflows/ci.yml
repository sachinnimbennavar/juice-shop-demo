name: Juice Shop IIS Deployment

on:
  workflow_dispatch:

jobs:
  iis-deploy:
    runs-on: self-hosted  # Your Windows machine with IIS + ARR + iisnode

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Set Environment Variables
        shell: powershell
        run: |
          $env:FRONTEND_DEPLOY = "C:\SSDLC\Nexus_Unzips\frontend\dist\frontend"
          $env:BACKEND_DEPLOY = "C:\SSDLC\Nexus_Unzips\server"
          $env:FRONTEND_IIS = "C:\inetpub\wwwroot\JuiceShopFrontend"
          $env:BACKEND_IIS = "C:\inetpub\wwwroot\JuiceShopBackend"
          $env:BACKEND_URL = "http://localhost/JuiceShopBackend"

      # 1️⃣ Deploy Frontend
      - name: Deploy Frontend
        shell: powershell
        run: |
          Write-Host "[INFO] Deploying frontend..."
          Import-Module WebAdministration -ErrorAction Stop
          if (Test-Path $env:FRONTEND_IIS) {
              Write-Host "[INFO] Clearing existing frontend files..."
              Get-ChildItem $env:FRONTEND_IIS -Recurse -Force | Remove-Item -Force -Recurse
          } else {
              Write-Host "[INFO] Creating frontend IIS directory..."
              New-Item -ItemType Directory -Path $env:FRONTEND_IIS -Force | Out-Null
          }
          Copy-Item -Path (Join-Path $env:FRONTEND_DEPLOY '*') -Destination $env:FRONTEND_IIS -Recurse -Force

          # Update API URL
          $envFile = Join-Path $env:FRONTEND_IIS "assets\environment.prod.js"
          if (Test-Path $envFile) {
              (Get-Content $envFile) -replace 'apiUrl\s*:\s*["\'].*["\']', "apiUrl: '$env:BACKEND_URL'" | Set-Content $envFile
              Write-Host "[INFO] Frontend API URL updated."
          }

          # Angular routing web.config
          $webConfigPath = Join-Path $env:FRONTEND_IIS "web.config"
          @"
<configuration>
  <system.webServer>
    <rewrite>
      <rules>
        <rule name='Angular Routes' stopProcessing='true'>
          <match url='.*' />
          <conditions logicalGrouping='MatchAll'>
            <add input='{REQUEST_FILENAME}' matchType='IsFile' negate='true' />
            <add input='{REQUEST_FILENAME}' matchType='IsDirectory' negate='true' />
          </conditions>
          <action type='Rewrite' url='/index.html' />
        </rule>
      </rules>
    </rewrite>
  </system.webServer>
</configuration>
"@ | Out-File -FilePath $webConfigPath -Encoding UTF8

      # 2️⃣ Deploy Backend
      - name: Deploy Backend
        shell: powershell
        run: |
          Write-Host "[INFO] Deploying backend..."
          Import-Module WebAdministration -ErrorAction Stop
          if (Test-Path $env:BACKEND_IIS) {
              Write-Host "[INFO] Clearing existing backend files..."
              Get-ChildItem $env:BACKEND_IIS -Recurse -Force | Remove-Item -Force -Recurse
          } else {
              Write-Host "[INFO] Creating backend IIS directory..."
              New-Item -ItemType Directory -Path $env:BACKEND_IIS -Force | Out-Null
          }
          Copy-Item -Path (Join-Path $env:BACKEND_DEPLOY '*') -Destination $env:BACKEND_IIS -Recurse -Force

          # Create iisnode web.config
          $backendWebConfig = Join-Path $env:BACKEND_IIS "web.config"
          @"
<configuration>
  <system.webServer>
    <handlers>
      <add name='iisnode' path='server.js' verb='*' modules='iisnode'/>
    </handlers>
    <rewrite>
      <rules>
        <rule name='Nodejs' stopProcessing='true'>
          <match url='.*' />
          <action type='Rewrite' url='server.js'/>
        </rule>
      </rules>
    </rewrite>
    <iisnode nodeProcessCommandLine='C:\Program Files\nodejs\node.exe' />
  </system.webServer>
</configuration>
"@ | Out-File -FilePath $backendWebConfig -Encoding UTF8

      # 3️⃣ Start or Create IIS Sites
      - name: Configure IIS Sites
        shell: powershell
        run: |
          Import-Module WebAdministration -ErrorAction Stop
          
          # Frontend site
          $frontendSite = Get-Website -Name "JuiceShopFrontend" -ErrorAction SilentlyContinue
          if ($null -ne $frontendSite) {
              Write-Host "[INFO] Starting frontend site..."
              Start-Website -Name "JuiceShopFrontend"
          } else {
              Write-Host "[INFO] Creating frontend site on port 8080..."
              New-Website -Name "JuiceShopFrontend" -Port 8080 -PhysicalPath $env:FRONTEND_IIS -Force | Out-Null
          }

          # Backend site
          $backendSite = Get-Website -Name "JuiceShopBackend" -ErrorAction SilentlyContinue
          if ($null -ne $backendSite) {
              Write-Host "[INFO] Starting backend site..."
              Start-Website -Name "JuiceShopBackend"
          } else {
              Write-Host "[INFO] Creating backend site on port 8081..."
              New-Website -Name "JuiceShopBackend" -Port 8081 -PhysicalPath $env:BACKEND_IIS -Force | Out-Null
          }

      # 4️⃣ Restart IIS
      - name: Restart IIS
        shell: powershell
        run: |
          Write-Host "[INFO] Restarting IIS..."
          iisreset
          Write-Host "[INFO] IIS restarted. Juice Shop frontend and backend are live!"
