name: Juice Shop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set Node memory for server build
      - name: Set Node memory
        run: set NODE_OPTIONS=--max_old_space_size=4096

      # 3️⃣ Cache frontend dependencies and Angular build output
      - name: Cache frontend
        uses: actions/cache@v3
        with:
          path: |
            frontend/node_modules
            frontend/dist
            frontend/.angular
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      # 4️⃣ Cache server dependencies
      - name: Cache server
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-server-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-server-

      # 5️⃣ Install frontend dependencies
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps --prefer-offline --no-audit
          cd ..

      # 6️⃣ Build frontend
      - name: Build frontend
        run: |
          cd frontend
          npm run build -- --configuration production --watch=false --verbose
          cd ..

      # 7️⃣ Install server dependencies
      - name: Install server dependencies
        run: npm install --prefer-offline --no-audit

      # 8️⃣ Build server
      - name: Build server
        run: npm run build:server

      # 9️⃣ Optional SonarQube analysis
      - name: SonarQube Scan
        run: |
          if (Get-Command sonar-scanner -ErrorAction SilentlyContinue) {
              echo "Running SonarQube scanner..."
              set SONAR_HOST_URL=http://127.0.0.1:9000
              sonar-scanner
          } else {
              echo "sonar-scanner not found, skipping SonarQube analysis."
          }

      # 🔹 Nexus upload phase (safe & consistent)
      - name: Nexus Upload
        if: always()
        shell: powershell
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          mkdir temp_artifacts -ErrorAction SilentlyContinue

          # Copy frontend dist if exists
          if (Test-Path frontend/dist) { Copy-Item -Recurse frontend/dist temp_artifacts/frontend }

          # Ensure server/build exists
          if (-not (Test-Path server/build)) { mkdir server/build }

          # Copy server build
          Copy-Item -Recurse server/build temp_artifacts/server

          # Only compress and upload if temp_artifacts has content
          if ((Get-ChildItem temp_artifacts | Measure-Object).Count -gt 0) {
              Compress-Archive -Path temp_artifacts/* -DestinationPath juice-shop-build.zip
              curl -v -u "${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}" `
                --upload-file "juice-shop-build.zip" `
                "${env:NEXUS_URL}/juice-shop-build-${env:GITHUB_RUN_NUMBER}.zip"
