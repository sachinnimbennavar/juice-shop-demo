name: Juice Shop Manual Deployment (Frontend IIS + Backend Node.js)

on:
  workflow_dispatch:  # Manual trigger

jobs:
  deploy-only:
    runs-on: self-hosted

    env:
      DEPLOY_PATH: C:\SSDLC\Nexus_Unzips
      IIS_SITE: JuiceShop
      IIS_APPPOOL: JuiceShopAppPool
      NODE_PATH: "C:\Program Files\nodejs\node.exe"
      NSSM_PATH: "C:\SSDLC\nssm-2.24\nssm-2.24\win64\nssm.exe"

    steps:
      # 1️⃣ Deploy Frontend to IIS
      - name: Deploy Frontend to IIS
        shell: powershell
        run: |
          Import-Module WebAdministration
          Write-Host "[INFO] Deploying frontend to IIS..."
          $src = $env:DEPLOY_PATH
          $dest = "C:\inetpub\wwwroot\$env:IIS_SITE"

          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item -Path "$src\frontend\dist\frontend\*" -Destination $dest -Recurse -Force

          if (-not (Test-Path "IIS:\AppPools\$env:IIS_APPPOOL")) {
              Write-Host "[INFO] Creating App Pool: $env:IIS_APPPOOL ..."
              New-WebAppPool -Name $env:IIS_APPPOOL | Out-Null
          }
          Set-ItemProperty "IIS:\Sites\Default Web Site" -Name applicationPool -Value $env:IIS_APPPOOL
          Restart-WebAppPool -Name $env:IIS_APPPOOL
          Write-Host "✅ Frontend deployed to IIS"

      # 2️⃣ Deploy Backend Node.js via NSSM
      - name: Deploy Backend Node.js Service via NSSM
        shell: powershell
        run: |
          $serviceName = "JuiceShopServer"
          $nodeExe = $env:NODE_PATH
          $serverJs = Join-Path $env:DEPLOY_PATH "server.js"
          $nssmExe = $env:NSSM_PATH

          if (-not (Get-Service -Name $serviceName -ErrorAction SilentlyContinue)) {
              Write-Host "[INFO] Installing Node.js backend service via NSSM..."
              & $nssmExe install $serviceName $nodeExe $serverJs
          }

          if ((Get-Service $serviceName).Status -eq "Running") {
              Restart-Service $serviceName -Force
          } else {
              Start-Service $serviceName
          }
          Write-Host "✅ Backend Node.js service deployed via NSSM"
