name: Juice Shop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      nexus_only:
        description: 'Run only Nexus upload phase'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Build server
        run: npm run build:server

      - name: Run SonarQube Analysis
        if: ${{ inputs.nexus_only != 'true' }}
        run: |
          echo "Running SonarQube analysis..."
          # Example SonarQube scanner command
          "C:\Users\sachin.nimbennavar\Downloads\sonar-scanner-cli-7.2.0.5079-windows-x64\sonar-scanner-7.2.0.5079-windows-x64\bin\sonar-scanner.bat" `
            -Dsonar.projectKey=juice-shop-demo `
            -Dsonar.sources=. `
            -Dsonar.host.url=http://localhost:9000 `
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  nexus_upload:
    runs-on: windows-latest
    needs: build
    if: ${{ inputs.nexus_only == 'true' || github.event_name != 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Upload frontend and server builds to Nexus
        run: |
          Write-Host "Uploading frontend build to Nexus..."
          $frontendCred = New-Object System.Management.Automation.PSCredential("${{ secrets.NEXUS_USERNAME }}", (ConvertTo-SecureString "${{ secrets.NEXUS_PASSWORD }}" -AsPlainText -Force))
          Invoke-WebRequest -Uri "${{ secrets.NEXUS_URL }}/frontend.zip" `
            -Method Put `
            -InFile "frontend/dist/frontend.zip" `
            -Credential $frontendCred

          Write-Host "Uploading server build to Nexus..."
          $serverCred = New-Object System.Management.Automation.PSCredential("${{ secrets.NEXUS_USERNAME }}", (ConvertTo-SecureString "${{ secrets.NEXUS_PASSWORD }}" -AsPlainText -Force))
          Invoke-WebRequest -Uri "${{ secrets.NEXUS_URL }}/server.zip" `
            -Method Put `
            -InFile "server/build/server.zip" `
            -Credential $serverCred
