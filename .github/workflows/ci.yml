name: Juice Shop IIS Deployment

on:
  workflow_dispatch:  # This ensures the workflow shows up for manual trigger

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1️⃣ Initial test message to confirm workflow_dispatch works
      - name: Print test message
        run: echo "✅ Workflow triggered successfully on $(hostname)"

      # 2️⃣ Set Paths for IIS deployment
      - name: Set Paths and URLs
        shell: powershell
        run: |
          $env:FRONTEND_SOURCE = "C:\SSDLC\Nexus_Unzips\frontend\dist\frontend"
          $env:FRONTEND_IIS_PATH = "C:\inetpub\wwwroot\JuiceShopFrontend"
          $env:BACKEND_SOURCE = "C:\SSDLC\Nexus_Unzips\server"
          $env:BACKEND_IIS_PATH = "C:\inetpub\wwwroot\JuiceShopBackend"
          $env:BACKEND_URL = "http://localhost/JuiceShopBackend"
          $env:SITE_NAME_FRONTEND = "JuiceShopFrontend"
          $env:SITE_NAME_BACKEND = "JuiceShopBackend"

      # 3️⃣ Deploy Frontend
      - name: Deploy Frontend to IIS
        shell: powershell
        run: |
          Write-Host "=== Juice Shop Frontend Deployment Started ==="
          Import-Module WebAdministration

          $site = Get-Website -Name $env:SITE_NAME_FRONTEND -ErrorAction SilentlyContinue
          if ($null -ne $site) { Remove-Website -Name $env:SITE_NAME_FRONTEND }

          if (Test-Path $env:FRONTEND_IIS_PATH) {
              Get-ChildItem $env:FRONTEND_IIS_PATH -Recurse -Force | Remove-Item -Force -Recurse
          } else {
              New-Item -ItemType Directory -Path $env:FRONTEND_IIS_PATH -Force | Out-Null
          }

          Copy-Item -Path (Join-Path $env:FRONTEND_SOURCE '*') -Destination $env:FRONTEND_IIS_PATH -Recurse -Force

          $envFile = Join-Path $env:FRONTEND_IIS_PATH "assets\environment.prod.js"
          if (Test-Path $envFile) {
              (Get-Content $envFile) -replace 'apiUrl\s*:\s*["\'].*["\']', "apiUrl: '$env:BACKEND_URL'" | Set-Content $envFile
          }

          $webConfigPath = Join-Path $env:FRONTEND_IIS_PATH "web.config"
          @"
<configuration>
  <system.webServer>
    <rewrite>
      <rules>
        <rule name='Angular Routes' stopProcessing='true'>
          <match url='.*' />
          <conditions logicalGrouping='MatchAll'>
            <add input='{REQUEST_FILENAME}' matchType='IsFile' negate='true' />
            <add input='{REQUEST_FILENAME}' matchType='IsDirectory' negate='true' />
          </conditions>
          <action type='Rewrite' url='/index.html' />
        </rule>
      </rules>
    </rewrite>
  </system.webServer>
</configuration>
"@ | Out-File -FilePath $webConfigPath -Encoding UTF8

          New-Website -Name $env:SITE_NAME_FRONTEND -Port 8081 -PhysicalPath $env:FRONTEND_IIS_PATH -Force | Out-Null
          Write-Host "=== Frontend Deployment Completed ==="

      # 4️⃣ Deploy Backend
      - name: Deploy Backend to IIS
        shell: powershell
        run: |
          Write-Host "=== Juice Shop Backend Deployment Started ==="
          Import-Module WebAdministration

          $site = Get-Website -Name $env:SITE_NAME_BACKEND -ErrorAction SilentlyContinue
          if ($null -ne $site) { Remove-Website -Name $env:SITE_NAME_BACKEND }

          if (Test-Path $env:BACKEND_IIS_PATH) {
              Get-ChildItem $env:BACKEND_IIS_PATH -Recurse -Force | Remove-Item -Force -Recurse
          } else {
              New-Item -ItemType Directory -Path $env:BACKEND_IIS_PATH -Force | Out-Null
          }

          Copy-Item -Path (Join-Path $env:BACKEND_SOURCE '*') -Destination $env:BACKEND_IIS_PATH -Recurse -Force

          $backendWebConfig = Join-Path $env:BACKEND_IIS_PATH "web.config"
          @"
<configuration>
  <system.webServer>
    <handlers>
      <add name='iisnode' path='server.js' verb='*' modules='iisnode'/>
    </handlers>
    <rewrite>
      <rules>
        <rule name='Nodejs' stopProcessing='true'>
          <match url='.*' />
          <action type='Rewrite' url='server.js'/>
        </rule>
      </rules>
    </rewrite>
    <iisnode nodeProcessCommandLine='C:\Program Files\nodejs\node.exe' />
  </system.webServer>
</configuration>
"@ | Out-File -FilePath $backendWebConfig -Encoding UTF8

          New-Website -Name $env:SITE_NAME_BACKEND -Port 8080 -PhysicalPath $env:BACKEND_IIS_PATH -Force | Out-Null
          Write-Host "=== Backend Deployment Completed ==="

      # 5️⃣ Restart IIS
      - name: Restart IIS
        shell: powershell
        run: |
          Write-Host "=== Restarting IIS ==="
          iisreset
          Write-Host "=== Juice Shop IIS Deployment Finished ==="
