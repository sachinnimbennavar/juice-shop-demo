name: Juice Shop Full Repo Upload (with build + node_modules + logs)

on:
  workflow_dispatch:

jobs:
  full-repo-upload:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Install dependencies
      - name: Install dependencies
        shell: powershell
        run: |
          if (Test-Path "package.json") {
            Write-Host "📦 Installing Node.js dependencies..."
            npm install --legacy-peer-deps --prefer-offline --no-audit
          } else {
            Write-Host "⚠️ package.json not found — skipping npm install."
          }

      # 3️⃣ Build project (only if build script exists)
      - name: Build project
        shell: powershell
        run: |
          if (Test-Path "package.json") {
            $pkg = Get-Content package.json | ConvertFrom-Json
            if ($pkg.scripts.build) {
              Write-Host "🏗️ Running build..."
              npm run build --if-present
            } else {
              Write-Host "ℹ️ No build script defined — skipping build."
            }
          }

      # 4️⃣ Create and upload ZIP preserving order
      - name: Create full repo ZIP and upload to Nexus
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          $version = (Get-Date -Format "yyyyMMddHHmmss")
          $serverZip = "full-repo-$version.zip"
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          # Desired order (includes node_modules, build, logs)
          $itemsInOrder = @(
              ".dependabot",".github",".gitlab",".well-known",".zap","build","config","data","encryptionkeys",
              "frontend","ftp","i18n","lib","logs","models","monitoring","node_modules","routes","rsn",
              "screenshots","test","uploads","vagrant","views",
              ".codeclimate.yml",".devcontainer.json",".dockerignore",".eslintrc.js",".gitignore",
              ".gitlab-ci.yml",".gitpod.yml",".mailmap",".npmrc",
              "app.json","app.ts","CODE_OF_CONDUCT.md","config.schema.yml","CONTRIBUTING.md","crowdin.yaml",
              "ctf.key","cypress.config.ts","docker-compose.test.yml","Dockerfile","Gruntfile.js",
              "HALL_OF_FAME.md","LICENSE","package.json","README.md","REFERENCES.md","SECURITY.md",
              "server.ts","SOLUTIONS.md","swagger.yml","threat-model.json","tsconfig.json"
          )

          # Keep only existing items
          $itemsToZip = $itemsInOrder | Where-Object { Test-Path $_ }

          # Clean old zip if exists
          if (Test-Path $serverZip) { Remove-Item $serverZip -Force }

          # Create archive sequentially (preserves order)
          foreach ($item in $itemsToZip) {
              Write-Host "📁 Adding $item..."
              Compress-Archive -Path $item -Update -DestinationPath $serverZip
          }

          # Double-check critical folders
          foreach ($critical in @("build","logs","node_modules")) {
              if (!(Test-Path $critical)) {
                  Write-Host "⚠️ WARNING: '$critical' folder missing — zip may be incomplete!"
              }
          }

          Write-Host "✅ ZIP ready: $serverZip"

          # Upload to Nexus
          $uploadUrl = "${env:NEXUS_URL}/com/example/juiceshop/full-repo/$version/$serverZip"
          Write-Host "⬆️ Uploading to Nexus → $uploadUrl"
          Invoke-RestMethod -Uri $uploadUrl -Method Put -InFile $serverZip -Headers $headers -ContentType "application/zip"
          Write-Host "🎉 Successfully uploaded full repo (with build, logs, node_modules)."
