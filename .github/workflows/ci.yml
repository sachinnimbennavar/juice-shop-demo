name: Juice Shop CI - Deploy Latest Builds

on:
  workflow_dispatch:

jobs:
  deploy-latest:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy latest builds from Nexus
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          FRONTEND_PATH: C:\inetpub\wwwroot\juice-shop
          SERVER_PATH: C:\JuiceShopServer
        run: |
          Write-Host "[INFO] Starting deployment..."
          $base64Auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          function Get-LatestVersion($artifactId) {
              $searchUrl = "${env:NEXUS_URL}/service/rest/v1/search/assets?repository=JuiceShopMavenDemo&group=com.example.juiceshop&name=${artifactId}"
              Write-Host "[INFO] Searching Nexus for latest version of ${artifactId} ..."

              try {
                  $response = Invoke-RestMethod -Uri $searchUrl -Headers $headers -UseBasicParsing
                  # Extract version from path or use version field
                  $versions = $response.items | ForEach-Object { $_.version } | Where-Object { $_ -ne $null } | Sort-Object -Descending
                  if ($versions.Count -eq 0) { throw "No versions found" }
                  return $versions[0]
              } catch {
                  Write-Warning "[WARN] Cannot fetch files for ${artifactId}. Falling back to local detection."
                  return $null
              }
          }

          function Deploy-Artifact($artifactId, $deployPath, $filePrefix) {
              $version = Get-LatestVersion ${artifactId}
              if ($version) {
                  $zipUrl = "${env:NEXUS_URL}/repository/JuiceShopMavenDemo/com/example/juiceshop/${artifactId}/${version}/${filePrefix}-${version}.zip"
                  Write-Host "[INFO] Downloading ${artifactId} ZIP from ${zipUrl} ..."

                  $outFile = "${filePrefix}.zip"
                  Invoke-WebRequest -Uri $zipUrl -OutFile $outFile -Headers $headers -UseBasicParsing

                  Write-Host "[INFO] Extracting ${artifactId} to ${deployPath} ..."
                  Remove-Item -Recurse -Force "${deployPath}\*" -ErrorAction SilentlyContinue
                  Expand-Archive -Path $outFile -DestinationPath $deployPath -Force
                  Write-Host "[SUCCESS] ${artifactId} deployed successfully. Version: ${version}"
              }
          }

          Deploy-Artifact "frontend-build" ${env:FRONTEND_PATH} "frontend-build"
          Deploy-Artifact "server-build" ${env:SERVER_PATH} "server-build"

          Write-Host "✅ Deployment completed successfully!"
