name: Juice Shop CI/CD IIS Deployment

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build-deploy-service:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm install --legacy-peer-deps --no-audit
          npm run build -- --configuration production --watch=false

      - name: Deploy frontend to IIS
        shell: pwsh
        run: |
          Write-Host "[INFO] Preparing IIS deployment folder..."
          $iisPath = "C:\inetpub\wwwroot\JuiceShop"
          if (!(Test-Path $iisPath)) { New-Item -ItemType Directory -Path $iisPath | Out-Null }

          Write-Host "[INFO] Copying frontend build to IIS path..."
          Copy-Item -Path "C:\SSDLC\Nexus_Unzips\frontend\dist\*" -Destination $iisPath -Recurse -Force

          Write-Host "[INFO] Restarting IIS site JuiceShopSite if exists..."
          Import-Module WebAdministration
          if (Test-Path "IIS:\Sites\JuiceShopSite") {
              Restart-WebAppPool -Name "DefaultAppPool"
              Restart-WebItem "IIS:\Sites\JuiceShopSite"
          } else {
              Write-Host "JuiceShopSite not found — skipping restart."
          }

      - name: Run Node.js server as Windows Service
        shell: pwsh
        run: |
          Write-Host "[INFO] Setting up Windows Service for Node.js..."
          $serviceName = "JuiceShopNodeService"
          $nssmPath = "C:\Tools\nssm.exe"  # Ensure nssm.exe exists here
          $nodeExe = "C:\Program Files\nodejs\node.exe"
          $appDir = "C:\SSDLC\Nexus_Unzips"
          $serverFile = "server.js"

          if (!(Test-Path $nssmPath)) {
            Write-Host "[ERROR] NSSM not found at $nssmPath. Please install NSSM and re-run."
            exit 1
          }

          if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
            Write-Host "[INFO] Service already exists — restarting..."
            & $nssmPath stop $serviceName
            Start-Sleep -Seconds 3
            & $nssmPath start $serviceName
          } else {
            Write-Host "[INFO] Creating new service..."
            & $nssmPath install $serviceName $nodeExe "$appDir\$serverFile"
            & $nssmPath set $serviceName AppDirectory $appDir
            & $nssmPath set $serviceName Start SERVICE_AUTO_START
            & $nssmPath start $serviceName
          }

          Write-Host "[INFO] Node.js service status:"
          Get-Service -Name $serviceName
