name: Juice Shop CI/CD IIS Deployment

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm install --legacy-peer-deps --no-audit
          npm run build -- --configuration production --watch=false

      - name: Deploy frontend to IIS
        shell: pwsh
        run: |
          Write-Host "[INFO] Preparing IIS deployment folder..."
          $iisPath = "C:\inetpub\wwwroot\JuiceShop"
          if (!(Test-Path $iisPath)) { New-Item -ItemType Directory -Path $iisPath | Out-Null }

          Write-Host "[INFO] Copying frontend build to IIS path..."
          Copy-Item -Path "C:\SSDLC\Nexus_Unzips\frontend\dist\*" -Destination $iisPath -Recurse -Force

          Write-Host "[INFO] Restarting IIS site JuiceShopSite if exists..."
          Import-Module WebAdministration
          if (Test-Path "IIS:\Sites\JuiceShopSite") {
              Restart-WebAppPool -Name "DefaultAppPool"
              Restart-WebItem "IIS:\Sites\JuiceShopSite"
          } else {
              Write-Host "JuiceShopSite not found — skipping restart."
          }

          Write-Host "[INFO] IIS deployment completed successfully."
