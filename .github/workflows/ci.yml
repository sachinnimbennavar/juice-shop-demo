name: Juice Shop Run from Unzipped Repo

on:
  workflow_dispatch:

jobs:
  run-juice-shop:
    runs-on: self-hosted

    steps:
      # 1️⃣ Set Juice Shop path
      - name: Set Juice Shop path
        shell: powershell
        run: |
          $env:JUICESHOP_PATH = "C:\DeleteafterTest\full-repo-20251024130742"
          Write-Host "Juice Shop path set to $env:JUICESHOP_PATH"

      # 2️⃣ Install dependencies
      - name: Install dependencies
        shell: powershell
        run: |
          cd $env:JUICESHOP_PATH
          Write-Host "Installing Node.js dependencies..."
          npm install

      # 3️⃣ Build frontend
      - name: Build frontend
        shell: powershell
        run: |
          cd $env:JUICESHOP_PATH
          npm run build:frontend

      # 4️⃣ Start server using PM2
      - name: Start Juice Shop server
        shell: powershell
        run: |
          cd $env:JUICESHOP_PATH
          # Stop previous instance if exists
          npx pm2 delete juice-shop || Write-Host "No existing PM2 process found"
          # Start server
          npx pm2 start server.ts --name juice-shop
          npx pm2 save
          Write-Host "Juice Shop server started with PM2"
