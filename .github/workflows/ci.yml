name: Juice Shop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted
    strategy:
      matrix:
        job: [frontend, server]

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set Node memory globally
      - name: Set Node memory
        run: set NODE_OPTIONS=--max_old_space_size=4096

      # 3️⃣ Cache frontend dependencies and Angular build output
      - name: Cache frontend node_modules and Angular build
        uses: actions/cache@v3
        with:
          path: |
            frontend/node_modules
            frontend/dist
            frontend/.angular
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      # 4️⃣ Cache server dependencies
      - name: Cache server dependencies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-server-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-server-

      # 5️⃣ Install frontend dependencies
      - name: Install frontend deps
        if: matrix.job == 'frontend'
        run: |
          cd frontend
          npm ci --legacy-peer-deps --prefer-offline --no-audit
          cd ..

      # 6️⃣ Install server dependencies
      - name: Install server deps
        if: matrix.job == 'server'
        run: npm ci --prefer-offline --no-audit

      # 7️⃣ Build frontend incrementally
      - name: Build frontend
        if: matrix.job == 'frontend'
        run: |
          cd frontend
          # Use Angular cache for incremental build
          npm run build -- --configuration production --watch=false --verbose --incremental
          cd ..

      # 8️⃣ Build server
      - name: Build server
        if: matrix.job == 'server'
        run: npm run build:server

      # 9️⃣ Optional SonarQube
      - name: SonarQube Scan
        shell: pwsh
        run: |
          if (Get-Command sonar-scanner -ErrorAction SilentlyContinue) {
            echo "Running SonarQube scanner..."
            set SONAR_HOST_URL=http://127.0.0.1:9000
            sonar-scanner
          } else {
            echo "sonar-scanner not found, skipping SonarQube analysis."
          }
