name: Juice Shop Full Repo Upload

on:
  workflow_dispatch:

jobs:
  full-repo-upload:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Node 22
      - name: Setup Node.js v22
        uses: actions/setup-node@v3
        with:
          node-version: 22.19.0

      # 3️⃣ Cache backend node_modules
      - name: Cache backend node_modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: backend-node-modules-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            backend-node-modules-${{ runner.os }}-

      # 4️⃣ Install backend dependencies
      - name: Install backend dependencies
        shell: powershell
        run: |
          Write-Host "[INFO] Installing backend dependencies..."
          npm install --legacy-peer-deps

      # 5️⃣ Cache frontend node_modules
      - name: Cache frontend node_modules
        uses: actions/cache@v3
        with:
          path: frontend/node_modules
          key: frontend-node-modules-${{ runner.os }}-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            frontend-node-modules-${{ runner.os }}-

      # 6️⃣ Install frontend dependencies and build frontend
      - name: Build frontend
        shell: powershell
        run: |
          Write-Host "[INFO] Installing frontend dependencies and building..."
          cd frontend
          npm install --legacy-peer-deps
          npm run build
          cd ..

      # 7️⃣ Build backend if required
      - name: Build backend
        shell: powershell
        run: |
          Write-Host "[INFO] Building backend..."
          npm run --silent build:server || Write-Host "[INFO] No backend build step required."

      # 8️⃣ Create full repo ZIP
      - name: Create full repo ZIP
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          $version = (Get-Date -Format "yyyyMMddHHmmss")
          $serverZip = "full-repo-$version.zip"
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          $itemsInOrder = @(
              ".dependabot",".github",".gitlab",".well-known",".zap","build","config","data","encryptionkeys",
              "frontend","ftp","i18n","lib","logs","models","monitoring","node_modules","routes","rsn",
              "screenshots","test","uploads","vagrant","views",
              ".codeclimate.yml",".devcontainer.json",".dockerignore",".eslintrc.js",".gitignore",
              ".gitlab-ci.yml",".gitpod.yml",".mailmap",".npmrc",
              "app.json","app.ts","CODE_OF_CONDUCT.md","config.schema.yml","CONTRIBUTING.md","crowdin.yaml",
              "ctf.key","cypress.config.ts","docker-compose.test.yml","Dockerfile","Gruntfile.js",
              "HALL_OF_FAME.md","LICENSE","package.json","README.md","REFERENCES.md","SECURITY.md",
              "server.ts","SOLUTIONS.md","swagger.yml","threat-model.json","tsconfig.json"
          )

          $itemsToZip = $itemsInOrder | Where-Object { Test-Path $_ }

          if (Test-Path $serverZip) { Remove-Item $serverZip -Force }

          foreach ($item in $itemsToZip) {
              Write-Host "Adding $item to ZIP..."
              Compress-Archive -Path $item -Update -DestinationPath $serverZip
          }

          Write-Host "[INFO] Full repo ZIP created: $serverZip"

          $serverUrl = "${env:NEXUS_URL}/com/example/juiceshop/full-repo/$version/$serverZip"
          Write-Host "Uploading ZIP to Nexus → $serverUrl"
          Invoke-RestMethod -Uri $serverUrl -Method Put -InFile $serverZip -Headers $headers -ContentType "application/zip"
          Write-Host "[INFO] Full repo uploaded successfully."
