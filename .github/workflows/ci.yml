name: Juice Shop Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy latest frontend & server build
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
          FRONTEND_PATH: C:\inetpub\wwwroot\juice-shop
          SERVER_PATH: C:\JuiceShopServer
        run: |
          Write-Host "[INFO] Starting deployment..."

          function Get-LatestFolder {
              param ($artifactPath)
              $url = "$env:NEXUS_URL/com/example/juiceshop/${artifactPath}/"
              Write-Host "[INFO] Fetching available versions from $url ..."
              try {
                  $html = Invoke-WebRequest -Uri $url -UseBasicParsing
              } catch {
                  $errMsg = $_.Exception.Message
                  Write-Host "[ERROR] Failed to fetch ${artifactPath}: ${errMsg}"
                  exit 1
              }

              # Extract 14-digit folder names (timestamps)
              $folders = ($html.Links | ForEach-Object { $_.href } | Where-Object { $_ -match '^\d{14}/$' }) -replace '/$',''
              if (-not $folders) {
                  Write-Host "[ERROR] No version folders found in Nexus for ${artifactPath}!"
                  exit 1
              }

              # Pick latest timestamp
              $latest = ($folders | Sort-Object)[-1]
              Write-Host "[INFO] Latest ${artifactPath} version detected: ${latest}"
              return $latest
          }

          function Deploy-Zip {
              param ($artifactPath, $deployPath)
              $latestFolder = Get-LatestFolder -artifactPath $artifactPath
              $zipUrl = "$env:NEXUS_URL/com/example/juiceshop/${artifactPath}/${latestFolder}/${artifactPath}-${latestFolder}.zip"
              $tempZip = "$env:TEMP/${artifactPath}.zip"

              Write-Host "[INFO] Downloading ${artifactPath} from ${zipUrl} ..."
              try {
                  Invoke-WebRequest -Uri $zipUrl -OutFile $tempZip
              } catch {
                  $errMsg = $_.Exception.Message
                  Write-Host "[ERROR] Failed to download ${artifactPath}: ${errMsg}"
                  exit 1
              }

              Write-Host "[INFO] Extracting ${artifactPath} to ${deployPath} ..."
              if (Test-Path $deployPath) { Remove-Item -Recurse -Force $deployPath }
              Expand-Archive -Path $tempZip -DestinationPath $deployPath

              Remove-Item $tempZip
              Write-Host "[SUCCESS] ${artifactPath} deployed successfully."
          }

          # Deploy frontend
          Deploy-Zip -artifactPath "frontend-build" -deployPath $env:FRONTEND_PATH

          # Deploy server
          Deploy-Zip -artifactPath "server-build" -deployPath $env:SERVER_PATH

          Write-Host "`n✅ Deployment completed successfully!"
