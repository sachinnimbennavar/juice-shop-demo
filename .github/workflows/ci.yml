name: Open OWASP ZAP GUI

on:
  workflow_dispatch:

jobs:
  open-zap:
    runs-on: self-hosted

    steps:
      - name: Launch OWASP ZAP GUI
        shell: cmd
        run: |
          echo Launching OWASP ZAP GUI...
          start "" "C:\Program Files\ZAP\Zed Attack Proxy\ZAP.exe"
          echo ✅ ZAP GUI should now be open.
