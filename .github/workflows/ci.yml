name: Juice Shop Upload Only

on:
  workflow_dispatch:
    inputs:
      build_folder:
        description: "Folder of existing build (frontend-build/<timestamp>)"
        required: true

jobs:
  upload-only:
    runs-on: self-hosted
    steps:
      # 1️⃣ Checkout repository (needed for path structure)
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Upload existing build to Nexus
      - name: Upload build zip to Nexus
        shell: powershell
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          $buildFolder = "${{ github.event.inputs.build_folder }}"
          Write-Host "📁 Using existing build folder: $buildFolder"

          if (!(Test-Path $buildFolder)) {
              Write-Host "❌ Folder not found: $buildFolder"
              exit 1
          }

          # Find the zip
          $zipFile = Get-ChildItem "$buildFolder" -Filter *.zip | Select-Object -First 1
          if (!$zipFile) {
              Write-Host "❌ No zip file found in $buildFolder"
              exit 1
          }

          # Generate SHA256 checksum
          $checksumFile = Join-Path $buildFolder "$($zipFile.BaseName).sha256"
          $checksum = Get-FileHash -Path $zipFile.FullName -Algorithm SHA256
          $checksum.Value | Out-File -FilePath $checksumFile
          Write-Host "🔐 SHA256 checksum created: $checksumFile"

          # Upload zip and checksum to Nexus
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          $nexusBasePath = "${env:NEXUS_URL}/repository/juice-shop/com/example/juiceshop/frontend-build/$($zipFile.BaseName.Split('-')[-1])"
          Write-Host "⬆️ Uploading $($zipFile.Name) to Nexus..."
          Invoke-RestMethod -Uri "$nexusBasePath/$($zipFile.Name)" -Method Put -InFile $zipFile.FullName -Headers $headers

          Write-Host "⬆️ Uploading checksum..."
          Invoke-RestMethod -Uri "$nexusBasePath/$($zipFile.BaseName).sha256" -Method Put -InFile $checksumFile -Headers $headers

          Write-Host "✅ Nexus upload completed successfully."
