name: Juice Shop CI - Deploy Latest Builds

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set Nexus credentials
      - name: Set Nexus env
        run: |
          echo "NEXUS_URL=http://127.0.0.1:8081/repository/JuiceShopMavenDemo" >> $GITHUB_ENV
          echo "NEXUS_USERNAME=${{ secrets.NEXUS_USERNAME }}" >> $GITHUB_ENV
          echo "NEXUS_PASSWORD=${{ secrets.NEXUS_PASSWORD }}" >> $GITHUB_ENV

      # 3️⃣ Deploy latest builds
      - name: Deploy latest builds
        shell: powershell
        run: |
          Write-Host "[INFO] Starting deployment..."

          # Prepare Basic Auth
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          # ===== FUNCTION: Get latest ZIP for artifact =====
          function Get-LatestArtifact {
              param(
                  [string]$artifactId,
                  [string]$baseUrl
              )

              Write-Host "[INFO] Fetching available files from $baseUrl ..."
              
              try {
                  $filesHtml = Invoke-RestMethod -Uri $baseUrl -Headers $headers -UseBasicParsing
              } catch {
                  Write-Warning "[WARN] Cannot fetch files for $artifactId. Falling back to local detection."
                  return $null
              }

              $zipFiles = Select-String -InputObject $filesHtml -Pattern "href=`"(.+?\.zip)`"" | ForEach-Object {
                  $_.Matches[0].Groups[1].Value
              }

              if ($zipFiles.Count -eq 0) {
                  Write-Warning "[WARN] No ZIP files found for $artifactId!"
                  return $null
              }

              $latestZip = $zipFiles | Sort-Object { $_ -replace '.*-','' -as [long] } -Descending | Select-Object -First 1
              Write-Host "[INFO] Latest $artifactId ZIP found: $latestZip"
              return $latestZip
          }

          # ===== FRONTEND =====
          $frontendBaseUrl = "$($env:NEXUS_URL)/com/example/juiceshop/frontend-build/"
          $frontendZip = Get-LatestArtifact -artifactId "frontend-build" -baseUrl $frontendBaseUrl
          if ($frontendZip) {
              $frontendUrl = "$frontendBaseUrl$frontendZip"
              Write-Host "[INFO] Downloading frontend from $frontendUrl ..."
              Invoke-WebRequest -Uri $frontendUrl -OutFile "frontend-build.zip" -Headers $headers -UseBasicParsing
              
              Write-Host "[INFO] Extracting frontend to C:\inetpub\wwwroot\juice-shop ..."
              Expand-Archive -Path "frontend-build.zip" -DestinationPath "C:\inetpub\wwwroot\juice-shop" -Force
              Write-Host "[SUCCESS] Frontend deployed successfully."
          }

          # ===== SERVER =====
          $serverBaseUrl = "$($env:NEXUS_URL)/com/example/juiceshop/server-build/"
          $serverZip = Get-LatestArtifact -artifactId "server-build" -baseUrl $serverBaseUrl
          if ($serverZip) {
              $serverUrl = "$serverBaseUrl$serverZip"
              Write-Host "[INFO] Downloading server from $serverUrl ..."
              Invoke-WebRequest -Uri $serverUrl -OutFile "server-build.zip" -Headers $headers -UseBasicParsing
              
              Write-Host "[INFO] Extracting server to C:\JuiceShopServer ..."
              Expand-Archive -Path "server-build.zip" -DestinationPath "C:\JuiceShopServer" -Force
              Write-Host "[SUCCESS] Server deployed successfully."
          }

          Write-Host "✅ Deployment completed successfully!"
