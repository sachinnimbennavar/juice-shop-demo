name: Juice Shop IIS Full Deployment

on:
  workflow_dispatch:  # allows manual trigger from Actions tab

jobs:
  deploy-iis:
    runs-on: self-hosted  # Windows machine with IIS + ARR + iisnode installed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up environment variables
        shell: powershell
        run: |
          Write-Host "[INFO] Setting up environment variables..."
          $env:FRONTEND_SOURCE = "C:\SSDLC\Nexus_Unzips\frontend\dist\frontend"
          $env:FRONTEND_IIS_PATH = "C:\inetpub\wwwroot\JuiceShopFrontend"
          $env:BACKEND_SOURCE = "C:\SSDLC\Nexus_Unzips\server"
          $env:BACKEND_IIS_PATH = "C:\inetpub\wwwroot\JuiceShopBackend"
          $env:BACKEND_URL = "http://localhost/JuiceShopBackend"

      - name: Deploy Frontend
        shell: powershell
        run: |
          Write-Host "[INFO] Deploying Frontend..."
          if (-Not (Test-Path "C:\inetpub\wwwroot\JuiceShopFrontend")) { New-Item -ItemType Directory -Path "C:\inetpub\wwwroot\JuiceShopFrontend" | Out-Null }
          Remove-Item -Path "C:\inetpub\wwwroot\JuiceShopFrontend\*" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "C:\SSDLC\Nexus_Unzips\frontend\dist\frontend\*" -Destination "C:\inetpub\wwwroot\JuiceShopFrontend" -Recurse

          # web.config for Angular routes
          $webConfig = @"
<configuration>
  <system.webServer>
    <rewrite>
      <rules>
        <rule name='Angular Routes' stopProcessing='true'>
          <match url='.*' />
          <conditions logicalGrouping='MatchAll'>
            <add input='{REQUEST_FILENAME}' matchType='IsFile' negate='true' />
            <add input='{REQUEST_FILENAME}' matchType='IsDirectory' negate='true' />
          </conditions>
          <action type='Rewrite' url='/index.html' />
        </rule>
      </rules>
    </rewrite>
  </system.webServer>
</configuration>
"@
          $webConfig | Out-File -FilePath "C:\inetpub\wwwroot\JuiceShopFrontend\web.config" -Encoding UTF8

      - name: Deploy Backend
        shell: powershell
        run: |
          Write-Host "[INFO] Deploying Backend..."
          if (-Not (Test-Path "C:\inetpub\wwwroot\JuiceShopBackend")) { New-Item -ItemType Directory -Path "C:\inetpub\wwwroot\JuiceShopBackend" | Out-Null }
          Remove-Item -Path "C:\inetpub\wwwroot\JuiceShopBackend\*" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "C:\SSDLC\Nexus_Unzips\server\*" -Destination "C:\inetpub\wwwroot\JuiceShopBackend" -Recurse

          # web.config for Node.js server
          $backendWebConfig = @"
<configuration>
  <system.webServer>
    <handlers>
      <add name='iisnode' path='server.js' verb='*' modules='iisnode'/>
    </handlers>
    <rewrite>
      <rules>
        <rule name='Nodejs' stopProcessing='true'>
          <match url='.*' />
          <action type='Rewrite' url='server.js'/>
        </rule>
      </rules>
    </rewrite>
    <iisnode nodeProcessCommandLine='C:\Program Files\nodejs\node.exe' />
  </system.webServer>
</configuration>
"@
          $backendWebConfig | Out-File -FilePath "C:\inetpub\wwwroot\JuiceShopBackend\web.config" -Encoding UTF8

      - name: Restart IIS
        shell: powershell
        run: |
          Write-Host "[INFO] Restarting IIS..."
          iisreset
