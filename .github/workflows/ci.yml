name: Juice Shop Demo POC

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    env:
      DEPLOY_PATH_SERVER: C:\JuiceShopServer

    steps:
      - name: 🧩 Checkout code
        uses: actions/checkout@v3

      - name: ⚡ Install & Start Backend (Demo POC)
        shell: powershell
        run: |
          cd $env:DEPLOY_PATH_SERVER
          Write-Host "[INFO] Installing dependencies (without postinstall)..."
          npm install --legacy-peer-deps --ignore-scripts

          Write-Host "[INFO] Skipping frontend build for demo POC."

          Write-Host "[INFO] Building backend..."
          npm run build:server

          Write-Host "[INFO] Starting backend server..."
          Start-Process -FilePath "npm.cmd" -ArgumentList "run start" -NoNewWindow
          Write-Host "[SUCCESS] Backend server started."

      - name: ✅ POC Complete
        shell: powershell
        run: |
          Write-Host "[INFO] Demo POC deployment completed."
          Write-Host "[INFO] You can access the Juice Shop backend on http://localhost:3000 (or configured port)."
