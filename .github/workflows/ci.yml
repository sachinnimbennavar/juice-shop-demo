name: JuiceShop Deployment

on:
  workflow_dispatch:  # Manual trigger

jobs:
  deploy-juice-shop:
    runs-on: windows-latest

    env:
      JUICE_SHOP_PATH: C:\Users\admin\Desktop\TESTING\juice-shop
      SITE_NAME: JuiceShop
      SITE_PORT: 80
      APP_PORT: 3000

    steps:
    # Step 1: Checkout repo (optional if using artifacts)
    - name: Checkout repository
      uses: actions/checkout@v3

    # Step 2: Install Node.js dependencies (includes frontend build)
    - name: Install Node.js dependencies
      shell: powershell
      run: |
        cd "${{ env.JUICE_SHOP_PATH }}"
        npm install --legacy-peer-deps
        Write-Host "Dependencies installed and frontend built."

    # Step 3: Start Juice Shop in background
    - name: Start Juice Shop
      shell: powershell
      run: |
        cd "${{ env.JUICE_SHOP_PATH }}"
        Start-Process "npm" -ArgumentList "start"
        Write-Host "Juice Shop started on localhost:3000"

    # Step 4: Configure IIS Reverse Proxy (optional)
    - name: Configure IIS Reverse Proxy
      shell: powershell
      run: |
        Import-Module WebAdministration
        if (-not (Get-Website -Name "${{ env.SITE_NAME }}" -ErrorAction SilentlyContinue)) {
            New-Website -Name "${{ env.SITE_NAME }}" -PhysicalPath "${{ env.JUICE_SHOP_PATH }}" -Port $env:SITE_PORT
        }
        Set-WebConfigurationProperty -filter "system.webServer/proxy" -name "enabled" -value "True" -PSPath "IIS:\"
        $ruleExists = Get-WebConfigurationProperty -Filter "system.webServer/rewrite/rules/rule[@name='JuiceShopProxy']" -Name "name" -PSPath "IIS:\"
        if (-not $ruleExists) {
            Add-WebConfigurationProperty -pspath 'IIS:\' -filter "system.webServer/rewrite/rules" -name "." -value @{
                name='JuiceShopProxy'; enabled='true'; patternSyntax='Wildcard'; stopProcessing='true';
            }
            Add-WebConfigurationProperty -pspath 'IIS:\' -filter "system.webServer/rewrite/rules/rule[@name='JuiceShopProxy']/match" -name "." -value @{url='*'}
            Add-WebConfigurationProperty -pspath 'IIS:\' -filter "system.webServer/rewrite/rules/rule[@name='JuiceShopProxy']/action" -name "." -value @{
                type='Rewrite'; url='http://localhost:$env:APP_PORT/{R:0}'
            }
        }
        Write-Host "IIS configuration completed. Juice Shop accessible externally."
