name: JuiceShop Build & Deploy (Manual Test)

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    env:
      DEPLOY_PATH: ${{ github.workspace }}\JuiceShopServer  # Use repo folder on runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Prepare Deployment Directory
        run: |
          Write-Host "[INFO] Creating deployment directory..."
          if (-Not (Test-Path $env:DEPLOY_PATH)) {
              New-Item -ItemType Directory -Path $env:DEPLOY_PATH
          }

      - name: Copy Repo Files to Deploy Path
        run: |
          Write-Host "[INFO] Copying frontend and server files to deployment path..."
          Copy-Item -Path "${{ github.workspace }}\frontend" -Destination "$env:DEPLOY_PATH\frontend" -Recurse -Force
          Copy-Item -Path "${{ github.workspace }}\server" -Destination "$env:DEPLOY_PATH\server" -Recurse -Force

      - name: Install Backend Dependencies
        run: |
          Write-Host "[INFO] Installing backend dependencies..."
          cd $env:DEPLOY_PATH\server
          npm install

      - name: Install Frontend Dependencies (skip postinstall loop)
        run: |
          Write-Host "[INFO] Installing frontend dependencies..."
          cd $env:DEPLOY_PATH\frontend
          npm install --legacy-peer-deps --ignore-scripts

      - name: Build Frontend
        run: |
          Write-Host "[INFO] Building frontend..."
          cd $env:DEPLOY_PATH\frontend
          npm run build

      - name: Build Server
        run: |
          Write-Host "[INFO] Building server..."
          cd $env:DEPLOY_PATH\server
          npm run build:server

      - name: Deployment Complete
        run: |
          Write-Host "[SUCCESS] Frontend and backend build complete."
