name: Juice Shop Artifact Upload & Deployment Test

on:
  workflow_dispatch:  # Manual trigger

jobs:
  artifact-test:
    runs-on: self-hosted

    steps:
      # 1️⃣ Prepare deployment artifact
      - name: Prepare deployment artifact
        shell: powershell
        run: |
          Write-Host "[INFO] Preparing deployment artifact..."
          $artifactFolder = "build_output"
          if (Test-Path $artifactFolder) { Remove-Item -Recurse -Force $artifactFolder }
          New-Item -ItemType Directory -Path $artifactFolder | Out-Null
          $filesToInclude = @("build","frontend/dist/frontend","server.js","package.json","web.config")
          foreach ($item in $filesToInclude) {
              if (Test-Path $item) {
                  $dest = Join-Path $artifactFolder $item
                  $destDir = Split-Path $dest
                  if (!(Test-Path $destDir)) { New-Item -ItemType Directory -Path $destDir -Force | Out-Null }
                  Copy-Item -Path $item -Destination $dest -Recurse -Force
              }
          }
          Write-Host "[INFO] Deployment-ready artifact prepared at $artifactFolder"

      # 2️⃣ Upload artifact to Nexus (Maven2 repo, verified working)
      - name: Upload artifact to Nexus
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          $version = (Get-Date -Format "yyyyMMddHHmmss")
          $serverZip = "full-repo-$version.zip"
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }
          
          # Create ZIP from deployment artifact
          if (Test-Path $serverZip) { Remove-Item $serverZip -Force }
          Compress-Archive -Path "build_output/*" -DestinationPath $serverZip -Force

          # Upload to Maven2 Nexus repo using verified path structure
          $serverUrl = "${env:NEXUS_URL}/com/example/juiceshop/full-repo/$version/$serverZip"
          Write-Host "[INFO] Uploading $serverZip to Nexus → $serverUrl"
          Invoke-RestMethod -Uri $serverUrl -Method Put -InFile $serverZip -Headers $headers -ContentType "application/zip"
          Write-Host "✅ Artifact uploaded successfully"

      # 3️⃣ Download & unzip latest artifact from Nexus
      - name: Download & unzip latest artifact from Nexus
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081
          NEXUS_REPO: JuiceShopMavenDemo
          DEPLOY_PATH: C:\SSDLC\Nexus_Unzips
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          Write-Host "[INFO] Starting deployment..."
          if (Test-Path $env:DEPLOY_PATH) {
              Write-Host "[INFO] Clearing existing files from $env:DEPLOY_PATH ..."
              Remove-Item -Path "$env:DEPLOY_PATH\*" -Recurse -Force
          } else {
              New-Item -ItemType Directory -Path $env:DEPLOY_PATH -Force | Out-Null
          }

          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          # Get latest version from Maven2 repo
          $apiUrl = "${env:NEXUS_URL}/service/rest/v1/search?repository=${env:NEXUS_REPO}&group=com.example.juiceshop&name=full-repo"
          Write-Host "[INFO] Fetching available versions from $apiUrl ..."
          $response = Invoke-RestMethod -Uri $apiUrl -Headers $headers -Method Get
          if ($null -eq $response.items -or $response.items.Count -eq 0) {
              Write-Host "[ERROR] No full-repo versions found in Nexus!"
              exit 1
          }

          $latest = $response.items | Sort-Object { $_.version } -Descending | Select-Object -First 1
          $latestVersion = $latest.version
          $zipDownloadUrl = $latest.assets[0].downloadUrl
          Write-Host "[INFO] Latest version: $latestVersion"
          Write-Host "[INFO] Download URL: $zipDownloadUrl"

          $zipFilePath = Join-Path $env:DEPLOY_PATH "full-repo-$latestVersion.zip"
          Write-Host "[INFO] Downloading full repo ZIP to $zipFilePath ..."
          Invoke-WebRequest -Uri $zipDownloadUrl -OutFile $zipFilePath -Headers $headers
          if (-Not (Test-Path $zipFilePath)) {
              Write-Host "[ERROR] Failed to download ZIP!"
              exit 1
          }

          Write-Host "[INFO] Extracting ZIP to $env:DEPLOY_PATH ..."
          Expand-Archive -Path $zipFilePath -DestinationPath $env:DEPLOY_PATH -Force
          Write-Host "✅ Deployment completed successfully! Latest full-repo version: $latestVersion"
