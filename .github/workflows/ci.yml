name: Juice Shop CI/CD (Install Once + Deploy + Run)

on:
  workflow_dispatch:

jobs:
  build-upload-deploy:
    runs-on: self-hosted
    timeout-minutes: 180

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set Node memory (4GB)
      - name: Set Node memory
        shell: cmd
        run: |
          setx NODE_OPTIONS "--max_old_space_size=4096"

      # 3️⃣ Install all dependencies once (backend + frontend)
      - name: Install dependencies (Backend + Frontend)
        shell: cmd
        run: |
          echo Installing dependencies...
          if exist node_modules (
            echo node_modules already exists, skipping install.
          ) else (
            call npm install
          )
          if exist frontend\node_modules (
            echo frontend/node_modules already exists, skipping install.
          ) else (
            cd frontend
            call npm install
            cd ..
          )

      # 4️⃣ Prepare deployment artifact (include installed dependencies)
      - name: Prepare Deployment Artifact
        shell: cmd
        env:
          ARTIFACT_DIR: C:\SSDLC\Artifact
        run: |
          echo Preparing artifact...
          if exist "%ARTIFACT_DIR%" rmdir /s /q "%ARTIFACT_DIR%"
          mkdir "%ARTIFACT_DIR%"
          powershell Compress-Archive -Path * -DestinationPath "%ARTIFACT_DIR%\juice-shop.zip" -Force
          echo Artifact prepared at %ARTIFACT_DIR%\juice-shop.zip

      # 5️⃣ Upload artifact to Nexus
      - name: Upload Artifact to Nexus
        shell: cmd
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          echo Uploading artifact to Nexus...
          curl -u %NEXUS_USERNAME%:%NEXUS_PASSWORD% --upload-file C:\SSDLC\Artifact\juice-shop.zip %NEXUS_URL%/repository/juice-shop/juice-shop.zip

      # 6️⃣ Download and unzip artifact
      - name: Download & Unzip from Nexus
        shell: cmd
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          echo Cleaning and downloading artifact...
          if exist C:\SSDLC\Nexus_Unzips rmdir /s /q C:\SSDLC\Nexus_Unzips
          mkdir C:\SSDLC\Nexus_Unzips
          curl -u %NEXUS_USERNAME%:%NEXUS_PASSWORD% -o C:\SSDLC\Nexus_Unzips\juice-shop.zip %NEXUS_URL%/repository/juice-shop/juice-shop.zip
          powershell Expand-Archive -Path C:\SSDLC\Nexus_Unzips\juice-shop.zip -DestinationPath C:\SSDLC\Nexus_Unzips -Force
          echo Unzip completed.

      # 7️⃣ Start the app to confirm it runs on localhost:3000
      - name: Run Juice Shop
        shell: cmd
        run: |
          cd C:\SSDLC\Nexus_Unzips
          echo Starting Juice Shop...
          start /b cmd /c "npm start"
          echo Juice Shop started. Check http://localhost:3000
