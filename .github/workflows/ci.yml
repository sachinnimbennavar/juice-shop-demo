name: Open OWASP ZAP and Scan Juice Shop

on:
  workflow_dispatch:

jobs:
  zap-scan:
    runs-on: self-hosted

    steps:
      # 1️⃣ Launch ZAP GUI via desktop shortcut only if not already running
      - name: Launch OWASP ZAP via Desktop Shortcut
        shell: powershell
        run: |
          $zapProcess = Get-Process -Name "ZAP" -ErrorAction SilentlyContinue
          if (-not $zapProcess) {
              Write-Host "ZAP is not running. Launching OWASP ZAP..."
              Start-Process "C:\Users\Public\Desktop\ZAP 2.16.1.lnk"
              Write-Host "Waiting 2 minutes for ZAP to fully open..."
              Start-Sleep -Seconds 120
              Write-Host "✅ ZAP GUI should now be fully open."
          } else {
              Write-Host "ZAP is already running. Skipping launch."
          }

      # 2️⃣ Trigger quick scan via ZAP API and save HTML report
      - name: Run Quick Scan and Download Report
        shell: powershell
        run: |
          $ZAP_API = "http://localhost:8082"
          $TARGET = "http://localhost:3000"
          $REPORT_PATH = "C:\SSDLC\ZapScan_Reports\zap_report.html"

          # Ensure report folder exists
          if (-not (Test-Path "C:\SSDLC\ZapScan_Reports")) { 
              New-Item -ItemType Directory -Path "C:\SSDLC\ZapScan_Reports" 
          }

          # Start quick scan
          Write-Host "Starting ZAP quick scan on $TARGET..."
          Invoke-WebRequest "$ZAP_API/JSON/ascan/action/scan/?url=$TARGET" | Out-Null

          # Wait until scan completes
          Write-Host "Waiting for scan to complete..."
          do {
              Start-Sleep -Seconds 5
              $status = (Invoke-WebRequest "$ZAP_API/JSON/ascan/view/status/").Content | ConvertFrom-Json
          } while ([int]$status.status -lt 100)

          Write-Host "Scan complete. Downloading HTML report..."
          Invoke-WebRequest "$ZAP_API/OTHER/core/other/htmlreport/" -OutFile $REPORT_PATH
          Write-Host "✅ Report saved to $REPORT_PATH"
