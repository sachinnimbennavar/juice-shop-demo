name: Juice Shop CI - Deploy Latest Builds

on:
  workflow_dispatch:  # Allows manual trigger

jobs:
  deploy:
    name: Deploy Latest Builds
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Starting Deployment
        run: |
          Write-Host "[INFO] Starting deployment..."

      - name: Set environment variables
        run: |
          # Example: Replace these with your real versions or secrets
          echo "FRONTEND_VERSION=20251015101652" >> $env:GITHUB_ENV
          echo "SERVER_VERSION=20251015101652" >> $env:GITHUB_ENV

      - name: Download artifacts
        run: |
          $baseUrl = 'http://127.0.0.1:8081/repository/JuiceShopMavenDemo/com/example/juiceshop'
          $frontendUrl = "$baseUrl/frontend-build/${env:FRONTEND_VERSION}/frontend-build-${env:FRONTEND_VERSION}.zip"
          $serverUrl   = "$baseUrl/server-build/${env:SERVER_VERSION}/server-build-${env:SERVER_VERSION}.zip"

          Write-Host "[INFO] Downloading frontend: $frontendUrl"
          Write-Host "[INFO] Downloading server: $serverUrl"

          New-Item -ItemType Directory -Force -Path "C:\deploy\frontend" | Out-Null
          New-Item -ItemType Directory -Force -Path "C:\deploy\server" | Out-Null

          Invoke-WebRequest $frontendUrl -OutFile "frontend.zip"
          Invoke-WebRequest $serverUrl -OutFile "server.zip"

          Write-Host "[INFO] Extracting frontend..."
          Expand-Archive frontend.zip -DestinationPath "C:\deploy\frontend" -Force

          Write-Host "[INFO] Extracting server..."
          Expand-Archive server.zip -DestinationPath "C:\deploy\server" -Force

      - name: Verify deployment
        run: |
          if (Test-Path "C:\deploy\frontend\frontend\index.html" -and Test-Path "C:\deploy\server\package.json") {
              Write-Host "[SUCCESS] Deployment verified successfully."
          } else {
              Write-Host "[ERROR] Deployment verification failed."
              exit 1
          }

      - name: ✅ Deployment completed
        run: |
          Write-Host "[SUCCESS] Latest builds deployed successfully!"
