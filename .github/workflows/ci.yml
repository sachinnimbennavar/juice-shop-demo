name: Juice Shop Full CI/CD Pipeline (Ultra Fast)

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build-upload-deploy:
    runs-on: self-hosted
    timeout-minutes: 120

    steps:
      # 1️⃣ Ultra-Fast Checkout (minimal)
      - name: Checkout repository (ultra-fast)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          submodules: false
          clean: false
          persist-credentials: false

      # 2️⃣ Cache frontend + backend dependencies & frontend build
      - name: Cache dependencies + frontend build
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            frontend/node_modules
            frontend/dist
          key: ${{ runner.os }}-juiceshop-${{ hashFiles('package-lock.json', 'frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-juiceshop-

      # 3️⃣ Install backend dependencies (only if missing)
      - name: Install backend dependencies (first-time only)
        shell: powershell
        run: |
          if (-Not (Test-Path "node_modules")) {
              Write-Host "[INFO] Installing backend dependencies for first-time setup..."
              npm install --prefer-offline --no-audit
          } else {
              Write-Host "[INFO] Skipping backend install (already present)."
          }

      # 4️⃣ Install frontend dependencies (only if missing)
      - name: Install frontend dependencies (first-time only)
        shell: powershell
        run: |
          if (-Not (Test-Path "frontend/node_modules")) {
              Write-Host "[INFO] Installing frontend dependencies for first-time setup..."
              cd frontend
              npm install --legacy-peer-deps --prefer-offline --no-audit
              cd ..
          } else {
              Write-Host "[INFO] Skipping frontend install (already present)."
          }

      # 5️⃣ Build frontend (cached)
      - name: Build frontend (first-time only)
        shell: powershell
        run: |
          if (-Not (Test-Path "frontend/dist/frontend")) {
              Write-Host "[INFO] Building Angular frontend for first-time setup..."
              cd frontend
              npm run build -- --configuration production --watch=false
              cd ..
          } else {
              Write-Host "[INFO] Skipping frontend build (cached output found)."
          }

      # 6️⃣ Create & Upload Full Repo ZIP to Nexus
      - name: 📦 Create & Upload Full Repo ZIP to Nexus
        shell: powershell
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          $version = (Get-Date -Format "yyyyMMddHHmmss")
          $serverZip = "full-repo-$version.zip"
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          $itemsInOrder = @(
              ".dependabot",".github",".gitlab",".well-known",".zap",
              "build","logs","node_modules","config","data","encryptionkeys",
              "frontend","ftp","i18n","lib","models","monitoring",
              "routes","rsn","screenshots","test","uploads","vagrant","views",
              ".codeclimate.yml",".devcontainer.json",".dockerignore",".eslintrc.js",
              ".gitignore",".gitlab-ci.yml",".gitpod.yml",".mailmap",".npmrc",
              "app.json","app.ts","CODE_OF_CONDUCT.md","config.schema.yml","CONTRIBUTING.md",
              "crowdin.yaml","ctf.key","cypress.config.ts","docker-compose.test.yml","Dockerfile",
              "Gruntfile.js","HALL_OF_FAME.md","LICENSE","package.json","README.md",
              "REFERENCES.md","SECURITY.md","server.ts","SOLUTIONS.md","swagger.yml",
              "threat-model.json","tsconfig.json"
          )

          if (Test-Path $serverZip) { Remove-Item $serverZip -Force }

          foreach ($item in $itemsInOrder) {
              if (Test-Path $item) {
                  if ($item -eq "node_modules") {
                      $count = (Get-ChildItem node_modules -Recurse | Measure-Object).Count
                      if ($count -gt 5000) {
                          Write-Host "⚠️ Skipping node_modules folder to save time (contains $count items)..."
                          continue
                      }
                  }
                  Write-Host "Adding $item to ZIP..."
                  Compress-Archive -Path $item -DestinationPath $serverZip -Update
              } else {
                  if ($item -in @("build","logs","node_modules","config","data","encryptionkeys")) {
                      Write-Host "Creating empty folder $item..."
                      New-Item -ItemType Directory -Path $item
                      Compress-Archive -Path $item -DestinationPath $serverZip -Update
                  }
              }
          }

          $size = (Get-Item $serverZip).Length
          Write-Host "[INFO] ZIP file size: $size bytes"
          if ($size -lt 100000) { exit 1 }

          Write-Host "✅ Full repo ZIP created: $serverZip"
          $serverUrl = "${env:NEXUS_URL}/com/example/juiceshop/full-repo/$version/$serverZip"
          Write-Host "⬆️ Uploading to Nexus → $serverUrl"
          Invoke-RestMethod -Uri $serverUrl -Method Put -InFile $serverZip -Headers $headers -ContentType "application/zip"
          Write-Host "✅ Full repo uploaded successfully."

      # 7️⃣ Download & unzip latest artifact from Nexus
      - name: Download & unzip latest artifact from Nexus
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081
          NEXUS_REPO: JuiceShopMavenDemo
          DEPLOY_PATH: C:\SSDLC\Nexus_Unzips
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          Write-Host "[INFO] Starting artifact download..."
          if (Test-Path $env:DEPLOY_PATH) {
              Write-Host "[INFO] Clearing old files from $env:DEPLOY_PATH..."
              Remove-Item -Path "$env:DEPLOY_PATH\*" -Recurse -Force
          } else {
              New-Item -ItemType Directory -Path $env:DEPLOY_PATH -Force | Out-Null
          }
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }
          $searchUrl = "${env:NEXUS_URL}/service/rest/v1/search?repository=${env:NEXUS_REPO}&group=com.example.juiceshop&name=full-repo"
          $response = Invoke-RestMethod -Uri $searchUrl -Headers $headers -Method Get
          if ($null -eq $response.items -or $response.items.Count -eq 0) {
              Write-Host "[ERROR] No full-repo versions found in Nexus!"
              exit 1
          }
          $latest = $response.items | Sort-Object { $_.version } -Descending | Select-Object -First 1
          $latestVersion = $latest.version
          $zipDownloadUrl = $latest.assets[0].downloadUrl
          Write-Host "[INFO] Latest version: $latestVersion"
          $zipFilePath = Join-Path $env:DEPLOY_PATH "full-repo-$latestVersion.zip"
          Write-Host "[INFO] Downloading ZIP to $zipFilePath ..."
          Invoke-WebRequest -Uri $zipDownloadUrl -OutFile $zipFilePath -Headers $headers
          Expand-Archive -Path $zipFilePath -DestinationPath $env:DEPLOY_PATH -Force
          Write-Host "✅ Artifact downloaded and extracted successfully."

      # 8️⃣ Deploy to IIS
      - name: 🚀 Deploy to IIS
        shell: powershell
        env:
          DEPLOY_SOURCE: C:\SSDLC\Nexus_Unzips
          DEPLOY_TARGET: C:\inetpub\wwwroot\JuiceShop
          IIS_APPPOOL: JuiceShopAppPool
          IIS_SITE: "Default Web Site"
        run: |
          Import-Module WebAdministration
          Write-Host "[INFO] Deploying artifact to IIS..."
          if (Test-Path $env:DEPLOY_TARGET) {
              Write-Host "[INFO] Clearing existing files..."
              Remove-Item -Path "$env:DEPLOY_TARGET\*" -Recurse -Force
          } else {
              New-Item -ItemType Directory -Path $env:DEPLOY_TARGET -Force | Out-Null
          }
          Copy-Item -Path "$env:DEPLOY_SOURCE\*" -Destination $env:DEPLOY_TARGET -Recurse -Force
          if (-not (Test-Path "IIS:\AppPools\$env:IIS_APPPOOL")) {
              New-WebAppPool -Name $env:IIS_APPPOOL | Out-Null
              Set-ItemProperty "IIS:\AppPools\$env:IIS_APPPOOL" -Name processModel.identityType -Value "ApplicationPoolIdentity"
          }
          if (-not (Test-Path "IIS:\Sites\$env:IIS_SITE")) {
              New-Website -Name $env:IIS_SITE -PhysicalPath $env:DEPLOY_TARGET -Port 80 -Force | Out-Null
          }
          Set-ItemProperty "IIS:\Sites\$env:IIS_SITE" -Name applicationPool -Value $env:IIS_APPPOOL
          Restart-WebAppPool -Name $env:IIS_APPPOOL
          Write-Host "✅ IIS Deployment completed successfully!"
