name: Juice Shop Full CI/CD Pipeline (Ultra Fast + OWASP ZAP Scan)

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build-upload-deploy:
    runs-on: self-hosted
    timeout-minutes: 180

    steps:
      # 1️⃣ Ultra-Fast Checkout
      - name: Checkout repository (ultra-fast)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          submodules: false
          clean: false
          persist-credentials: false

      # 2️⃣ Cache dependencies + frontend build
      - name: Cache dependencies + frontend build
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            frontend/dist
          key: ${{ runner.os }}-juiceshop-${{ hashFiles('package-lock.json', 'frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-juiceshop-

      # 3️⃣ Install backend dependencies (only if missing)
      - name: Install backend dependencies (first-time only)
        shell: powershell
        run: |
          if (-Not (Test-Path "node_modules")) {
              Write-Host "[INFO] Installing backend dependencies..."
              npm install --prefer-offline --no-audit
          } else {
              Write-Host "[INFO] Skipping backend install (already present)."
          }

      # 4️⃣ Install frontend dependencies (only if missing)
      - name: Install frontend dependencies (first-time only)
        shell: powershell
        run: |
          if (-Not (Test-Path "frontend/node_modules")) {
              Write-Host "[INFO] Installing frontend dependencies..."
              cd frontend
              npm install --legacy-peer-deps --prefer-offline --no-audit
              cd ..
          } else {
              Write-Host "[INFO] Skipping frontend install (already present)."
          }

      # 5️⃣ Build frontend (cached)
      - name: Build frontend (first-time only)
        shell: powershell
        run: |
          if (-Not (Test-Path "frontend/dist/frontend")) {
              Write-Host "[INFO] Building Angular frontend..."
              cd frontend
              npm run build -- --configuration production --watch=false
              cd ..
          } else {
              Write-Host "[INFO] Skipping frontend build (cached output found)."
          }

      # 6️⃣ Compile backend TypeScript
      - name: Compile backend TypeScript
        shell: powershell
        run: |
          Write-Host "[INFO] Compiling backend TypeScript..."
          npx tsc
          if (-Not (Test-Path "build/app.js")) {
              Write-Host "[ERROR] Compilation failed, build/app.js not found"
              exit 1
          }

      # 7️⃣ Prepare deployment artifact (excluding node_modules)
      - name: Prepare deployment artifact (excluding node_modules)
        shell: powershell
        run: |
          Write-Host "[INFO] Preparing deployment artifact (excluding node_modules)..."
          $outputDir = "build_output"
          if (Test-Path $outputDir) { Remove-Item -Recurse -Force $outputDir }
          New-Item -ItemType Directory -Path $outputDir | Out-Null

          Copy-Item -Path build, frontend, package.json -Destination $outputDir -Recurse -Force

          $webConfig = "web.config"
          if (Test-Path $webConfig) {
              Copy-Item -Path $webConfig -Destination $outputDir -Force
          } else {
              Write-Host "[INFO] Optional item missing, skipping: $webConfig"
          }

          $requiredFile = "build/app.js"
          if (-Not (Test-Path $requiredFile)) {
              Write-Host "[ERROR] Required backend build file missing: $requiredFile"
              exit 1
          } else {
              Write-Host "[INFO] Found required file: $requiredFile"
          }

          Write-Host "[INFO] Artifact ready at $outputDir"

      # 8️⃣ Create & Upload Full Repo ZIP to Nexus
      - name: 📦 Create & Upload Full Repo ZIP to Nexus
        shell: powershell
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          $version = (Get-Date -Format "yyyyMMddHHmmss")
          $artifactName = "full-repo-$version.zip"
          Write-Host "[INFO] Uploading $artifactName to Nexus → $env:NEXUS_URL"

          Compress-Archive -Path build_output\* -DestinationPath $artifactName -Force

          $pair = "$env:NEXUS_USERNAME`:$env:NEXUS_PASSWORD"
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($pair)
          $encodedAuth = [Convert]::ToBase64String($bytes)

          $url = "$env:NEXUS_URL/com/example/juiceshop/full-repo/$version/$artifactName"
          Invoke-RestMethod -Uri $url -Headers @{Authorization=("Basic $encodedAuth")} -Method Put -InFile $artifactName -ContentType "application/zip"

          Write-Host "✅ Artifact uploaded successfully."

      # 9️⃣ Download and Extract Artifact from Nexus
      - name: 📥 Download and Extract Artifact from Nexus
        shell: powershell
        run: |
          Write-Host "[INFO] Starting artifact download..."
          $downloadPath = "C:\SSDLC\Nexus_Unzips"
          if (Test-Path $downloadPath) { Remove-Item -Recurse -Force $downloadPath }
          New-Item -ItemType Directory -Path $downloadPath | Out-Null

          $latestZip = Get-ChildItem *.zip | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Copy-Item -Path $latestZip.FullName -Destination "$downloadPath\$($latestZip.Name)"
          Expand-Archive -Path "$downloadPath\$($latestZip.Name)" -DestinationPath $downloadPath -Force
          Write-Host "✅ Artifact downloaded and extracted successfully."

      # 🔟 Install backend dependencies & Start server locally
      - name: 🚀 Install dependencies & Start Node.js server
        shell: powershell
        run: |
          Write-Host "[INFO] Installing backend dependencies inside build folder..."
          cd C:\SSDLC\Nexus_Unzips\build
          npm install --prefer-offline --no-audit

          Write-Host "[INFO] Starting Node.js server..."
          Start-Process -NoNewWindow -FilePath "node" -ArgumentList "app.js"

          Write-Host "[INFO] Waiting 25 seconds for server to be ready..."
          Start-Sleep -Seconds 25
          Write-Host "✅ Node.js server should be running at http://localhost:3000"
