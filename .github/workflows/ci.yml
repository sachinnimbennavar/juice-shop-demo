name: Juice Shop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set Node memory for server build
      - name: Set Node memory
        run: set NODE_OPTIONS=--max_old_space_size=4096

      # 3️⃣ Cache frontend dependencies and Angular build output
      - name: Cache frontend
        uses: actions/cache@v3
        with:
          path: |
            frontend/node_modules
            frontend/dist
            frontend/.angular
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      # 4️⃣ Cache server dependencies
      - name: Cache server
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-server-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-server-

      # 5️⃣ Install frontend dependencies
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps --prefer-offline --no-audit
          cd ..

      # 6️⃣ Build frontend (Angular incremental build handled automatically)
      - name: Build frontend
        run: |
          cd frontend
          npm run build -- --configuration production --watch=false --verbose
          cd ..

      # 7️⃣ Install server dependencies
      - name: Install server dependencies
        run: npm install --prefer-offline --no-audit

      # 8️⃣ Build server
      - name: Build server
        run: npm run build:server

      # 🔟 Nexus Upload Phase (PowerShell-native)
      - name: Upload frontend & server builds to Nexus
        shell: powershell
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          Write-Host "Preparing separate zips for frontend and server..."

          # Ensure build folders exist
          if (!(Test-Path frontend/dist)) { mkdir frontend/dist | Out-Null }
          if (!(Test-Path server/build)) { mkdir server/build | Out-Null }

          # Create zips individually
          Write-Host "Creating frontend-build.zip..."
          Compress-Archive -Path "frontend/dist" -DestinationPath "frontend-build.zip" -Force

          Write-Host "Creating server-build.zip..."
          Compress-Archive -Path "server" -DestinationPath "server-build.zip" -Force

          # Prepare authentication header
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          # Upload frontend zip
          Write-Host "Uploading frontend-build.zip to Nexus..."
          Invoke-RestMethod -Uri "${env:NEXUS_URL}/repository/juice-shop/frontend-build.zip" `
                            -Method Put `
                            -InFile "frontend-build.zip" `
                            -Headers $headers

          # Upload server zip
          Write-Host "Uploading server-build.zip to Nexus..."
          Invoke-RestMethod -Uri "${env:NEXUS_URL}/repository/juice-shop/server-build.zip" `
                            -Method Put `
                            -InFile "server-build.zip" `
                            -Headers $headers

          Write-Host "✅ Both frontend and server builds uploaded successfully to Nexus."
