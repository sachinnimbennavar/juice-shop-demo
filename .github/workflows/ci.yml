name: Juice Shop Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    env:
      NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
      DEPLOY_PATH_FRONTEND: C:\inetpub\wwwroot\juice-shop
      DEPLOY_PATH_SERVER: C:\JuiceShopServer

    steps:
      - name: 🧩 Checkout code
        uses: actions/checkout@v3

      - name: 🚀 Deploy latest build from Nexus
        shell: powershell
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          Write-Host "[INFO] Starting deployment..."

          # Prepare Basic Auth
          $pair = "${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes($pair))
          $headers = @{ Authorization = "Basic $base64Auth" }

          # --- FRONTEND ---
          $frontendBaseUrl = "${env:NEXUS_URL}/com/example/juiceshop/frontend-build/"
          $response = Invoke-WebRequest -Uri $frontendBaseUrl -Headers $headers

          # Extract numeric folder names and pick latest
          $latestFrontend = ($response.Content -split "`n" | Where-Object { $_ -match 'href="(\d+)/"' } | ForEach-Object {
              ($_ -match 'href="(\d+)/"') | Out-Null
              $matches[1]
          } | Sort-Object -Descending | Select-Object -First 1)

          Write-Host "[INFO] Latest frontend build: $latestFrontend"

          $frontendUrl = "${env:NEXUS_URL}/com/example/juiceshop/frontend-build/$latestFrontend/frontend-build-$latestFrontend.zip"
          Invoke-WebRequest -Uri $frontendUrl -OutFile "frontend.zip" -Headers $headers
          Expand-Archive -Path "frontend.zip" -DestinationPath "${env:DEPLOY_PATH_FRONTEND}" -Force
          Write-Host "[SUCCESS] Frontend deployed."

          # --- SERVER ---
          $serverBaseUrl = "${env:NEXUS_URL}/com/example/juiceshop/server-build/"
          $response = Invoke-WebRequest -Uri $serverBaseUrl -Headers $headers

          $latestServer = ($response.Content -split "`n" | Where-Object { $_ -match 'href="(\d+)/"' } | ForEach-Object {
              ($_ -match 'href="(\d+)/"') | Out-Null
              $matches[1]
          } | Sort-Object -Descending | Select-Object -First 1)

          Write-Host "[INFO] Latest server build: $latestServer"

          $serverUrl = "${env:NEXUS_URL}/com/example/juiceshop/server-build/$latestServer/server-build-$latestServer.zip"
          Invoke-WebRequest -Uri $serverUrl -OutFile "server.zip" -Headers $headers
          Expand-Archive -Path "server.zip" -DestinationPath "${env:DEPLOY_PATH_SERVER}" -Force
          Write-Host "[SUCCESS] Server deployed."

          Write-Host "✅ Deployment of latest build completed successfully!"
