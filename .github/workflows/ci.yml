name: CD Pipeline

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Set variables
        run: |
          $basePath = "C:\JuiceShopServer"
          $frontendZip = "$basePath\frontend.zip"
          $serverZip = "$basePath\server.zip"
          $frontendUrl = "http://127.0.0.1:8081/repository/JuiceShopMavenDemo/com/example/juiceshop/frontend-build/latest/frontend-build-latest.zip"
          $serverUrl = "http://127.0.0.1:8081/repository/JuiceShopMavenDemo/com/example/juiceshop/server-build/latest/server-build-latest.zip"

      - name: Create deployment folder
        run: New-Item -ItemType Directory -Force -Path "C:\JuiceShopServer"

      - name: Download frontend
        run: Invoke-WebRequest -Uri $frontendUrl -OutFile "C:\JuiceShopServer\frontend.zip"

      - name: Download server
        run: Invoke-WebRequest -Uri $serverUrl -OutFile "C:\JuiceShopServer\server.zip"

      - name: Extract zips
        run: |
          Expand-Archive -Path "C:\JuiceShopServer\frontend.zip" -DestinationPath "C:\JuiceShopServer" -Force
          Expand-Archive -Path "C:\JuiceShopServer\server.zip" -DestinationPath "C:\JuiceShopServer" -Force

      - name: Install dependencies
        run: |
          cd C:\JuiceShopServer\server
          npm install
          cd C:\JuiceShopServer\frontend\frontend
          npm install

      - name: Start applications
        run: |
          Start-Process powershell -ArgumentList "cd C:\JuiceShopServer\server; npm start" -WindowStyle Hidden
          Start-Process powershell -ArgumentList "cd C:\JuiceShopServer\frontend\frontend; npm start" -WindowStyle Hidden
