name: Juice Shop CI/CD Full Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Manual trigger

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      # 2️⃣ Set Node memory
      - name: Set Node memory
        run: set NODE_OPTIONS=--max_old_space_size=4096

      # 3️⃣ Cache frontend dependencies
      - name: Cache frontend
        uses: actions/cache@v3
        with:
          path: |
            frontend/node_modules
            frontend/dist
            frontend/.angular
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      # 4️⃣ Cache server dependencies
      - name: Cache server
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-server-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-server-

      # 5️⃣ Install frontend dependencies
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps --prefer-offline --no-audit
          cd ..

      # 6️⃣ Build frontend (production)
      - name: Build frontend
        run: |
          cd frontend
          npm run build -- --configuration production --watch=false --verbose
          cd ..

      # 7️⃣ Install server dependencies
      - name: Install server dependencies
        run: npm install --prefer-offline --no-audit

      # 8️⃣ Build server
      - name: Build server
        run: npm run build:server

      # 9️⃣ Prepare deployment artifact (ready for IIS)
      - name: Prepare deployment artifact
        shell: powershell
        run: |
          Write-Host "📦 Preparing deployment artifact..."
          $artifactFolder = "build_output"
          if (Test-Path $artifactFolder) { Remove-Item -Recurse -Force $artifactFolder }
          New-Item -ItemType Directory -Path $artifactFolder | Out-Null

          $filesToInclude = @(
            "build",                        # Backend build output
            "frontend/dist/frontend",        # Frontend production build
            "server.js",                     # Node entrypoint
            "package.json",                  # Server dependencies
            "web.config"                     # IIS configuration
          )

          foreach ($item in $filesToInclude) {
              if (Test-Path $item) {
                  $dest = Join-Path $artifactFolder $item
                  $destDir = Split-Path $dest
                  if (!(Test-Path $destDir)) { New-Item -ItemType Directory -Path $destDir -Force | Out-Null }
                  Copy-Item -Path $item -Destination $dest -Recurse -Force
                  Write-Host "✅ Added: $item"
              } else {
                  Write-Warning "⚠️ Missing item (skipped): $item"
              }
          }
          Write-Host "✅ Deployment-ready artifact prepared at $artifactFolder"

      # 🔟 Upload artifact to Nexus
      - name: Upload artifact to Nexus
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          $version = (Get-Date -Format "yyyyMMddHHmmss")
          $zipName = "juiceshop-build-$version.zip"
          Compress-Archive -Path "build_output/*" -DestinationPath $zipName -Force

          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          $uploadUrl = "${env:NEXUS_URL}/com/example/juiceshop/artifacts/$version/$zipName"
          Write-Host "⬆️ Uploading artifact to Nexus → $uploadUrl"
          Invoke-RestMethod -Uri $uploadUrl -Method Put -InFile $zipName -Headers $headers -ContentType "application/zip"
          Write-Host "✅ Artifact uploaded to Nexus"

      # 11️⃣ Deploy artifact to IIS
      - name: Deploy latest build to IIS
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081
          NEXUS_REPO: JuiceShopMavenDemo
          DEPLOY_PATH: C:\SSDLC\Nexus_Unzips
          IIS_FRONTEND_PATH: C:\inetpub\wwwroot\JuiceShopFrontend
          IIS_BACKEND_PATH: C:\inetpub\wwwroot\JuiceShopBackend
          IIS_APPPOOL: JuiceShopAppPool
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          Write-Host "[INFO] Starting IIS deployment..."
          if (Test-Path $env:DEPLOY_PATH) { Remove-Item "$env:DEPLOY_PATH\*" -Recurse -Force } else { New-Item -ItemType Directory -Path $env:DEPLOY_PATH -Force | Out-Null }

          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          $apiUrl = "${env:NEXUS_URL}/service/rest/v1/search?repository=${env:NEXUS_REPO}&group=com.example.juiceshop&name=artifacts"
          $response = Invoke-RestMethod -Uri $apiUrl -Headers $headers -Method Get
          if ($null -eq $response.items -or $response.items.Count -eq 0) { Write-Error "❌ No builds found in Nexus!"; exit 1 }

          $latest = $response.items | Sort-Object { $_.version } -Descending | Select-Object -First 1
          $latestVersion = $latest.version
          $zipUrl = $latest.assets[0].downloadUrl
          $zipFile = Join-Path $env:DEPLOY_PATH "juiceshop-build-$latestVersion.zip"

          Write-Host "📥 Downloading latest build → $zipFile"
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipFile -Headers $headers

          Expand-Archive -Path $zipFile -DestinationPath $env:DEPLOY_PATH -Force
          Write-Host "✅ Extracted build to $env:DEPLOY_PATH"

          # Deploy frontend
          if (Test-Path $env:IIS_FRONTEND_PATH) { Remove-Item "$env:IIS_FRONTEND_PATH\*" -Recurse -Force }
          Copy-Item -Path "$env:DEPLOY_PATH\build_output\frontend\dist\frontend\*" -Destination $env:IIS_FRONTEND_PATH -Recurse -Force
          Write-Host "✅ Frontend deployed to $env:IIS_FRONTEND_PATH"

          # Deploy backend
          if (Test-Path $env:IIS_BACKEND_PATH) { Remove-Item "$env:IIS_BACKEND_PATH\*" -Recurse -Force }
          Copy-Item -Path "$env:DEPLOY_PATH\build_output\build\*" -Destination $env:IIS_BACKEND_PATH -Recurse -Force
          Copy-Item -Path "$env:DEPLOY_PATH\build_output\server.js" -Destination $env:IIS_BACKEND_PATH -Force
          Copy-Item -Path "$env:DEPLOY_PATH\build_output\package.json" -Destination $env:IIS_BACKEND_PATH -Force
          Copy-Item -Path "$env:DEPLOY_PATH\build_output\web.config" -Destination $env:IIS_BACKEND_PATH -Force
          Write-Host "✅ Backend deployed to $env:IIS_BACKEND_PATH"

          # Restart IIS App Pool
          Import-Module WebAdministration
          if ((Get-WebAppPoolState -Name $env:IIS_APPPOOL).Value -eq "Started") { Restart-WebAppPool $env:IIS_APPPOOL; Write-Host "🔄 IIS App Pool restarted" } else { Start-WebAppPool $env:IIS_APPPOOL; Write-Host "▶️ IIS App Pool started" }

          Write-Host "✅ Juice Shop fully deployed to IIS!"
