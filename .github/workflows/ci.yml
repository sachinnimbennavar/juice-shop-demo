name: Nexus Upload Test Full

on:
  workflow_dispatch:  # manual trigger for testing

jobs:
  nexus-upload:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Build Frontend
      - name: Build frontend
        run: |
          cd frontend
          npm install --legacy-peer-deps --prefer-offline --no-audit
          npm run build -- --configuration production --watch=false
          cd ..
      # 3️⃣ Build Server
      - name: Build server
        run: |
          npm install --prefer-offline --no-audit
          npm run build:server
      # 4️⃣ Nexus Upload Phase
      - name: Upload build artifacts to Nexus
        shell: powershell
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          Write-Host "🧩 Preparing frontend and server zips..."
          # Frontend zip
          if (Test-Path "frontend/dist") {
              Write-Host "Creating frontend-build.zip..."
              Compress-Archive -Path "frontend/dist/*" -DestinationPath "frontend-build.zip" -Force
          } else {
              Write-Host "⚠️ frontend/dist not found, skipping frontend zip."
          }
          # Server zip (source + compiled JS)
          Write-Host "Creating server-build.zip..."
          $serverPaths = @(
              "app.ts",
              "server.ts",
              "package.json",
              "tsconfig.json",
              "models",
              "routes",
              "lib",
              "data",
              "views",
              "rsn",
              "config",
              "build"  # compiled JS from tsc
          ) | Where-Object { Test-Path $_ }
          if ($serverPaths.Count -gt 0) {
              Compress-Archive -Path $serverPaths -DestinationPath "server-build.zip" -Force
              Write-Host "✅ Server zip created successfully."
          } else {
              Write-Host "⚠️ No backend files found to zip."
          }
          # Upload to Nexus
          Write-Host "⬆️ Uploading zips to Nexus..."
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }
          if (Test-Path "frontend-build.zip") {
              Write-Host "Uploading frontend-build.zip..."
              Invoke-RestMethod -Uri "${env:NEXUS_URL}/repository/juice-shop/frontend-build-${env:GITHUB_RUN_NUMBER}.zip" `
                                -Method Put `
                                -InFile "frontend-build.zip" `
                                -Headers $headers
          }
          if (Test-Path "server-build.zip") {
              Write-Host "Uploading server-build.zip..."
              Invoke-RestMethod -Uri "${env:NEXUS_URL}/repository/juice-shop/server-build-${env:GITHUB_RUN_NUMBER}.zip" `
                                -Method Put `
                                -InFile "server-build.zip" `
                                -Headers $headers
          }
          Write-Host "✅ Nexus upload completed successfully."
