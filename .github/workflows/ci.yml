name: Juice Shop Full CI/CD Pipeline (Ultra Fast + OWASP ZAP Scan)

on:
  workflow_dispatch:

jobs:
  build-upload-deploy:
    runs-on: self-hosted
    timeout-minutes: 180

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository (ultra-fast)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          submodules: false
          clean: false
          persist-credentials: false

      # 2️⃣ Cache dependencies + frontend build
      - name: Cache dependencies + frontend build
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            frontend/dist
          key: ${{ runner.os }}-juiceshop-${{ hashFiles('package-lock.json', 'frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-juiceshop-

      # 3️⃣ Install backend dependencies (if missing)
      - name: Install backend dependencies (first-time only)
        shell: powershell
        run: |
          if (-Not (Test-Path "node_modules")) {
              Write-Host "[INFO] Installing backend dependencies..."
              npm install --prefer-offline --no-audit
          } else {
              Write-Host "[INFO] Skipping backend install (already present)."
          }

      # 4️⃣ Install frontend dependencies (if missing)
      - name: Install frontend dependencies (first-time only)
        shell: powershell
        run: |
          if (-Not (Test-Path "frontend/node_modules")) {
              Write-Host "[INFO] Installing frontend dependencies..."
              cd frontend
              npm install --legacy-peer-deps --prefer-offline --no-audit
              cd ..
          } else {
              Write-Host "[INFO] Skipping frontend install (already present)."
          }

      # 5️⃣ Increase Node memory
      - name: Set Node memory
        shell: powershell
        run: setx NODE_OPTIONS "--max_old_space_size=4096"

      # 6️⃣ Build frontend
      - name: Build frontend (first-time only)
        shell: powershell
        run: |
          if (-Not (Test-Path "frontend/dist/frontend")) {
              Write-Host "[INFO] Building Angular frontend..."
              cd frontend
              npm run build -- --configuration production --watch=false
              cd ..
          } else {
              Write-Host "[INFO] Skipping frontend build (cached output found)."
          }

      # 7️⃣ Prepare deployment artifact (ZIP)
      - name: Prepare deployment artifact
        shell: powershell
        env:
          ARTIFACT_DIR: C:\SSDLC\Artifact_Prepare
        run: |
          Write-Host "[INFO] Preparing deployment artifact..."
          if (Test-Path $env:ARTIFACT_DIR) { Remove-Item -Recurse -Force $env:ARTIFACT_DIR }
          New-Item -ItemType Directory -Path $env:ARTIFACT_DIR | Out-Null
          Copy-Item -Recurse -Force * $env:ARTIFACT_DIR
          Compress-Archive -Path "$env:ARTIFACT_DIR\*" -DestinationPath "$env:ARTIFACT_DIR\juice-shop.zip" -Force
          Write-Host "[INFO] Artifact ready at $env:ARTIFACT_DIR\juice-shop.zip"

      # 8️⃣ Upload artifact to Nexus
      - name: 📦 Create & Upload Full Repo ZIP to Nexus
        shell: powershell
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          $version = (Get-Date -Format "yyyy.MM.dd.HHmmss")
          $zipPath = "C:\SSDLC\Artifact_Prepare\juice-shop.zip"
          $uploadUrl = "$env:NEXUS_URL/repository/juice-shop-repo/juice-shop-$version.zip"
          Write-Host "[INFO] Uploading $zipPath to Nexus as juice-shop-$version.zip ..."
          curl -u "$env:NEXUS_USERNAME:$env:NEXUS_PASSWORD" --upload-file $zipPath $uploadUrl
          Write-Host "[INFO] Upload completed to Nexus!"

      # 9️⃣ Clear and extract ZIP to C:\SSDLC\Nexus_Unzips
      - name: 📂 Extract artifact for deployment
        shell: powershell
        run: |
          $targetPath = "C:\SSDLC\Nexus_Unzips"
          if (Test-Path $targetPath) { Remove-Item -Recurse -Force $targetPath }
          New-Item -ItemType Directory -Force -Path $targetPath | Out-Null
          Expand-Archive -Path "C:\SSDLC\Artifact_Prepare\juice-shop.zip" -DestinationPath $targetPath -Force
          Write-Host "[INFO] Extraction complete to $targetPath"

      # 🔑 Generate encryption keys (new)
      - name: 🔑 Generate encryption keys if missing
        shell: powershell
        run: |
          $keyDir = "C:\SSDLC\Nexus_Unzips\encryptionkeys"
          if (-Not (Test-Path $keyDir)) {
            Write-Host "[INFO] Creating encryptionkeys directory..."
            New-Item -ItemType Directory -Force -Path $keyDir | Out-Null
          }

          if (-Not (Test-Path "$keyDir\jwt.key") -or -Not (Test-Path "$keyDir\jwt.pub")) {
            Write-Host "[INFO] Generating RSA key pair for JWT..."
            node -e "const fs=require('fs');const {generateKeyPairSync}=require('crypto');const {publicKey,privateKey}=generateKeyPairSync('rsa',{modulusLength:2048,publicKeyEncoding:{type:'spki',format:'pem'},privateKeyEncoding:{type:'pkcs8',format:'pem'}});fs.writeFileSync('$keyDir\\jwt.pub',publicKey);fs.writeFileSync('$keyDir\\jwt.key',privateKey);"
          } else {
            Write-Host "[INFO] Encryption keys already exist. Skipping."
          }

      # 🔟 Deploy and run Juice Shop locally
      - name: 🚀 Start Juice Shop Server
        shell: powershell
        run: |
          Write-Host "[INFO] Starting Node.js server from extracted artifact..."
          cd C:\SSDLC\Nexus_Unzips
          Write-Host "[INFO] Installing dependencies (ignoring postinstall scripts)..."
          npm install --ignore-scripts --no-audit
          Write-Host "[INFO] Launching server..."
          Start-Process powershell -ArgumentList "cd C:\SSDLC\Nexus_Unzips; npm start"
          Write-Host "[INFO] Waiting 25 seconds for server to be ready..."
          Start-Sleep -Seconds 25
          Write-Host "✅ Node.js server should be running at http://localhost:3000"
