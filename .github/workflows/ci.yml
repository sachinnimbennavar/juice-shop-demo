name: Juice Shop CI - Deploy Latest Builds

on:
  workflow_dispatch:

jobs:
  deploy-latest:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repository (needed only for scripts/config)
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Deploy frontend and server from Nexus
      - name: Deploy latest builds from Nexus
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          FRONTEND_PATH: C:\inetpub\wwwroot\juice-shop
          SERVER_PATH: C:\JuiceShopServer
        run: |
          Write-Host "[INFO] Starting deployment..."

          $base64Auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          function Get-LatestVersion($artifactId) {
              $artifactFolderUrl = "${env:NEXUS_URL}/com/example/juiceshop/$artifactId/"
              Write-Host "[INFO] Fetching available files from $artifactFolderUrl ..."
              
              try {
                  $response = Invoke-RestMethod -Uri $artifactFolderUrl -Headers $headers
                  $versions = ($response.links | Where-Object { $_.rel -eq "up" -or $_.href -match "^\d+$" }) | ForEach-Object { $_.href.TrimEnd('/') }
                  if ($versions.Count -eq 0) { throw "No versions found" }
                  $latestVersion = ($versions | Sort-Object -Descending)[0]
                  return $latestVersion
              } catch {
                  Write-Host "[WARN] Cannot fetch files for $artifactId. Falling back to local detection."
                  return $null
              }
          }

          # ===== FRONTEND =====
          $frontendVersion = Get-LatestVersion "frontend-build"
          if ($frontendVersion) {
              $frontendZipUrl = "${env:NEXUS_URL}/com/example/juiceshop/frontend-build/$frontendVersion/frontend-build-$frontendVersion.zip"
              Write-Host "[INFO] Downloading frontend ZIP from $frontendZipUrl ..."
              Invoke-WebRequest -Uri $frontendZipUrl -OutFile "frontend-build.zip" -Headers $headers

              Write-Host "[INFO] Extracting frontend to ${env:FRONTEND_PATH} ..."
              Remove-Item -Recurse -Force "${env:FRONTEND_PATH}\*" -ErrorAction SilentlyContinue
              Expand-Archive -Path "frontend-build.zip" -DestinationPath ${env:FRONTEND_PATH} -Force
              Write-Host "[SUCCESS] Frontend deployed successfully."
          }

          # ===== SERVER =====
          $serverVersion = Get-LatestVersion "server-build"
          if ($serverVersion) {
              $serverZipUrl = "${env:NEXUS_URL}/com/example/juiceshop/server-build/$serverVersion/server-build-$serverVersion.zip"
              Write-Host "[INFO] Downloading server ZIP from $serverZipUrl ..."
              Invoke-WebRequest -Uri $serverZipUrl -OutFile "server-build.zip" -Headers $headers

              Write-Host "[INFO] Extracting server to ${env:SERVER_PATH} ..."
              Remove-Item -Recurse -Force "${env:SERVER_PATH}\*" -ErrorAction SilentlyContinue
              Expand-Archive -Path "server-build.zip" -DestinationPath ${env:SERVER_PATH} -Force
              Write-Host "[SUCCESS] Server deployed successfully."
          }

          Write-Host "✅ Deployment completed successfully!"
