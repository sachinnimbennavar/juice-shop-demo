name: Start Node.js Server & Verify Port

on:
  workflow_dispatch:

jobs:
  start-server:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Start Juice Shop Server
        shell: pwsh
        run: |
          Write-Host 'Starting Juice Shop server...'
          Set-Location 'C:\SSDLC\Nexus_Unzips'

          # Kill any existing process on port 3000
          $connection = Get-NetTCPConnection -LocalPort 3000 -ErrorAction SilentlyContinue
          if ($connection) {
              $pid = $connection.OwningProcess
              Write-Host "Port 3000 in use by PID $pid - killing it..."
              Stop-Process -Id $pid -Force
          }

          # Start the server in background
          Write-Host 'Launching npm start in background...'
          $proc = Start-Process pwsh -ArgumentList "cd 'C:\SSDLC\Nexus_Unzips'; npm start" -WindowStyle Hidden -PassThru

          Write-Host 'Waiting for server to be ready on port 3000...'
          $timeout = 60
          $elapsed = 0
          while ($true) {
              try {
                  $resp = Invoke-WebRequest -Uri 'http://localhost:3000' -UseBasicParsing -TimeoutSec 5
                  if ($resp.StatusCode -eq 200) {
                      Write-Host '✅ Juice Shop is UP and running on http://localhost:3000'
                      break
                  }
              } catch { }
              Start-Sleep -Seconds 2
              $elapsed += 2
              if ($elapsed -ge $timeout) {
                  Write-Host '❌ Juice Shop server did not start within 60 seconds!'
                  exit 1
              }
          }
