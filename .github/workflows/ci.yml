name: Juice Shop CI - Deploy Latest Builds

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Latest Builds
    runs-on: self-hosted  # must be inside your network to access Nexus

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Starting Deployment
        shell: powershell
        run: |
          Write-Host "[INFO] Starting deployment..."

      - name: Fetch latest versions from Nexus metadata
        shell: powershell
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          $baseUrl = "http://10.158.124.198:9000/repository/JuiceShopMavenDemo/com/example/juiceshop"
          $creds = New-Object System.Management.Automation.PSCredential($env:NEXUS_USERNAME,(ConvertTo-SecureString $env:NEXUS_PASSWORD -AsPlainText -Force))

          function Get-LatestVersion([string]$metadataUrl) {
              $metadata = Invoke-WebRequest -Uri $metadataUrl -Credential $creds -UseBasicParsing
              $latest = [regex]::Match($metadata.Content, "<latest>(\d{14})</latest>").Groups[1].Value
              if (-not $latest) { Write-Error "Could not extract latest version from $metadataUrl"; exit 1 }
              return $latest
          }

          $frontendVersion = Get-LatestVersion "$baseUrl/frontend-build/maven-metadata.xml"
          $serverVersion   = Get-LatestVersion "$baseUrl/server-build/maven-metadata.xml"

          Write-Host "[INFO] Latest Frontend Version: $frontendVersion"
          Write-Host "[INFO] Latest Server Version: $serverVersion"

          Set-Content -Path $env:GITHUB_ENV -Value "FRONTEND_VERSION=$frontendVersion"
          Add-Content -Path $env:GITHUB_ENV -Value "SERVER_VERSION=$serverVersion"

      - name: Download and extract latest artifacts
        shell: powershell
        run: |
          $baseUrl = "http://10.158.124.198:9000/repository/JuiceShopMavenDemo/com/example/juiceshop"
          $creds = New-Object System.Management.Automation.PSCredential($env:NEXUS_USERNAME,(ConvertTo-SecureString $env:NEXUS_PASSWORD -AsPlainText -Force))

          $frontendUrl = "$baseUrl/frontend-build/${env:FRONTEND_VERSION}/frontend-build-${env:FRONTEND_VERSION}.zip"
          $serverUrl   = "$baseUrl/server-build/${env:SERVER_VERSION}/server-build-${env:SERVER_VERSION}.zip"

          Write-Host "[INFO] Downloading frontend: $frontendUrl"
          Write-Host "[INFO] Downloading server: $serverUrl"

          New-Item -ItemType Directory -Force -Path "C:\deploy\frontend" | Out-Null
          New-Item -ItemType Directory -Force -Path "C:\deploy\server" | Out-Null

          Invoke-WebRequest -Uri $frontendUrl -OutFile "frontend.zip" -Credential $creds
          Invoke-WebRequest -Uri $serverUrl -OutFile "server.zip" -Credential $creds

          Write-Host "[INFO] Extracting frontend..."
          Expand-Archive -Path "frontend.zip" -DestinationPath "C:\deploy\frontend" -Force

          Write-Host "[INFO] Extracting server..."
          Expand-Archive -Path "server.zip" -DestinationPath "C:\deploy\server" -Force

      - name: Verify deployment
        shell: powershell
        run: |
          if (Test-Path "C:\deploy\frontend\frontend\index.html" -and Test-Path "C:\deploy\server\package.json") {
              Write-Host "[SUCCESS] Deployment verified successfully."
          } else {
              Write-Host "[ERROR] Deployment verification failed."
              exit 1
          }

      - name: ✅ Deployment completed
        shell: powershell
        run: |
          Write-Host "[SUCCESS] Latest builds deployed successfully!"
