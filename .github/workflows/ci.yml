name: Juice Shop Frontend + Backend Deployment

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    env:
      FRONTEND_PATH: "C:\\SSDLC\\Nexus_Unzips\\frontend"
      DIST_PATH: "C:\\SSDLC\\Nexus_Unzips\\frontend\\dist"
      IIS_PATH: "C:\\inetpub\\wwwroot\\JuiceShop"
      SITE_NAME: "JuiceShopSite"
      BACKEND_PATH: "C:\\SSDLC\\Nexus_Unzips\\server"
      SERVICE_NAME: "JuiceShopBackend"

    steps:
      - name: Check Node.js version
        run: node -v

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_PATH }}
        run: npm ci

      - name: Build frontend (4GB memory)
        working-directory: ${{ env.FRONTEND_PATH }}
        run: |
          setx NODE_OPTIONS "--max-old-space-size=4096"
          npm run build -- --configuration production --watch=false --verbose

      - name: Deploy frontend to IIS
        shell: pwsh
        run: |
          Import-Module WebAdministration -ErrorAction Stop
          
          Write-Host "[INFO] Deploying Juice Shop frontend to IIS..."
          if (Test-Path $env:IIS_PATH) {
            Remove-Item -Recurse -Force -Path (Join-Path $env:IIS_PATH '*')
          } else {
            New-Item -ItemType Directory -Path $env:IIS_PATH | Out-Null
          }

          $distFolder = (Get-ChildItem -Path $env:DIST_PATH -Directory | Select-Object -First 1).FullName
          Copy-Item -Path (Join-Path $distFolder '*') -Destination $env:IIS_PATH -Recurse -Force

          if (-not (Get-Website | Where-Object { $_.Name -eq $env:SITE_NAME })) {
            New-Website -Name $env:SITE_NAME -Port 8080 -PhysicalPath $env:IIS_PATH -ApplicationPool "DefaultAppPool"
          } else {
            Restart-WebAppPool -Name "DefaultAppPool"
          }

          Write-Host "[INFO] Frontend deployed successfully to IIS on port 8080."

      - name: Setup or restart Node.js backend as Windows Service
        shell: pwsh
        run: |
          Write-Host "[INFO] Configuring Node.js backend as Windows service..."
          $serviceExe = "C:\\Program Files\\nssm\\win64\\nssm.exe"

          if (!(Test-Path $serviceExe)) {
            Write-Host "[INFO] nssm not found, please install it from https://nssm.cc/download"
            exit 1
          }

          if (Get-Service -Name $env:SERVICE_NAME -ErrorAction SilentlyContinue) {
            Write-Host "[INFO] Restarting existing service..."
            nssm stop $env:SERVICE_NAME
            nssm remove $env:SERVICE_NAME confirm
          }

          nssm install $env:SERVICE_NAME "C:\\Program Files\\nodejs\\node.exe" "$env:BACKEND_PATH\\server.js"
          nssm set $env:SERVICE_NAME AppDirectory $env:BACKEND_PATH
          nssm set $env:SERVICE_NAME Start SERVICE_AUTO_START
          nssm start $env:SERVICE_NAME

          Write-Host "[INFO] Backend service '$env:SERVICE_NAME' started successfully."
