name: Juice Shop CI - Deploy Latest Builds

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  deploy:
    name: Deploy Latest Builds
    runs-on: self-hosted  # Must be on machine with Nexus access
    needs: upload  # Wait for upload job

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Starting Deployment
        run: |
          Write-Host "[INFO] Starting deployment..."

      - name: Fetch latest versions from Nexus metadata
        run: |
          $baseUrl = 'http://127.0.0.1:8081/repository/JuiceShopMavenDemo/com/example/juiceshop'
          $creds = New-Object System.Management.Automation.PSCredential($env:NEXUS_USERNAME, (ConvertTo-SecureString $env:NEXUS_PASSWORD -AsPlainText -Force))

          function Get-LatestVersion([string]$metadataUrl, [string]$artifactName) {
              $metadataContent = (Invoke-WebRequest -Uri $metadataUrl -Credential $creds -UseBasicParsing).Content
              $latest = [regex]::Matches($metadataContent, "<latest>(\d{14})</latest>")[0].Groups[1].Value
              if (-not $latest) {
                  Write-Host "[ERROR] Could not extract latest version for $artifactName"
                  exit 1
              }
              Write-Host "[INFO] Latest version for $artifactName → $latest"
              return $latest
          }

          $frontendVersion = Get-LatestVersion "$baseUrl/frontend-build/maven-metadata.xml" "frontend-build"
          $serverVersion   = Get-LatestVersion "$baseUrl/server-build/maven-metadata.xml" "server-build"

          Set-Content -Path $env:GITHUB_ENV -Value "FRONTEND_VERSION=$frontendVersion"
          Add-Content -Path $env:GITHUB_ENV -Value "SERVER_VERSION=$serverVersion"

      - name: Download and extract latest artifacts
        run: |
          $baseUrl = 'http://127.0.0.1:8081/repository/JuiceShopMavenDemo/com/example/juiceshop'
          $frontendUrl = "$baseUrl/frontend-build/${env:FRONTEND_VERSION}/frontend-build-${env:FRONTEND_VERSION}.zip"
          $serverUrl   = "$baseUrl/server-build/${env:SERVER_VERSION}/server-build-${env:SERVER_VERSION}.zip"

          Write-Host "[INFO] Downloading frontend from: $frontendUrl"
          Write-Host "[INFO] Downloading server from: $serverUrl"

          New-Item -ItemType Directory -Force -Path "C:\deploy\frontend" | Out-Null
          New-Item -ItemType Directory -Force -Path "C:\deploy\server" | Out-Null

          Invoke-WebRequest -Uri $frontendUrl -OutFile "frontend.zip" -Credential $creds
          Invoke-WebRequest -Uri $serverUrl -OutFile "server.zip" -Credential $creds

          Write-Host "[INFO] Extracting frontend..."
          Expand-Archive frontend.zip -DestinationPath "C:\deploy\frontend" -Force

          Write-Host "[INFO] Extracting server..."
          Expand-Archive server.zip -DestinationPath "C:\deploy\server" -Force

      - name: Verify deployment
        run: |
          if (Test-Path "C:\deploy\frontend\frontend\index.html" -and
              Test-Path "C:\deploy\server\package.json") {
              Write-Host "[SUCCESS] Deployment verified successfully."
          } else {
              Write-Host "[ERROR] Deployment verification failed."
              exit 1
          }

      - name: ✅ Deployment completed
        run: |
          Write-Host "[SUCCESS] Latest builds deployed successfully!"
