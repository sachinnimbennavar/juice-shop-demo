name: Juice Shop Deployment (Full Build, No Postinstall Loop)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    env:
      DEPLOY_PATH_SERVER: C:\JuiceShopServer
      DEPLOY_PATH_FRONTEND: C:\JuiceShopServer\frontend

    steps:
      - name: 🧩 Checkout code
        uses: actions/checkout@v3

      - name: ⚡ Install dependencies and build frontend & backend
        shell: powershell
        run: |
          cd $env:DEPLOY_PATH_SERVER

          Write-Host "[INFO] Installing backend dependencies (skipping postinstall)..."
          npm install --legacy-peer-deps --ignore-scripts

          Write-Host "[INFO] Installing frontend dependencies..."
          cd frontend
          npm install --legacy-peer-deps
          Write-Host "[INFO] Building frontend..."
          npm run build -- --configuration production --watch=false --verbose
          cd ..

          Write-Host "[INFO] Building backend..."
          npm run build:server

          Write-Host "[INFO] Starting backend server..."
          Start-Process -FilePath "npm.cmd" -ArgumentList "run start" -NoNewWindow
          Write-Host "[SUCCESS] Backend server started."

      - name: ✅ Deployment Complete
        shell: powershell
        run: |
          Write-Host "[INFO] Full deployment completed successfully."
          Write-Host "[INFO] Access Juice Shop at http://localhost:3000"
