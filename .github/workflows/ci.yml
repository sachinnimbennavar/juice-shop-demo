name: Juice Shop Full Repo Upload

on:
  workflow_dispatch:

jobs:
  full-repo-upload:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js v22
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.19.0'

      # 3️⃣ Cache backend dependencies
      - name: Cache backend node_modules
        uses: actions/cache@v3
        with:
          path: |
            node_modules
          key: backend-${{ hashFiles('package-lock.json') }}

      # 4️⃣ Install backend dependencies
      - name: Install backend dependencies
        shell: powershell
        run: |
          Write-Host "[INFO] Installing backend dependencies..."
          npm install --legacy-peer-deps

      # 5️⃣ Build backend
      - name: Build backend
        shell: powershell
        run: |
          Write-Host "[INFO] Starting backend build..."
          npm run build:server

      # 6️⃣ Cache frontend dependencies
      - name: Cache frontend node_modules
        uses: actions/cache@v3
        with:
          path: frontend/node_modules
          key: frontend-${{ hashFiles('frontend/package-lock.json') }}

      # 7️⃣ Build frontend
      - name: Build frontend (optimized)
        shell: powershell
        run: |
          Write-Host "[INFO] Building frontend..."
          cd frontend
          npm install --legacy-peer-deps --ignore-scripts
          ng build --configuration production
          cd ..

      # 8️⃣ Create full repo ZIP including build, logs, node_modules
      - name: Create full repo ZIP
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          $version = (Get-Date -Format "yyyyMMddHHmmss")
          $zipFile = "full-repo-$version.zip"
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          # Explicitly include all folders and files
          $itemsInOrder = @(
            ".dependabot",".github",".gitlab",".well-known",".zap",
            "build","config","data","encryptionkeys","frontend","ftp","i18n",
            "lib","logs","models","monitoring","node_modules","routes","rsn",
            "screenshots","test","uploads","vagrant","views",
            ".codeclimate.yml",".devcontainer.json",".dockerignore",".eslintrc.js",
            ".gitignore",".gitlab-ci.yml",".gitpod.yml",".mailmap",".npmrc",
            "app.json","app.ts","CODE_OF_CONDUCT.md","config.schema.yml","CONTRIBUTING.md",
            "crowdin.yaml","ctf.key","cypress.config.ts","docker-compose.test.yml",
            "Dockerfile","Gruntfile.js","HALL_OF_FAME.md","LICENSE","package.json",
            "README.md","REFERENCES.md","SECURITY.md","server.ts","SOLUTIONS.md",
            "swagger.yml","threat-model.json","tsconfig.json"
          )

          $itemsToZip = $itemsInOrder | Where-Object { Test-Path $_ }

          if (Test-Path $zipFile) { Remove-Item $zipFile -Force }

          foreach ($item in $itemsToZip) {
              Write-Host "Adding $item to ZIP..."
              Compress-Archive -Path $item -Update -DestinationPath $zipFile
          }

          Write-Host "✅ Full repo ZIP created: $zipFile"

          # 9️⃣ Upload ZIP to Nexus
          $nexusUrl = "${env:NEXUS_URL}/com/example/juiceshop/full-repo/$version/$zipFile"
          Write-Host "⬆️ Uploading to Nexus → $nexusUrl"
          Invoke-RestMethod -Uri $nexusUrl -Method Put -InFile $zipFile -Headers $headers -ContentType "application/zip"
          Write-Host "✅ Full repo uploaded successfully."
