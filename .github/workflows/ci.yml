name: Juice Shop Demo Deployment

on:
  workflow_dispatch: # manual trigger

jobs:
  deploy:
    runs-on: self-hosted

    env:
      NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
      DEPLOY_PATH_FRONTEND: C:\JuiceShopServer\frontend
      DEPLOY_PATH_SERVER: C:\JuiceShopServer\server

    steps:
      - name: 🧩 Checkout code
        uses: actions/checkout@v3

      - name: ⚙️ Setup PowerShell environment
        shell: powershell
        run: |
          Write-Host "[INFO] Deployment job started..."
          Write-Host "Working directory: $PWD"

      - name: 🚀 Deploy from Nexus (prebuilt frontend & backend)
        shell: powershell
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          BUILD_VERSION: 20251022135017
        run: |
          Write-Host "[INFO] Starting deployment..."

          # Prepare Basic Auth
          $base64Auth = [System.Convert]::ToBase64String(
              [System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}")
          )
          $headers = @{ Authorization = "Basic $base64Auth" }

          # --- Frontend ---
          $frontendUrl = "${env:NEXUS_URL}/com/example/juiceshop/frontend-build/$env:BUILD_VERSION/frontend-build-$env:BUILD_VERSION.zip"
          Write-Host "[INFO] Downloading frontend..."
          Invoke-WebRequest -Uri $frontendUrl -OutFile "frontend.zip" -Headers $headers
          if (Test-Path "frontend.zip") {
              Remove-Item -Recurse -Force "${env:DEPLOY_PATH_FRONTEND}" -ErrorAction SilentlyContinue
              Expand-Archive -Path "frontend.zip" -DestinationPath "${env:DEPLOY_PATH_FRONTEND}" -Force
              Write-Host "[SUCCESS] Frontend deployed!"
          } else { exit 1 }

          # --- Backend ---
          $serverUrl = "${env:NEXUS_URL}/com/example/juiceshop/server-build/$env:BUILD_VERSION/server-build-$env:BUILD_VERSION.zip"
          Write-Host "[INFO] Downloading backend..."
          Invoke-WebRequest -Uri $serverUrl -OutFile "server.zip" -Headers $headers
          if (Test-Path "server.zip") {
              Remove-Item -Recurse -Force "${env:DEPLOY_PATH_SERVER}" -ErrorAction SilentlyContinue
              Expand-Archive -Path "server.zip" -DestinationPath "${env:DEPLOY_PATH_SERVER}" -Force
              Write-Host "[SUCCESS] Backend deployed!"
          } else { exit 1 }

          # --- Install backend dependencies ---
          Write-Host "[INFO] Installing server dependencies..."
          cd "${env:DEPLOY_PATH_SERVER}"
          npm install --legacy-peer-deps

          # --- Start server ---
          Write-Host "[INFO] Starting Juice Shop server..."
          Start-Process "node" "app.js" -NoNewWindow

          Write-Host "✅ Deployment completed. Juice Shop is running!"
