name: Test OWASP ZAP Scan

on:
  workflow_dispatch:

jobs:
  zap-scan:
    runs-on: self-hosted

    steps:
      - name: Run OWASP ZAP Scan via Desktop Shortcut
        shell: cmd
        run: |
          echo Running OWASP ZAP Scan...
          
          if not exist "C:\SSDLC\ZapScan_Reports" mkdir C:\SSDLC\ZapScan_Reports
          
          rem Run a quick scan against Juice Shop using the desktop shortcut
          "C:\Users\Public\Desktop\ZAP 2.16.1.lnk" -cmd -quickurl http://localhost:3000 -quickout C:\SSDLC\ZapScan_Reports\zap_report.html
          
          echo ✅ OWASP ZAP scan completed. Report saved at C:\SSDLC\ZapScan_Reports\zap_report.html
