name: Juice Shop CI/CD Deployment

on:
  workflow_dispatch:  # manual trigger

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Copy latest unzipped files from Nexus to IIS deployment folder
      - name: Copy files to IIS deployment folder
        run: |
          $source = "C:\SSDLC\Nexus_Unzips\*"
          $destination = "C:\inetpub\wwwroot\JuiceShop"
          Write-Output "Clearing IIS deployment folder..."
          Remove-Item -Recurse -Force $destination\*
          Write-Output "Copying latest files from Nexus unzips..."
          Copy-Item -Path $source -Destination $destination -Recurse

      # 3️⃣ Install Node.js dependencies
      - name: Install Node.js dependencies
        run: |
          cd C:\inetpub\wwwroot\JuiceShop
          npm install

      # 4️⃣ Ensure web.config exists
      - name: Configure IIS web.config
        run: |
          $webConfigPath = "C:\inetpub\wwwroot\JuiceShop\web.config"
          if (!(Test-Path $webConfigPath)) {
              $webConfig = @"
<configuration>
  <system.webServer>
    <handlers>
      <add name="iisnode" path="server.js" verb="*" modules="iisnode"/>
    </handlers>
    <rewrite>
      <rules>
        <rule name="StaticContent">
          <action type="Rewrite" url="server.js"/>
        </rule>
      </rules>
    </rewrite>
  </system.webServer>
</configuration>
"@
              $webConfig | Out-File -FilePath $webConfigPath -Encoding UTF8
          }

      # 5️⃣ Restart IIS site
      - name: Restart IIS Site
        run: |
          Import-Module WebAdministration
          Stop-Website -Name "JuiceShop"
          Start-Website -Name "JuiceShop"

      # 6️⃣ Check if the site is running
      - name: Verify Juice Shop site
        run: |
          try {
              $response = Invoke-WebRequest -Uri "http://localhost:3000" -UseBasicParsing -TimeoutSec 10
              if ($response.StatusCode -eq 200) {
                  Write-Output "✅ Juice Shop is running successfully!"
              } else {
                  Write-Output "❌ Juice Shop is not running. Status code: $($response.StatusCode)"
              }
          } catch {
              Write-Output "❌ Juice Shop site check failed: $($_.Exception.Message)"
          }

      # 7️⃣ Deployment complete
      - name: Deployment Complete
        run: |
          Write-Output "Juice Shop deployment finished!"
