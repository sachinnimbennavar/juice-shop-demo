name: Juice Shop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set Node memory for server build
      - name: Set Node memory
        run: set NODE_OPTIONS=--max_old_space_size=4096

      # 3️⃣ Cache frontend dependencies and Angular build output
      - name: Cache frontend
        uses: actions/cache@v3
        with:
          path: |
            frontend/node_modules
            frontend/dist
            frontend/.angular
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      # 4️⃣ Cache server dependencies
      - name: Cache server
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-server-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-server-

      # 5️⃣ Install frontend dependencies
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps --prefer-offline --no-audit
          cd ..

      # 6️⃣ Build frontend
      - name: Build frontend
        run: |
          cd frontend
          npm run build -- --configuration production --watch=false --verbose
          cd ..

      # 7️⃣ Install server dependencies
      - name: Install server dependencies
        run: npm install --prefer-offline --no-audit

      # 8️⃣ Build server
      - name: Build server
        run: npm run build:server

      # 9️⃣ Optional SonarQube analysis (safe skip if not installed)
      - name: SonarQube Scan
        run: |
          if (Get-Command sonar-scanner -ErrorAction SilentlyContinue) {
              echo "Running SonarQube scanner..."
              set SONAR_HOST_URL=http://127.0.0.1:9000
              sonar-scanner
          } else {
              echo "sonar-scanner not found, skipping SonarQube analysis."
          }

      # 🔟 Nexus Upload Phase (updated to include server folder)
      - name: Nexus Upload
        shell: pwsh
        run: |
          Write-Host "Preparing artifacts for Nexus upload..."
          
          # Create temp folder
          mkdir temp_artifacts -ErrorAction SilentlyContinue
          
          # Copy frontend if it exists
          if (Test-Path frontend/dist) {
              Copy-Item -Recurse frontend/dist temp_artifacts/frontend -Force
          }

          # Copy server build if it exists
          if (Test-Path server/build) {
              Copy-Item -Recurse server/build temp_artifacts/server -Force
          }

          # Compress only if something exists
          if ((Get-ChildItem temp_artifacts | Measure-Object).Count -gt 0) {
              Compress-Archive -Path temp_artifacts/* -DestinationPath juice-shop-build.zip -Force
              
              Write-Host "Uploading artifact to Nexus..."
              $url = "${env:NEXUS_URL}/juice-shop-build-${env:GITHUB_RUN_NUMBER}.zip"
              Invoke-RestMethod -Uri $url -Method Put -InFile juice-shop-build.zip -Headers @{Authorization = ("Basic {0}" -f [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}")))}

              Write-Host "Nexus upload completed successfully."
          } else {
              Write-Host "No artifacts found, Nexus phase marked successful."
          }
