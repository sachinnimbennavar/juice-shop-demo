name: Juice Shop Deployment - Unzip Only

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    env:
      ZIP_SOURCE_PATH: C:\SSDLC\Nexus_Zips   # path where the latest ZIP exists
      UNZIP_PATH: C:\SSDLC\Nexus_Unzips

    steps:
      - name: ⚙️ Setup PowerShell environment
        shell: powershell
        run: |
          Write-Host "[INFO] Deployment job started..."
          Write-Host "Working directory: $PWD"

      - name: 🚀 Clean and unzip full repo
        shell: powershell
        run: |
          # Find the latest ZIP file in ZIP_SOURCE_PATH
          $latestZip = Get-ChildItem -Path $env:ZIP_SOURCE_PATH -Filter "full-repo-*.zip" | Sort-Object LastWriteTime -Descending | Select-Object -First 1

          if (-not $latestZip) {
              Write-Host "[ERROR] No ZIP file found in $env:ZIP_SOURCE_PATH"
              exit 1
          }

          Write-Host "[INFO] Latest ZIP found: $($latestZip.FullName)"

          # Clean the unzip path
          if (Test-Path $env:UNZIP_PATH) {
              Write-Host "[INFO] Cleaning existing folder: $env:UNZIP_PATH ..."
              Remove-Item -Path "$env:UNZIP_PATH\*" -Recurse -Force
          } else {
              Write-Host "[INFO] Creating folder: $env:UNZIP_PATH ..."
              New-Item -ItemType Directory -Path $env:UNZIP_PATH
          }

          # Unzip latest ZIP directly
          Write-Host "[INFO] Extracting $($latestZip.FullName) to $env:UNZIP_PATH ..."
          Expand-Archive -Path $latestZip.FullName -DestinationPath $env:UNZIP_PATH -Force
          Write-Host "[SUCCESS] Full repo unzipped successfully!"
