name: Juice Shop IIS Deployment

on:
  workflow_dispatch:

jobs:
  deploy-iis:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repository (needed if you want version control in IIS files)
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      # 2️⃣ Deploy Frontend
      - name: Deploy Frontend to IIS
        shell: powershell
        run: |
          $frontendSource = "C:\SSDLC\Nexus_Unzips\frontend\dist\frontend"
          $frontendIISPath = "C:\inetpub\wwwroot\JuiceShopFrontend"
          $backendURL = "http://localhost/JuiceShopBackend"

          Write-Host "[INFO] Deploying frontend..."
          if (-Not (Test-Path $frontendIISPath)) { New-Item -ItemType Directory -Path $frontendIISPath | Out-Null }
          Remove-Item -Path "$frontendIISPath\*" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$frontendSource\*" -Destination $frontendIISPath -Recurse

          # Update API URL
          $envFile = Join-Path $frontendIISPath "assets\environment.prod.js"
          if (Test-Path $envFile) {
              (Get-Content $envFile) -replace 'apiUrl\s*:\s*["\'].*["\']', "apiUrl: '$backendURL'" | Set-Content $envFile
              Write-Host "[INFO] Frontend API URL updated."
          }

          # Angular web.config for SPA routing
          $webConfig = @"
<configuration>
  <system.webServer>
    <rewrite>
      <rules>
        <rule name='Angular Routes' stopProcessing='true'>
          <match url='.*' />
          <conditions logicalGrouping='MatchAll'>
            <add input='{REQUEST_FILENAME}' matchType='IsFile' negate='true' />
            <add input='{REQUEST_FILENAME}' matchType='IsDirectory' negate='true' />
          </conditions>
          <action type='Rewrite' url='/index.html' />
        </rule>
      </rules>
    </rewrite>
  </system.webServer>
</configuration>
"@
          $webConfigPath = Join-Path $frontendIISPath "web.config"
          $webConfig | Out-File -FilePath $webConfigPath -Encoding UTF8
          Write-Host "[INFO] Frontend deployed."

      # 3️⃣ Deploy Backend
      - name: Deploy Backend to IIS
        shell: powershell
        run: |
          $backendSource = "C:\SSDLC\Nexus_Unzips\server"
          $backendIISPath = "C:\inetpub\wwwroot\JuiceShopBackend"

          Write-Host "[INFO] Deploying backend..."
          if (-Not (Test-Path $backendIISPath)) { New-Item -ItemType Directory -Path $backendIISPath | Out-Null }
          Remove-Item -Path "$backendIISPath\*" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$backendSource\*" -Destination $backendIISPath -Recurse

          # iisnode web.config for Node.js backend
          $backendWebConfig = @"
<configuration>
  <system.webServer>
    <handlers>
      <add name='iisnode' path='server.js' verb='*' modules='iisnode'/>
    </handlers>
    <rewrite>
      <rules>
        <rule name='Nodejs' stopProcessing='true'>
          <match url='.*' />
          <action type='Rewrite' url='server.js'/>
        </rule>
      </rules>
    </rewrite>
    <iisnode nodeProcessCommandLine='C:\Program Files\nodejs\node.exe' />
  </system.webServer>
</configuration>
"@
          $backendWebConfigPath = Join-Path $backendIISPath "web.config"
          $backendWebConfig | Out-File -FilePath $backendWebConfigPath -Encoding UTF8
          Write-Host "[INFO] Backend deployed."

      # 4️⃣ Restart IIS
      - name: Restart IIS
        shell: powershell
        run: |
          Write-Host "[INFO] Restarting IIS..."
          Import-Module WebAdministration
          iisreset
          Write-Host "[INFO] IIS restarted. Frontend and backend are live!"
