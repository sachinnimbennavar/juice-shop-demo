name: Juice Shop CI - Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout code (optional)
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set environment variables
      - name: Set environment variables
        shell: powershell
        run: |
          $env:NEXUS_URL = "http://127.0.0.1:8081/repository/JuiceShopMavenDemo"
          $env:NEXUS_USERNAME = "${{ secrets.NEXUS_USERNAME }}"
          $env:NEXUS_PASSWORD = "${{ secrets.NEXUS_PASSWORD }}"

      # 3️⃣ Deploy frontend
      - name: Download and deploy latest frontend build
        shell: powershell
        run: |
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          # Get the list of versions
          $versionsHtml = Invoke-RestMethod -Uri "${env:NEXUS_URL}/com/example/juiceshop/frontend-build/" -Headers $headers

          # Parse folder names (timestamps)
          $latestVersion = ($versionsHtml.Links | Where-Object { $_ -match '^\d+$' } | Sort-Object -Descending)[0]
          Write-Host "[INFO] Latest frontend version: $latestVersion"

          $frontendUrl = "${env:NEXUS_URL}/com/example/juiceshop/frontend-build/$latestVersion/frontend-build-$latestVersion.zip"
          Write-Host "[INFO] Downloading frontend ZIP from $frontendUrl"

          Invoke-WebRequest -Uri $frontendUrl -OutFile "frontend-build.zip" -Headers $headers

          # Extract ZIP
          if (Test-Path "frontend-build.zip") {
              Write-Host "[INFO] Extracting frontend ZIP..."
              Expand-Archive -Path "frontend-build.zip" -DestinationPath "C:\inetpub\wwwroot\juice-shop-frontend" -Force
              Write-Host "[SUCCESS] Frontend deployed to C:\inetpub\wwwroot\juice-shop-frontend"
          } else {
              Write-Host "[WARN] Frontend ZIP not found, skipping extraction."
          }

      # 4️⃣ Deploy server
      - name: Download and deploy latest server build
        shell: powershell
        run: |
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          $versionsHtml = Invoke-RestMethod -Uri "${env:NEXUS_URL}/com/example/juiceshop/server-build/" -Headers $headers
          $latestVersion = ($versionsHtml.Links | Where-Object { $_ -match '^\d+$' } | Sort-Object -Descending)[0]
          Write-Host "[INFO] Latest server version: $latestVersion"

          $serverUrl = "${env:NEXUS_URL}/com/example/juiceshop/server-build/$latestVersion/server-build-$latestVersion.zip"
          Write-Host "[INFO] Downloading server ZIP from $serverUrl"

          Invoke-WebRequest -Uri $serverUrl -OutFile "server-build.zip" -Headers $headers

          if (Test-Path "server-build.zip") {
              Expand-Archive -Path "server-build.zip" -DestinationPath "C:\JuiceShopServer" -Force
              Write-Host "[SUCCESS] Server deployed to C:\JuiceShopServer"
          } else {
              Write-Host "[WARN] Server ZIP not found, skipping extraction."
          }

      - name: Deployment complete
        run: Write-Host "✅ All latest builds deployed successfully!"
