name: Juice Shop CI + Manual Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # enables manual run for deploy only

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set Node memory
      - name: Set Node memory
        run: set NODE_OPTIONS=--max_old_space_size=4096

      # 3️⃣ Cache frontend dependencies
      - name: Cache frontend
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/cache@v3
        with:
          path: |
            frontend/node_modules
            frontend/dist
            frontend/.angular
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      # 4️⃣ Cache server dependencies
      - name: Cache server
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-server-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-server-

      # 5️⃣ Install frontend dependencies
      - name: Install frontend dependencies
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          cd frontend
          npm install --legacy-peer-deps --prefer-offline --no-audit
          cd ..

      # 6️⃣ Build frontend
      - name: Build frontend
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          cd frontend
          npm run build -- --configuration production --watch=false --verbose
          cd ..

      # 7️⃣ Install server dependencies
      - name: Install server dependencies
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: npm install --prefer-offline --no-audit

      # 8️⃣ Build server
      - name: Build server
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: npm run build:server

      # 9️⃣ Upload artifacts to Nexus (only during push/PR)
      - name: Upload build artifacts to Maven Nexus
        if: ${{ github.event_name != 'workflow_dispatch' }}
        shell: powershell
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          Write-Host "[INFO] Packaging and uploading build artifacts..."
          $version = $env:GITHUB_RUN_NUMBER
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          if (Test-Path "frontend/dist") {
              Compress-Archive -Path "frontend/dist/*" -DestinationPath "frontend-build-$version.zip" -Force
          }

          $serverPaths = @(
              "app.ts","server.ts","package.json","tsconfig.json",
              "models","routes","lib","data","views","rsn","config","build"
          ) | Where-Object { Test-Path $_ }
          if ($serverPaths.Count -gt 0) {
              Compress-Archive -Path $serverPaths -DestinationPath "server-build-$version.zip" -Force
          }

          if (Test-Path "frontend-build-$version.zip") {
              Write-Host "[INFO] Uploading frontend build to Nexus..."
              Invoke-RestMethod -Uri "${env:NEXUS_URL}/repository/JuiceShopMavenDemo/com/example/juiceshop/frontend-build/$version/frontend-build-$version.zip" `
                                -Method Put -InFile "frontend-build-$version.zip" -Headers $headers
          }

          if (Test-Path "server-build-$version.zip") {
              Write-Host "[INFO] Uploading server build to Nexus..."
              Invoke-RestMethod -Uri "${env:NEXUS_URL}/repository/JuiceShopMavenDemo/com/example/juiceshop/server-build/$version/server-build-$version.zip" `
                                -Method Put -InFile "server-build-$version.zip" -Headers $headers
          }

      # 🔟 Deployment stage (always available)
      - name: Deploy from Maven Nexus
        shell: powershell
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          FRONTEND_DEST: C:\inetpub\wwwroot\juice-shop
          SERVER_DEST: C:\JuiceShopServer
          SERVER_PROCESS_NAME: JuiceShopServer
        run: |
          Write-Host "[INFO] Starting deployment..."
          $version = Read-Host "Enter version number to deploy (e.g., 123)" 
          if (-not $version) { 
              $version = $env:GITHUB_RUN_NUMBER 
              Write-Host "[INFO] Using current run number $version"
          }

          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          function Download-And-Extract {
              param([string]$url, [string]$destination)
              if (-not $url) { Write-Host "[WARN] No URL provided"; return }
              $zipFile = Join-Path $env:TEMP ([System.IO.Path]::GetFileName($url))
              Write-Host "[INFO] Downloading $url ..."
              Invoke-WebRequest -Uri $url -OutFile $zipFile -Headers $headers
              if (-not (Test-Path $destination)) { 
                  New-Item -ItemType Directory -Path $destination -Force | Out-Null 
              }
              Expand-Archive -Path $zipFile -DestinationPath $destination -Force
              Write-Host "[INFO] Extracted to $destination"
          }

          # Deploy frontend
          $frontendUrl = "${env:NEXUS_URL}/repository/JuiceShopMavenDemo/com/example/juiceshop/frontend-build/$version/frontend-build-$version.zip"
          Download-And-Extract -url $frontendUrl -destination $env:FRONTEND_DEST
          Write-Host "[INFO] Frontend deployed to $env:FRONTEND_DEST"

          # Deploy server
          $serverUrl = "${env:NEXUS_URL}/repository/JuiceShopMavenDemo/com/example/juiceshop/server-build/$version/server-build-$version.zip"
          Download-And-Extract -url $serverUrl -destination $env:SERVER_DEST
          Write-Host "[INFO] Server deployed to $env:SERVER_DEST"

          # Restart Node.js server via NSSM
          if (Get-Command nssm -ErrorAction SilentlyContinue) {
              Write-Host "[INFO] Restarting Node.js service via NSSM..."
              if (Get-Service -Name $env:SERVER_PROCESS_NAME -ErrorAction SilentlyContinue) {
                  Stop-Service -Name $env:SERVER_PROCESS_NAME -Force
                  Start-Sleep -Seconds 5
              }
              if (-not (Get-Service -Name $env:SERVER_PROCESS_NAME -ErrorAction SilentlyContinue)) {
                  nssm install $env:SERVER_PROCESS_NAME "C:\Program Files\nodejs\node.exe" "$env:SERVER_DEST\build\server.js"
              }
              Start-Service -Name $env:SERVER_PROCESS_NAME
              Write-Host "[INFO] Deployment completed successfully!"
          } else {
              Write-Host "[ERROR] NSSM not installed. Install NSSM or manage Node server manually."
          }
