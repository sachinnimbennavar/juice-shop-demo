name: Juice Shop Full CI/CD Pipeline (Ultra Fast + OWASP ZAP Scan)

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build-upload-deploy:
    runs-on: self-hosted
    timeout-minutes: 180

    steps:
      # 1️⃣ Ultra-Fast Checkout (minimal)
      - name: Checkout repository (ultra-fast)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          submodules: false
          clean: false
          persist-credentials: false

      # 2️⃣ Cache frontend + backend build outputs (node_modules excluded)
      - name: Cache build outputs
        uses: actions/cache@v4
        with:
          path: |
            frontend/dist
            build
          key: ${{ runner.os }}-juiceshop-${{ hashFiles('package-lock.json', 'frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-juiceshop-

      # 3️⃣ Pre-check: Ensure build/app.js exists before artifact creation
      - name: Pre-check build/app.js
        shell: powershell
        run: |
          $requiredFile = "build/app.js"
          if (-Not (Test-Path $requiredFile)) {
              Write-Host "[ERROR] Missing $requiredFile! Run 'npm run build:server' locally or in prior CI step."
              exit 1
          } else {
              Write-Host "[INFO] Found required file: $requiredFile"
          }

      # 4️⃣ Prepare deployment artifact (excluding node_modules)
      - name: Prepare deployment artifact
        shell: powershell
        run: |
          Write-Host "[INFO] Preparing deployment artifact (excluding node_modules)..."
          $artifactFolder = "build_output"
          if (Test-Path $artifactFolder) { Remove-Item -Recurse -Force $artifactFolder }
          New-Item -ItemType Directory -Path $artifactFolder | Out-Null
          
          # Include only necessary files
          $filesToInclude = @("frontend/dist/frontend","build","package.json","web.config")
          foreach ($item in $filesToInclude) {
              if (Test-Path $item) {
                  $dest = Join-Path $artifactFolder $item
                  $destDir = Split-Path $dest
                  if (!(Test-Path $destDir)) { New-Item -ItemType Directory -Path $destDir -Force | Out-Null }
                  Copy-Item -Path $item -Destination $dest -Recurse -Force
              } else {
                  Write-Host "[ERROR] Required item missing: $item"
                  exit 1
              }
          }
          Write-Host "[INFO] Artifact ready at $artifactFolder"

      # 5️⃣ Upload artifact to Nexus
      - name: Upload artifact to Nexus
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          $version = (Get-Date -Format "yyyyMMddHHmmss")
          $serverZip = "full-repo-$version.zip"
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }
          if (Test-Path $serverZip) { Remove-Item $serverZip -Force }
          Compress-Archive -Path "build_output/*" -DestinationPath $serverZip -Force
          $serverUrl = "${env:NEXUS_URL}/com/example/juiceshop/full-repo/$version/$serverZip"
          Write-Host "[INFO] Uploading $serverZip to Nexus → $serverUrl"
          Invoke-RestMethod -Uri $serverUrl -Method Put -InFile $serverZip -Headers $headers -ContentType "application/zip"
          Write-Host "✅ Artifact uploaded successfully."

      # 6️⃣ Download & unzip latest artifact from Nexus
      - name: Download & unzip latest artifact from Nexus
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081
          NEXUS_REPO: JuiceShopMavenDemo
          DEPLOY_PATH: C:\SSDLC\Nexus_Unzips
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          Write-Host "[INFO] Starting artifact download..."
          if (Test-Path $env:DEPLOY_PATH) {
              Write-Host "[INFO] Clearing old files from $env:DEPLOY_PATH..."
              Remove-Item -Path "$env:DEPLOY_PATH\*" -Recurse -Force
          } else {
              New-Item -ItemType Directory -Path $env:DEPLOY_PATH -Force | Out-Null
          }
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }
          $searchUrl = "${env:NEXUS_URL}/service/rest/v1/search?repository=${env:NEXUS_REPO}&group=com.example.juiceshop&name=full-repo"
          $response = Invoke-RestMethod -Uri $searchUrl -Headers $headers -Method Get
          if ($null -eq $response.items -or $response.items.Count -eq 0) {
              Write-Host "[ERROR] No full-repo versions found in Nexus!"
              exit 1
          }
          $latest = $response.items | Sort-Object { $_.version } -Descending | Select-Object -First 1
          $latestVersion = $latest.version
          $zipDownloadUrl = $latest.assets[0].downloadUrl
          Write-Host "[INFO] Latest version: $latestVersion"
          $zipFilePath = Join-Path $env:DEPLOY_PATH "full-repo-$latestVersion.zip"
          Write-Host "[INFO] Downloading ZIP to $zipFilePath ..."
          Invoke-WebRequest -Uri $zipDownloadUrl -OutFile $zipFilePath -Headers $headers
          Expand-Archive -Path $zipFilePath -DestinationPath $env:DEPLOY_PATH -Force
          Write-Host "✅ Artifact downloaded and extracted successfully."

      # 6.1️⃣ Install backend dependencies on deployment server
      - name: Install backend dependencies
        shell: powershell
        env:
          DEPLOY_PATH: C:\SSDLC\Nexus_Unzips
        run: |
          Write-Host "[INFO] Installing backend dependencies (production only)..."
          cd $env:DEPLOY_PATH
          npm install --production
          Write-Host "✅ Backend dependencies installed successfully."

      # 7️⃣ Deploy to IIS
      - name: Deploy to IIS
        shell: powershell
        env:
          DEPLOY_SOURCE: C:\SSDLC\Nexus_Unzips
          DEPLOY_TARGET: C:\inetpub\wwwroot\JuiceShop
          IIS_APPPOOL: JuiceShopAppPool
          IIS_SITE: "Default Web Site"
        run: |
          Import-Module WebAdministration
          Write-Host "[INFO] Deploying artifact to IIS..."
          if (Test-Path $env:DEPLOY_TARGET) {
              Remove-Item -Path "$env:DEPLOY_TARGET\*" -Recurse -Force
          } else {
              New-Item -ItemType Directory -Path $env:DEPLOY_TARGET -Force | Out-Null
          }
          Copy-Item -Path "$env:DEPLOY_SOURCE\*" -Destination $env:DEPLOY_TARGET -Recurse -Force
          if (-not (Test-Path "IIS:\AppPools\$env:IIS_APPPOOL")) {
              New-WebAppPool -Name $env:IIS_APPPOOL | Out-Null
              Set-ItemProperty "IIS:\AppPools\$env:IIS_APPPOOL" -Name processModel.identityType -Value "ApplicationPoolIdentity"
          }
          if (-not (Test-Path "IIS:\Sites\$env:IIS_SITE")) {
              New-Website -Name $env:IIS_SITE -PhysicalPath $env:DEPLOY_TARGET -Port 80 -Force | Out-Null
          }
          Set-ItemProperty "IIS:\Sites\$env:IIS_SITE" -Name applicationPool -Value $env:IIS_APPPOOL
          Restart-WebAppPool -Name $env:IIS_APPPOOL
          Write-Host "✅ IIS Deployment completed successfully!"

      # 8️⃣ Run OWASP ZAP Scan
      - name: Run OWASP ZAP Scan
        shell: powershell
        env:
          ZAP_PATH: C:\SSDLC\ZAP_2_16_1_windows.exe
          ZAP_REPORT_PATH: C:\SSDLC\ZapScan_Reports
        run: |
          cd C:\SSDLC\Nexus_Unzips
          Start-Process "cmd.exe" -ArgumentList "/c npm start" -NoNewWindow
          Start-Sleep -Seconds 25
          if (-Not (Test-Path $env:ZAP_REPORT_PATH)) { New-Item -ItemType Directory -Path $env:ZAP_REPORT_PATH | Out-Null }
          $timestamp = Get-Date -Format "yyyyMMddHHmmss"
          $reportFile = Join-Path $env:ZAP_REPORT_PATH "ZapReport_$timestamp.html"
          Start-Process -FilePath $env:ZAP_PATH -ArgumentList "-cmd", "-quickurl", "http://localhost:3000", "-quickout", $reportFile, "-quickprogress"
          Start-Sleep -Seconds 180
