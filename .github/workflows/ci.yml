name: Retry Backend Build Only

on:
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Install TypeScript
        shell: powershell
        run: |
          Write-Host "[INFO] Installing TypeScript..."
          npm install typescript --save-dev

      - name: Run backend build (PowerShell-safe, ASCII only)
        shell: powershell
        run: |
          Write-Host "[INFO] Starting backend build..."
          try {
            npm run --silent build:server
            $code = $LASTEXITCODE
            if ($code -eq 0) {
              Write-Host "[INFO] Backend build completed successfully."
            } else {
              Write-Host "[ERROR] Backend build finished with non-zero exit code: $code"
              exit $code
            }
          } catch {
            Write-Host "[INFO] No backend build script found or an exception occurred. Skipping backend build."
          }
