name: CD Pipeline

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    env:
      BASE_PATH: C:\JuiceShopServer
      FRONTEND_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo/com/example/juiceshop/frontend-build/20251022135017/frontend-build-20251022135017.zip
      SERVER_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo/com/example/juiceshop/server-build/20251022134021/server-build-20251022134021.zip

    steps:
      - name: Create deployment folder
        run: New-Item -ItemType Directory -Force -Path "${{ env.BASE_PATH }}"

      - name: Download frontend ZIP
        run: |
          Invoke-WebRequest -Uri "${{ env.FRONTEND_URL }}" -OutFile "${{ env.BASE_PATH }}\frontend.zip"

      - name: Download server ZIP
        run: |
          Invoke-WebRequest -Uri "${{ env.SERVER_URL }}" -OutFile "${{ env.BASE_PATH }}\server.zip"

      - name: Extract both archives
        run: |
          Expand-Archive -Path "${{ env.BASE_PATH }}\frontend.zip" -DestinationPath "${{ env.BASE_PATH }}" -Force
          Expand-Archive -Path "${{ env.BASE_PATH }}\server.zip" -DestinationPath "${{ env.BASE_PATH }}" -Force

      - name: Install dependencies
        run: |
          cd "${{ env.BASE_PATH }}\server"
          npm install
          cd "${{ env.BASE_PATH }}\frontend\frontend"
          npm install

      - name: Start backend and frontend
        run: |
          Start-Process powershell -ArgumentList "cd '${{ env.BASE_PATH }}\server'; npm start" -WindowStyle Hidden
          Start-Process powershell -ArgumentList "cd '${{ env.BASE_PATH }}\frontend\frontend'; npm start" -WindowStyle Hidden
