name: Juice Shop Deployment

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  deploy:
    runs-on: self-hosted

    env:
      NEXUS_URL: http://10.158.124.198:8081/repository/JuiceShopMavenDemo
      DEPLOY_PATH_FRONTEND: C:\inetpub\wwwroot\juice-shop
      DEPLOY_PATH_SERVER: C:\JuiceShopServer

    steps:
      - name: 🧩 Checkout code
        uses: actions/checkout@v3

      - name: ⚙️ Setup PowerShell environment
        shell: pwsh
        run: |
          Write-Host "[INFO] Deployment job started..."
          Write-Host "Working directory: $PWD"

      - name: 🚀 Deploy from Nexus
        shell: pwsh
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          Write-Host "[INFO] Starting deployment..."

          # Prepare Basic Auth header
          $pair = "${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes($pair))
          $headers = @{ Authorization = "Basic $base64Auth" }

          # === FRONTEND DEPLOYMENT ===
          try {
              $frontendBaseUrl = "${env:NEXUS_URL}/com/example/juiceshop/frontend-build/"
              $response = Invoke-WebRequest -Uri $frontendBaseUrl -Headers $headers
              $folders = $response.Links | Where-Object { $_.href -match '^\d+/$' } | ForEach-Object { $_.href.TrimEnd('/') }
              $latestFrontend = $folders | Sort-Object -Descending | Select-Object -First 1
              Write-Host "[INFO] Latest frontend build: $latestFrontend"

              $frontendUrl = "${env:NEXUS_URL}/com/example/juiceshop/frontend-build/$latestFrontend/frontend-build-$latestFrontend.zip"
              Write-Host "[INFO] Downloading frontend from $frontendUrl ..."
              Invoke-WebRequest -Uri $frontendUrl -OutFile "frontend.zip" -Headers $headers

              if (Test-Path "frontend.zip") {
                  Write-Host "[INFO] Extracting frontend to ${env:DEPLOY_PATH_FRONTEND} ..."
                  Expand-Archive -Path "frontend.zip" -DestinationPath "${env:DEPLOY_PATH_FRONTEND}" -Force
                  Write-Host "[SUCCESS] Frontend deployed successfully."
              } else {
                  Write-Host "[ERROR] Frontend ZIP not downloaded."
                  exit 1
              }
          }
          catch {
              Write-Host "[ERROR] Failed to download or extract frontend ZIP."
              Write-Host $_.Exception.Message
              exit 1
          }

          # === SERVER DEPLOYMENT ===
          try {
              $serverBaseUrl = "${env:NEXUS_URL}/com/example/juiceshop/server-build/"
              $response = Invoke-WebRequest -Uri $serverBaseUrl -Headers $headers
              $folders = $response.Links | Where-Object { $_.href -match '^\d+/$' } | ForEach-Object { $_.href.TrimEnd('/') }
              $latestServer = $folders | Sort-Object -Descending | Select-Object -First 1
              Write-Host "[INFO] Latest server build: $latestServer"

              $serverUrl = "${env:NEXUS_URL}/com/example/juiceshop/server-build/$latestServer/server-build-$latestServer.zip"
              Write-Host "[INFO] Downloading server from $serverUrl ..."
              Invoke-WebRequest -Uri $serverUrl -OutFile "server.zip" -Headers $headers

              if (Test-Path "server.zip") {
                  Write-Host "[INFO] Extracting server to ${env:DEPLOY_PATH_SERVER} ..."
                  Expand-Archive -Path "server.zip" -DestinationPath "${env:DEPLOY_PATH_SERVER}" -Force
                  Write-Host "[SUCCESS] Server deployed successfully."
              } else {
                  Write-Host "[ERROR] Server ZIP not downloaded."
                  exit 1
              }
          }
          catch {
              Write-Host "[ERROR] Failed to download or extract server ZIP."
              Write-Host $_.Exception.Message
              exit 1
          }

          Write-Host "✅ Deployment completed successfully!"
