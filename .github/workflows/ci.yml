name: Juice Shop CI/CD Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Copy files to IIS deployment folder
        run: |
          $source = "C:\SSDLC\Nexus_Unzips\*"
          $destination = "C:\inetpub\wwwroot\JuiceShop"
          Remove-Item -Recurse -Force $destination\*
          Copy-Item -Path $source -Destination $destination -Recurse

      - name: Install Node.js dependencies
        run: |
          cd C:\inetpub\wwwroot\JuiceShop
          npm install

      - name: Configure IIS web.config
        run: |
          $webConfigPath = "C:\inetpub\wwwroot\JuiceShop\web.config"
          if (!(Test-Path $webConfigPath)) {
              $webConfig = @"
<configuration>
  <system.webServer>
    <handlers>
      <add name="iisnode" path="server.js" verb="*" modules="iisnode"/>
    </handlers>
    <rewrite>
      <rules>
        <rule name="StaticContent">
          <action type="Rewrite" url="server.js"/>
        </rule>
      </rules>
    </rewrite>
  </system.webServer>
</configuration>
"@
              $webConfig | Out-File -FilePath $webConfigPath -Encoding UTF8
          }

      - name: Restart IIS Site
        run: |
          Import-Module WebAdministration
          Stop-Website -Name "JuiceShop"
          Start-Website -Name "JuiceShop"

      - name: Deployment Complete
        run: |
          Write-Output "Juice Shop deployment completed successfully!"
          Write-Output "Access the site at: http://localhost:3000"
