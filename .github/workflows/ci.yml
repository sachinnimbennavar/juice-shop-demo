name: Juice Shop CI

on:
  workflow_dispatch:  # allows manual triggering

jobs:
  # ================= BUILD & UPLOAD =================
  build-and-upload:
    if: false  # disable automatic run when manually dispatching deploy
    runs-on: self-hosted

    steps:
      # (Your full build-and-upload steps go here)
      # Checkout, install dependencies, build, and upload to Nexus

  # ================= DEPLOY =================
  deploy:
    runs-on: self-hosted
    needs: []  # no dependency, runs independently
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set environment variables
        shell: powershell
        run: |
          $env:NEXUS_URL = "http://127.0.0.1:8081/repository/JuiceShopMavenDemo"
          $env:NEXUS_USERNAME = "${{ secrets.NEXUS_USERNAME }}"
          $env:NEXUS_PASSWORD = "${{ secrets.NEXUS_PASSWORD }}"

      - name: Deploy latest frontend build
        shell: powershell
        run: |
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("$($env:NEXUS_USERNAME):$($env:NEXUS_PASSWORD)"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          # Use the known latest version (replace if dynamic fetching needed)
          $latestFrontendVersion = "20251013115336"
          $frontendUrl = "$($env:NEXUS_URL)/com/example/juiceshop/frontend-build/$latestFrontendVersion/frontend-build-$latestFrontendVersion.zip"
          Write-Host "[INFO] Downloading frontend ZIP from $frontendUrl"
          Invoke-WebRequest -Uri $frontendUrl -OutFile "frontend-build.zip" -Headers $headers

          # Extract
          if (Test-Path "frontend-build.zip") {
              Expand-Archive -Path "frontend-build.zip" -DestinationPath "C:\inetpub\wwwroot\juice-shop-frontend" -Force
              Write-Host "[SUCCESS] Frontend deployed."
          } else {
              Write-Host "[WARN] Frontend ZIP not found, skipping extraction."
          }

      - name: Deploy latest server build
        shell: powershell
        run: |
          $latestServerVersion = "20251013115336"
          $serverUrl = "$($env:NEXUS_URL)/com/example/juiceshop/server-build/$latestServerVersion/server-build-$latestServerVersion.zip"
          Write-Host "[INFO] Downloading server ZIP from $serverUrl"
          Invoke-WebRequest -Uri $serverUrl -OutFile "server-build.zip" -Headers $headers

          if (Test-Path "server-build.zip") {
              Expand-Archive -Path "server-build.zip" -DestinationPath "C:\JuiceShopServer" -Force
              Write-Host "[SUCCESS] Server deployed."
          } else {
              Write-Host "[WARN] Server ZIP not found, skipping extraction."
          }

      - name: Deployment complete
        run: Write-Host "✅ Deployment finished successfully!"
