name: Open OWASP ZAP and Scan Juice Shop

on:
  workflow_dispatch:

jobs:
  zap-scan:
    runs-on: self-hosted

    steps:
      # 1️⃣ Launch ZAP GUI via desktop shortcut if not already running
      - name: Launch OWASP ZAP via Desktop Shortcut
        shell: powershell
        run: |
          $zapProcess = Get-Process -Name "ZAP" -ErrorAction SilentlyContinue
          if (-not $zapProcess) {
              Write-Host "ZAP is not running. Launching OWASP ZAP..."
              Start-Process "C:\Users\Public\Desktop\ZAP 2.16.1.lnk"
              Write-Host "Waiting 1 minute for ZAP to fully open..."
              Start-Sleep -Seconds 120
              Write-Host "✅ ZAP GUI should now be fully open."
          } else {
              Write-Host "ZAP is already running. Skipping launch."
          }

      # 2️⃣ Run scan on Juice Shop and generate report
      - name: Scan Juice Shop and Generate Report
        shell: powershell
        run: |
          $zapApiUrl = "http://localhost:8082"  # ZAP local API
          $targetUrl = "http://localhost:3000"
          $reportPath = "C:\actions-runner\_work\zap-report.html"

          Write-Host "Starting active scan on $targetUrl..."
          
          # Start active scan
          $scanResponse = Invoke-RestMethod -Uri "$zapApiUrl/JSON/ascan/action/scan/?url=$targetUrl" -Method GET
          $scanId = $scanResponse.scan
          Write-Host "Scan ID: $scanId"

          # Poll scan status until complete
          do {
              Start-Sleep -Seconds 10
              $status = Invoke-RestMethod -Uri "$zapApiUrl/JSON/ascan/view/status/?scanId=$scanId" -Method GET
              Write-Host "Scan progress: $($status.status)%"
          } while ($status.status -ne "100")

          Write-Host "Scan completed. Generating HTML report..."
          
          # Generate HTML report
          Invoke-RestMethod -Uri "$zapApiUrl/OTHER/core/other/htmlreport/" -Method GET -OutFile $reportPath
          Write-Host "✅ Report saved at $reportPath"
