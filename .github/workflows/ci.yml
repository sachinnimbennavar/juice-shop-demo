name: Juice Shop Full CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # allows manual trigger

jobs:
  build-zip-deploy:
    runs-on: self-hosted

    env:
      NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
      NEXUS_DOWNLOAD_PATH: C:\SSDLC\Nexus_Unzips

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set Node memory
      - name: Set Node memory
        run: set NODE_OPTIONS=--max_old_space_size=4096

      # 3️⃣ Cache frontend dependencies
      - name: Cache frontend
        uses: actions/cache@v3
        with:
          path: |
            frontend/node_modules
            frontend/dist
            frontend/.angular
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      # 4️⃣ Cache server dependencies
      - name: Cache server
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-server-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-server-

      # 5️⃣ Install frontend dependencies
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps --prefer-offline --no-audit
          cd ..

      # 6️⃣ Build frontend
      - name: Build frontend
        run: |
          cd frontend
          npm run build -- --configuration production --watch=false --verbose
          cd ..

      # 7️⃣ Install server dependencies
      - name: Install server dependencies
        run: npm install --prefer-offline --no-audit

      # 8️⃣ Build server
      - name: Build server
        run: npm run build:server

      # 🔟 Create full repository ZIP & upload to Nexus
      - name: Create full repo ZIP and upload to Nexus
        shell: powershell
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          $version = (Get-Date -Format "yyyyMMddHHmmss")
          $serverZip = "full-repo-$version.zip"
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          $itemsInOrder = @(
              ".dependabot",".github",".gitlab",".well-known",".zap",
              "build","logs","node_modules","config","data","encryptionkeys",
              "frontend","ftp","i18n","lib","models","monitoring",
              "routes","rsn","screenshots","test","uploads","vagrant","views",
              ".codeclimate.yml",".devcontainer.json",".dockerignore",".eslintrc.js",
              ".gitignore",".gitlab-ci.yml",".gitpod.yml",".mailmap",".npmrc",
              "app.json","app.ts","CODE_OF_CONDUCT.md","config.schema.yml","CONTRIBUTING.md",
              "crowdin.yaml","ctf.key","cypress.config.ts","docker-compose.test.yml","Dockerfile",
              "Gruntfile.js","HALL_OF_FAME.md","LICENSE","package.json","README.md",
              "REFERENCES.md","SECURITY.md","server.ts","SOLUTIONS.md","swagger.yml",
              "threat-model.json","tsconfig.json"
          )

          if (Test-Path $serverZip) { Remove-Item $serverZip -Force }

          foreach ($item in $itemsInOrder) {
              if (Test-Path $item) {
                  if ($item -eq "node_modules") {
                      $count = (Get-ChildItem node_modules -Recurse | Measure-Object).Count
                      if ($count -gt 5000) {
                          Write-Host "⚠️ Skipping node_modules folder (contains $count items)..."
                          continue
                      }
                  }
                  Write-Host "Adding $item to ZIP..."
                  Compress-Archive -Path $item -DestinationPath $serverZip -Update
              } else {
                  if ($item -in @("build","logs","node_modules")) {
                      Write-Host "Creating empty folder $item..."
                      New-Item -ItemType Directory -Path $item
                      Compress-Archive -Path $item -DestinationPath $serverZip -Update
                  }
              }
          }

          $size = (Get-Item $serverZip).Length
          Write-Host "[INFO] ZIP file size: $size bytes"
          if ($size -lt 100000) { exit 1 }

          Write-Host "✅ Full repo ZIP created: $serverZip"

          $serverUrl = "${env:NEXUS_URL}/com/example/juiceshop/full-repo/$version/$serverZip"
          Write-Host "⬆️ Uploading to Nexus → $serverUrl"
          Invoke-RestMethod -Uri $serverUrl -Method Put -InFile $serverZip -Headers $headers -ContentType "application/zip"
          Write-Host "✅ Full repo uploaded successfully."

      # 1️⃣1️⃣ Download & unzip latest full-repo ZIP
      - name: Download & unzip latest Nexus ZIP
        shell: powershell
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          Write-Host "[INFO] Preparing Nexus unzip folder..."
          if (-Not (Test-Path "${env:NEXUS_DOWNLOAD_PATH}")) {
              New-Item -ItemType Directory -Path "${env:NEXUS_DOWNLOAD_PATH}" | Out-Null
          }

          $latestVersionUrl = "${env:NEXUS_URL}/com/example/juiceshop/full-repo/maven-metadata.xml"
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }
          $metadata = Invoke-WebRequest -Uri $latestVersionUrl -Headers $headers
          $xml = [xml]$metadata.Content
          $latestVersion = $xml.metadata.versioning.latest
          Write-Host "[INFO] Latest Nexus full-repo version: $latestVersion"

          $zipUrl = "${env:NEXUS_URL}/com/example/juiceshop/full-repo/$latestVersion/full-repo-$latestVersion.zip"
          $localZip = "${env:NEXUS_DOWNLOAD_PATH}\full-repo-$latestVersion.zip"
          Write-Host "[INFO] Downloading ZIP from $zipUrl ..."
          Invoke-WebRequest -Uri $zipUrl -OutFile $localZip -Headers $headers
          Write-Host "[INFO] Extracting ZIP to ${env:NEXUS_DOWNLOAD_PATH} ..."
          Expand-Archive -Path $localZip -DestinationPath "${env:NEXUS_DOWNLOAD_PATH}" -Force
          Write-Host "✅ Latest full-repo deployed to ${env:NEXUS_DOWNLOAD_PATH}"
