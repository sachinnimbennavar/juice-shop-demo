name: Nexus Upload Test Optimized

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  nexus-upload:
    name: Nexus Upload
    runs-on: self-hosted

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v3

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      # FRONTEND BUILD
      - name: 🏗️ Build Frontend
        working-directory: frontend
        run: |
          echo "⚙️ Building frontend..."
          npm install --prefer-offline --no-audit
          npm run build --if-present
          echo "✅ Frontend build complete."

      # SERVER BUILD
      - name: 🏗️ Build Server
        run: |
          echo "⚙️ Building server..."
          npm install --prefer-offline --no-audit
          npx tsc
          echo "✅ Server build complete."

      # ZIP PREPARATION
      - name: 📦 Prepare build artifacts
        run: |
          echo "🧩 Preparing zips for Nexus..."
          $frontendPath = "frontend/dist"
          $serverItems = @("config", "data", "lib", "models", "routes", "rsn", "views", "app.ts", "server.ts", "package.json", "tsconfig.json", "build")

          if (Test-Path $frontendPath) {
            Compress-Archive -Path "$frontendPath/*" -DestinationPath "frontend-build.zip" -Force
            echo "✅ Frontend zip created."
          } else {
            echo "⚠️ Frontend dist not found, skipping frontend zip."
          }

          $existing = $serverItems | Where-Object { Test-Path $_ }
          if ($existing.Count -gt 0) {
            Compress-Archive -Path $existing -DestinationPath "server-build.zip" -Force
            echo "✅ Server zip created."
          } else {
            echo "⚠️ No server files found, skipping server zip."
          }

      # UPLOAD TO NEXUS
      - name: 🚀 Upload to Nexus
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          echo "📤 Uploading to Nexus..."
          $ErrorActionPreference = "Stop"

          $frontendZip = "frontend-build.zip"
          $serverZip = "server-build.zip"

          if (Test-Path $frontendZip) {
            echo "➡️ Uploading $frontendZip..."
            curl -u "${{ env.NEXUS_USERNAME }}:${{ env.NEXUS_PASSWORD }}" --upload-file $frontendZip "${{ env.NEXUS_URL }}/frontend-build.zip"
          } else {
            echo "⚠️ $frontendZip not found, skipping upload."
          }

          if (Test-Path $serverZip) {
            echo "➡️ Uploading $serverZip..."
            curl -u "${{ env.NEXUS_USERNAME }}:${{ env.NEXUS_PASSWORD }}" --upload-file $serverZip "${{ env.NEXUS_URL }}/server-build.zip"
          } else {
            echo "⚠️ $serverZip not found, skipping upload."
          }

          echo "✅ Nexus upload complete."
