name: Verify Nexus Upload and Extraction

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest

    steps:
      # 1️⃣ Checkout your juice-shop-demo repo
      - name: Checkout juice-shop-demo repo
        uses: actions/checkout@v4
        with:
          repository: sachinnimbennavar/juice-shop-demo

      # 2️⃣ List all files (recursively)
      - name: List repository files
        run: |
          Get-ChildItem -Recurse | Select-Object FullName

      # 3️⃣ Optional: Show folder structure only (cleaner)
      # - name: List repository directories
      #   run: |
      #     Get-ChildItem -Recurse -Directory | Select-Object FullName

      # 4️⃣ (Later) Compare extracted VM files vs source
      # We'll use checksum or zip contents for verification in future steps
