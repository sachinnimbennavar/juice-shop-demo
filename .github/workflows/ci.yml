name: Juice Shop CI - Download Latest Builds

on:
  workflow_dispatch:  # Manual trigger

jobs:
  download-builds:
    runs-on: self-hosted  # Self-hosted runner on your VM

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get latest frontend build version
        shell: pwsh
        id: frontend
        run: |
          $frontendBaseUrl = "http://10.158.124.198:8081/repository/JuiceShopMavenDemo/com/example/juiceshop/frontend-build/"
          $response = Invoke-WebRequest -Uri $frontendBaseUrl
          $folders = $response.Links | Where-Object { $_.href -match '^\d+/$' } | ForEach-Object { $_.href.TrimEnd('/') }
          $latestFolder = $folders | Sort-Object -Descending | Select-Object -First 1
          Write-Host "Latest frontend build: $latestFolder"
          echo "::set-output name=version::$latestFolder"

      - name: Download latest frontend build
        shell: pwsh
        run: |
          $frontendVersion = "${{ steps.frontend.outputs.version }}"
          $frontendUrl = "http://10.158.124.198:8081/repository/JuiceShopMavenDemo/com/example/juiceshop/frontend-build/$frontendVersion/frontend-build-$frontendVersion.zip"
          Write-Host "[INFO] Downloading frontend from: $frontendUrl"
          Invoke-WebRequest $frontendUrl -OutFile "frontend.zip"

      - name: Get latest server build version
        shell: pwsh
        id: server
        run: |
          $serverBaseUrl = "http://10.158.124.198:8081/repository/JuiceShopMavenDemo/com/example/juiceshop/server-build/"
          $response = Invoke-WebRequest -Uri $serverBaseUrl
          $folders = $response.Links | Where-Object { $_.href -match '^\d+/$' } | ForEach-Object { $_.href.TrimEnd('/') }
          $latestFolder = $folders | Sort-Object -Descending | Select-Object -First 1
          Write-Host "Latest server build: $latestFolder"
          echo "::set-output name=version::$latestFolder"

      - name: Download latest server build
        shell: pwsh
        run: |
          $serverVersion = "${{ steps.server.outputs.version }}"
          $serverUrl = "http://10.158.124.198:8081/repository/JuiceShopMavenDemo/com/example/juiceshop/server-build/$serverVersion/server-build-$serverVersion.zip"
          Write-Host "[INFO] Downloading server from: $serverUrl"
          Invoke-WebRequest $serverUrl -OutFile "server.zip"

      - name: List downloaded files
        shell: pwsh
        run: dir
