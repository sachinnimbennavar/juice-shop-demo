name: Juice Shop IIS Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Print start message
        run: echo "✅ Workflow triggered successfully on $(hostname)"

      - name: IIS Deployment
        shell: powershell
        env:
          FRONTEND_SOURCE: C:\SSDLC\Nexus_Unzips\frontend\dist\frontend
          FRONTEND_IIS_PATH: C:\inetpub\wwwroot\JuiceShopFrontend
          BACKEND_SOURCE: C:\SSDLC\Nexus_Unzips\server
          BACKEND_IIS_PATH: C:\inetpub\wwwroot\JuiceShopBackend
          SITE_NAME_FRONTEND: JuiceShopFrontend
          SITE_NAME_BACKEND: JuiceShopBackend
          PORT_FRONTEND: 8081
          PORT_BACKEND: 8080
        run: |
          Write-Host "=== Juice Shop IIS Deployment Started ==="
          Import-Module WebAdministration

          # -------------------
          # Deploy Frontend
          # -------------------
          Write-Host "[INFO] Deploying frontend..."
          if (Test-Path $env:FRONTEND_IIS_PATH) {
              Write-Host "[INFO] Clearing frontend IIS folder..."
              Remove-Item -Path "$env:FRONTEND_IIS_PATH\*" -Recurse -Force
          } else {
              Write-Host "[INFO] Creating frontend IIS folder..."
              New-Item -ItemType Directory -Path $env:FRONTEND_IIS_PATH | Out-Null
          }
          Copy-Item -Path "$env:FRONTEND_SOURCE\*" -Destination $env:FRONTEND_IIS_PATH -Recurse
          
          $site = Get-Website -Name $env:SITE_NAME_FRONTEND -ErrorAction SilentlyContinue
          if ($null -eq $site) {
              Write-Host "[INFO] Creating frontend IIS site..."
              New-Website -Name $env:SITE_NAME_FRONTEND -Port $env:PORT_FRONTEND -PhysicalPath $env:FRONTEND_IIS_PATH | Out-Null
          } else {
              Write-Host "[INFO] Frontend site exists. Restarting..."
              Stop-Website -Name $env:SITE_NAME_FRONTEND
              Start-Website -Name $env:SITE_NAME_FRONTEND
          }

          # -------------------
          # Deploy Backend
          # -------------------
          Write-Host "[INFO] Deploying backend..."
          if (Test-Path $env:BACKEND_IIS_PATH) {
              Write-Host "[INFO] Clearing backend IIS folder..."
              Remove-Item -Path "$env:BACKEND_IIS_PATH\*" -Recurse -Force
          } else {
              Write-Host "[INFO] Creating backend IIS folder..."
              New-Item -ItemType Directory -Path $env:BACKEND_IIS_PATH | Out-Null
          }
          Copy-Item -Path "$env:BACKEND_SOURCE\*" -Destination $env:BACKEND_IIS_PATH -Recurse

          $backendSite = Get-Website -Name $env:SITE_NAME_BACKEND -ErrorAction SilentlyContinue
          if ($null -eq $backendSite) {
              Write-Host "[INFO] Creating backend IIS site..."
              New-Website -Name $env:SITE_NAME_BACKEND -Port $env:PORT_BACKEND -PhysicalPath $env:BACKEND_IIS_PATH | Out-Null
          } else {
              Write-Host "[INFO] Backend site exists. Restarting..."
              Stop-Website -Name $env:SITE_NAME_BACKEND
              Start-Website -Name $env:SITE_NAME_BACKEND
          }

          Write-Host "=== Deployment Completed Successfully ==="
