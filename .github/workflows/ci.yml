name: Juice Shop CI - Deploy Latest Builds

on:
  workflow_dispatch:

jobs:
  deploy-latest:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy latest builds from Nexus
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          FRONTEND_PATH: C:\inetpub\wwwroot\juice-shop
          SERVER_PATH: C:\JuiceShopServer
        run: |
          Write-Host "[INFO] Starting deployment..."
          
          # -------------------------------
          # Auth header
          # -------------------------------
          $base64Auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          # -------------------------------
          # Function to get latest artifact via Nexus REST API
          # -------------------------------
          function Get-LatestArtifact($artifactId) {
              $apiUrl = "${env:NEXUS_URL}/service/rest/v1/assets?repository=JuiceShopMavenDemo&group=com.example.juiceshop&name=${artifactId}"
              Write-Host "[INFO] Querying Nexus API for latest version of ${artifactId} ..."
              
              try {
                  $response = Invoke-RestMethod -Uri $apiUrl -Headers $headers -UseBasicParsing
                  if ($response.items.Count -eq 0) { throw "No versions found" }
                  
                  # Pick the artifact with the highest timestamp version
                  $latest = $response.items | Sort-Object { [Version]$_.version } -Descending | Select-Object -First 1
                  return $latest
              } catch {
                  Write-Warning "[WARN] Cannot fetch artifact ${artifactId}: $_"
                  return $null
              }
          }

          # -------------------------------
          # Function to download and deploy artifact
          # -------------------------------
          function Deploy-Artifact($artifactId, $deployPath) {
              $artifact = Get-LatestArtifact $artifactId
              if ($artifact -ne $null) {
                  $zipUrl = $artifact.downloadUrl
                  $outFile = "${artifactId}.zip"
                  
                  Write-Host "[INFO] Downloading ${artifactId} from $zipUrl ..."
                  Invoke-WebRequest -Uri $zipUrl -OutFile $outFile -Headers $headers -UseBasicParsing

                  Write-Host "[INFO] Extracting ${artifactId} to ${deployPath} ..."
                  Remove-Item -Recurse -Force "${deployPath}\*" -ErrorAction SilentlyContinue
                  Expand-Archive -Path $outFile -DestinationPath $deployPath -Force

                  Write-Host "[SUCCESS] ${artifactId} deployed successfully. Version: ${artifact.version}"
              }
          }

          # -------------------------------
          # Deploy frontend and server
          # -------------------------------
          Deploy-Artifact "frontend-build" ${env:FRONTEND_PATH}
          Deploy-Artifact "server-build" ${env:SERVER_PATH}

          Write-Host "✅ Deployment completed successfully!"
