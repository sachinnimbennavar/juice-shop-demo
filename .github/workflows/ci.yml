name: Juice Shop Full CI/CD Pipeline (Ultra Fast + OWASP ZAP Scan)

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build-upload-deploy:
    runs-on: self-hosted
    timeout-minutes: 180

    steps:
      # 1️⃣ Ultra-Fast Checkout (minimal)
      - name: Checkout repository (ultra-fast)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          submodules: false
          clean: false
          persist-credentials: false

      # 2️⃣ Cache dependencies + frontend build
      - name: Cache dependencies + frontend build
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            frontend/dist
          key: ${{ runner.os }}-juiceshop-${{ hashFiles('package-lock.json', 'frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-juiceshop-

      # 3️⃣ Install backend dependencies (only if missing)
      - name: Install backend dependencies (first-time only)
        shell: powershell
        run: |
          if (-Not (Test-Path "node_modules")) {
              Write-Host "[INFO] Installing backend dependencies..."
              npm install --prefer-offline --no-audit
          } else {
              Write-Host "[INFO] Skipping backend install (already present)."
          }

      # 4️⃣ Install frontend dependencies (only if missing)
      - name: Install frontend dependencies (first-time only)
        shell: powershell
        run: |
          if (-Not (Test-Path "frontend/node_modules")) {
              Write-Host "[INFO] Installing frontend dependencies..."
              cd frontend
              npm install --legacy-peer-deps --prefer-offline --no-audit
              cd ..
          } else {
              Write-Host "[INFO] Skipping frontend install (already present)."
          }

      # 5️⃣ Build frontend (first-time only)
      - name: Build frontend (first-time only)
        shell: powershell
        run: |
          if (-Not (Test-Path "frontend/dist/frontend")) {
              Write-Host "[INFO] Building Angular frontend..."
              cd frontend
              npm run build -- --configuration production --watch=false
              cd ..
          } else {
              Write-Host "[INFO] Skipping frontend build (cached output found)."
          }

      # 6️⃣ Compile backend TypeScript
      - name: Compile backend TypeScript
        shell: powershell
        run: |
          Write-Host "[INFO] Compiling backend TypeScript..."
          npx tsc
          if (-Not (Test-Path "build/app.js")) {
              Write-Host "[ERROR] Compilation failed, build/app.js not found"
              exit 1
          }

      # 7️⃣ Prepare deployment artifact (excluding node_modules)
      - name: Prepare deployment artifact (excluding node_modules)
        shell: powershell
        run: |
          Write-Host "[INFO] Preparing deployment artifact (excluding node_modules)..."
          $artifactFolder = "build_output"
          if (Test-Path $artifactFolder) { Remove-Item -Recurse -Force $artifactFolder }
          New-Item -ItemType Directory -Path $artifactFolder | Out-Null

          # Remove all node_modules folders before zipping
          Write-Host "[INFO] Removing all node_modules folders..."
          Get-ChildItem -Path "." -Directory -Recurse -Force |
            Where-Object { $_.Name -eq "node_modules" } |
            ForEach-Object {
              Write-Host "Removing $($_.FullName)"
              Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
            }

          # Required items
          $requiredItems = @("frontend/dist/frontend","build","package.json")
          foreach ($item in $requiredItems) {
              if (Test-Path $item) {
                  $dest = Join-Path $artifactFolder $item
                  $destDir = Split-Path $dest
                  if (!(Test-Path $destDir)) { New-Item -ItemType Directory -Path $destDir -Force | Out-Null }
                  Copy-Item -Path $item -Destination $dest -Recurse -Force
              } else {
                  Write-Host "[ERROR] Required item missing: $item"
                  exit 1
              }
          }

          # Optional web.config
          $optionalItem = "web.config"
          if (Test-Path $optionalItem) {
              $dest = Join-Path $artifactFolder $optionalItem
              Copy-Item -Path $optionalItem -Destination $dest -Force
              Write-Host "[INFO] Optional item included: $optionalItem"
          } else {
              Write-Host "[INFO] Optional item missing, skipping: $optionalItem"
          }

          # Pre-check for build/app.js
          $requiredFile = "build/app.js"
          if (-Not (Test-Path $requiredFile)) {
              Write-Host "[ERROR] Required backend build file missing: $requiredFile"
              exit 1
          } else {
              Write-Host "[INFO] Found required file: $requiredFile"
          }

          Write-Host "[INFO] Artifact ready at $artifactFolder"

      # 8️⃣ Upload artifact to Nexus
      - name: Upload artifact to Nexus
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          $version = (Get-Date -Format "yyyyMMddHHmmss")
          $serverZip = "full-repo-$version.zip"
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          if (Test-Path $serverZip) { Remove-Item $serverZip -Force }

          Compress-Archive -Path "build_output/*" -DestinationPath $serverZip -Force
          $serverUrl = "${env:NEXUS_URL}/com/example/juiceshop/full-repo/$version/$serverZip"
          Write-Host "[INFO] Uploading $serverZip to Nexus → $serverUrl"
          Invoke-RestMethod -Uri $serverUrl -Method Put -InFile $serverZip -Headers $headers -ContentType "application/zip"
          Write-Host "✅ Artifact uploaded successfully."

      # 9️⃣ Download & unzip latest artifact from Nexus
      - name: Download & unzip latest artifact from Nexus
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081
          NEXUS_REPO: JuiceShopMavenDemo
          DEPLOY_PATH: C:\SSDLC\Nexus_Unzips
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          Write-Host "[INFO] Starting artifact download..."
          if (Test-Path $env:DEPLOY_PATH) {
              Write-Host "[INFO] Clearing old files from $env:DEPLOY_PATH..."
              Remove-Item -Path "$env:DEPLOY_PATH\*" -Recurse -Force
          } else {
              New-Item -ItemType Directory -Path $env:DEPLOY_PATH -Force | Out-Null
          }

          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          $searchUrl = "${env:NEXUS_URL}/service/rest/v1/search?repository=${env:NEXUS_REPO}&group=com.example.juiceshop&name=full-repo"
          $response = Invoke-RestMethod -Uri $searchUrl -Headers $headers -Method Get
          if ($null -eq $response.items -or $response.items.Count -eq 0) {
              Write-Host "[ERROR] No full-repo versions found in Nexus!"
              exit 1
          }

          $latest = $response.items | Sort-Object { $_.version } -Descending | Select-Object -First 1
          $latestVersion = $latest.version
          $zipDownloadUrl = $latest.assets[0].downloadUrl
          Write-Host "[INFO] Latest version: $latestVersion"

          $zipFilePath = Join-Path $env:DEPLOY_PATH "full-repo-$latestVersion.zip"
          Write-Host "[INFO] Downloading ZIP to $zipFilePath ..."
          Invoke-WebRequest -Uri $zipDownloadUrl -OutFile $zipFilePath -Headers $headers

          Expand-Archive -Path $zipFilePath -DestinationPath $env:DEPLOY_PATH -Force
          Write-Host "✅ Artifact downloaded and extracted successfully."

      # 🔟 Start Node.js server after unzip
      - name: Start Node.js server
        shell: powershell
        run: |
          Write-Host "[INFO] Starting Node.js server from extracted artifact..."
          cd C:\SSDLC\Nexus_Unzips
          Write-Host "[INFO] Installing dependencies..."
          npm install --prefer-offline --no-audit
          if (-Not (Test-Path "build/app.js")) {
              Write-Host "[ERROR] build/app.js missing after unzip. Cannot start server."
              exit 1
          }
          Write-Host "[INFO] Launching server..."
          Start-Process "node" -ArgumentList "build/app.js" -NoNewWindow
          Write-Host "[INFO] Waiting 25 seconds for server to be ready..."
          Start-Sleep -Seconds 25
          Write-Host "✅ Node.js server should be running at http://localhost:3000"
