name: Juice Shop ZAP Scan Test (Post-Deployment)

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  zap-scan-only:
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: ⚡ Run OWASP ZAP Scan
        shell: powershell
        env:
          ZAP_PATH: C:\SSDLC\ZAP_2_16_1_windows.exe
          ZAP_REPORT_PATH: C:\SSDLC\ZapScan_Reports
        run: |
          Write-Host "[INFO] Starting Juice Shop Node.js server directly from server.js..."
          cd C:\SSDLC\Nexus_Unzips
          $env:PATH += ";C:\Program Files\nodejs"
          
          # Start Juice Shop backend manually (no build/app required)
          Start-Process "cmd.exe" -ArgumentList "/c node server.js" -NoNewWindow
          
          Write-Host "[INFO] Waiting 20 seconds for Juice Shop to start..."
          Start-Sleep -Seconds 20

          Write-Host "[INFO] Running OWASP ZAP scan..."
          if (-Not (Test-Path $env:ZAP_REPORT_PATH)) {
              New-Item -ItemType Directory -Path $env:ZAP_REPORT_PATH | Out-Null
          }

          $timestamp = Get-Date -Format "yyyyMMddHHmmss"
          $reportFile = Join-Path $env:ZAP_REPORT_PATH "ZapReport_$timestamp.html"

          # Run ZAP headless quick scan
          Start-Process -FilePath $env:ZAP_PATH -ArgumentList "-cmd", "-quickurl", "http://localhost:3000", "-quickout", $reportFile, "-quickprogress"

          Write-Host "[INFO] Waiting for ZAP scan to finish (3 mins)..."
          Start-Sleep -Seconds 180

          Write-Host "✅ OWASP ZAP scan complete. Report saved to $reportFile"
          
          # Optional: Kill the Node.js server after scan
          Write-Host "[INFO] Stopping Juice Shop server..."
          Get-Process -Name node -ErrorAction SilentlyContinue | Stop-Process -Force
          
          Write-Host "✅ ZAP Scan Test Finished Successfully."
