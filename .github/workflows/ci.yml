name: Juice Shop Run from Unzipped Nexus ZIP

on:
  workflow_dispatch:

jobs:
  run-juice-shop:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repository (optional)
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Ensure logs folder exists
      - name: Ensure logs folder
        shell: powershell
        env:
          JUICESHOP_PATH: C:\DeleteafterTest\full-repo-20251024124650
        run: |
          $logsPath = Join-Path $env:JUICESHOP_PATH "logs"
          if (-Not (Test-Path $logsPath)) {
              Write-Host "[INFO] Creating logs folder..."
              New-Item -ItemType Directory -Path $logsPath
          } else {
              Write-Host "[INFO] Logs folder already exists."
          }

      # 3️⃣ Install dependencies if node_modules missing
      - name: Install dependencies
        shell: powershell
        env:
          JUICESHOP_PATH: C:\DeleteafterTest\full-repo-20251024124650
        run: |
          cd $env:JUICESHOP_PATH
          if (-Not (Test-Path "node_modules")) {
              Write-Host "[INFO] node_modules not found. Installing dependencies..."
              npm install --legacy-peer-deps
          } else {
              Write-Host "[INFO] node_modules already exists. Skipping npm install."
          }

      # 4️⃣ Run Juice Shop server
      - name: Start Juice Shop server
        shell: powershell
        env:
          JUICESHOP_PATH: C:\DeleteafterTest\full-repo-20251024124650
        run: |
          cd $env:JUICESHOP_PATH
          Write-Host "[INFO] Starting Juice Shop server..."
          npx ts-node server.ts
          Write-Host "[INFO] Juice Shop server started."
