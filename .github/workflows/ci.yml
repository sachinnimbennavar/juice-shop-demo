name: Start Juice Shop Server

on:
  workflow_dispatch:

jobs:
  start-server:
    runs-on: self-hosted

    steps:
      - name: Start Juice Shop from Unzipped Artifact and Wait for Port 3000
        shell: powershell
        run: |
          # Go to the folder with unzipped Juice Shop
          Set-Location 'C:\SSDLC\Nexus_Unzips'

          # Kill any existing process on port 3000
          $connection = Get-NetTCPConnection -LocalPort 3000 -ErrorAction SilentlyContinue
          if ($connection) {
              $pid = $connection.OwningProcess
              Write-Host "Port 3000 in use by PID $pid - killing it..."
              Stop-Process -Id $pid -Force
          }

          # Start Juice Shop server in background
          Write-Host "Starting Juice Shop server..."
          Start-Job { npm start } | Out-Null

          # Wait until port 3000 is listening
          Write-Host "Waiting for Juice Shop server to start on port 3000..."
          $timeout = 60
          $elapsed = 0
          while ($true) {
              try {
                  $resp = Invoke-WebRequest -Uri 'http://localhost:3000' -UseBasicParsing -TimeoutSec 5
                  if ($resp.StatusCode -eq 200) {
                      Write-Host "Juice Shop server started successfully on port 3000!"
                      break
                  }
              } catch { }
              Start-Sleep -Seconds 2
              $elapsed += 2
              if ($elapsed -ge $timeout) {
                  Write-Host "Juice Shop server did not start within 60 seconds!"
                  exit 1
              }
          }
