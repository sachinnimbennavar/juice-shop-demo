name: Juice Shop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set Node memory for server build
      - name: Set Node memory
        run: set NODE_OPTIONS=--max_old_space_size=4096

      # 3️⃣ Cache frontend dependencies and Angular build output
      - name: Cache frontend
        uses: actions/cache@v3
        with:
          path: |
            frontend/node_modules
            frontend/dist
            frontend/.angular
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      # 4️⃣ Cache server dependencies
      - name: Cache server
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-server-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-server-

      # 5️⃣ Install frontend dependencies
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps --prefer-offline --no-audit
          cd ..

      # 6️⃣ Build frontend
      - name: Build frontend
        run: |
          cd frontend
          npm run build -- --configuration production --watch=false --verbose
          cd ..

      # 7️⃣ Install server dependencies
      - name: Install server dependencies
        run: npm install --prefer-offline --no-audit

      # 8️⃣ Build server
      - name: Build server
        run: npm run build:server

      # 🔟 Full Repository ZIP + Nexus Upload Phase
      - name: Create & Upload Full Repository ZIP to Nexus
        shell: powershell
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          Write-Host "🧩 Creating full repository ZIP..."
          $version = (Get-Date -Format "yyyyMMddHHmmss")
          $repoZip = "full-repo-$version.zip"
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          # Ordered inclusion list
          $itemsInOrder = @(
              ".dependabot",".github",".gitlab",".well-known",".zap",
              "build","logs","node_modules","config","data","encryptionkeys",
              "frontend","ftp","i18n","lib","models","monitoring",
              "routes","rsn","screenshots","test","uploads","vagrant","views",
              ".codeclimate.yml",".devcontainer.json",".dockerignore",".eslintrc.js",
              ".gitignore",".gitlab-ci.yml",".gitpod.yml",".mailmap",".npmrc",
              "app.json","app.ts","CODE_OF_CONDUCT.md","config.schema.yml","CONTRIBUTING.md",
              "crowdin.yaml","ctf.key","cypress.config.ts","docker-compose.test.yml","Dockerfile",
              "Gruntfile.js","HALL_OF_FAME.md","LICENSE","package.json","README.md",
              "REFERENCES.md","SECURITY.md","server.ts","SOLUTIONS.md","swagger.yml",
              "threat-model.json","tsconfig.json"
          )

          if (Test-Path $repoZip) { Remove-Item $repoZip -Force }

          foreach ($item in $itemsInOrder) {
              if (Test-Path $item) {
                  if ($item -eq "node_modules") {
                      $count = (Get-ChildItem node_modules -Recurse | Measure-Object).Count
                      if ($count -gt 5000) {
                          Write-Host "⚠️ Skipping node_modules (too large: $count items)..."
                          continue
                      }
                  }
                  Write-Host "Adding $item to ZIP..."
                  Compress-Archive -Path $item -DestinationPath $repoZip -Update
              } else {
                  if ($item -in @("build","logs","node_modules")) {
                      Write-Host "Creating empty folder $item..."
                      New-Item -ItemType Directory -Path $item | Out-Null
                      Compress-Archive -Path $item -DestinationPath $repoZip -Update
                  }
              }
          }

          # Verify ZIP
          $size = (Get-Item $repoZip).Length
          Write-Host "[INFO] ZIP size: $size bytes"
          if ($size -lt 100000) {
              Write-Error "ZIP file too small. Likely incomplete!"
              exit 1
          }

          Write-Host "✅ Full repo ZIP created: $repoZip"

          # Upload to Nexus
          $nexusTarget = "${env:NEXUS_URL}/repository/juice-shop/full-repo/$version/$repoZip"
          Write-Host "⬆️ Uploading to Nexus → $nexusTarget"
          Invoke-RestMethod -Uri $nexusTarget -Method Put -InFile $repoZip -Headers $headers -ContentType "application/zip"
          Write-Host "✅ Full repository uploaded successfully."
