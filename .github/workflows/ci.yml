name: Open OWASP ZAP and Scan Juice Shop

on:
  workflow_dispatch:

jobs:
  zap-scan:
    runs-on: self-hosted

    steps:
      # 1️⃣ Launch OWASP ZAP GUI via desktop shortcut if not running
      - name: Launch OWASP ZAP via Desktop Shortcut
        shell: powershell
        run: |
          $zapProcess = Get-Process -Name "ZAP" -ErrorAction SilentlyContinue
          if (-not $zapProcess) {
              Write-Host "ZAP is not running. Launching via desktop shortcut..."
              Start-Process "C:\Users\Public\Desktop\ZAP 2.16.1.lnk"
              Write-Host "Waiting 2 minutes for ZAP to initialize..."
              Start-Sleep -Seconds 120
              Write-Host "ZAP GUI should now be open on port 8082."
          } else {
              Write-Host "ZAP is already running. Skipping launch."
          }

      # 2️⃣ Run headless active scan using ZAP.exe
      - name: Run OWASP ZAP Headless Scan
        shell: powershell
        run: |
          $zapExePath = "C:\Program Files\ZAP\Zed Attack Proxy\ZAP.exe"
          $targetUrl = "http://localhost:3000"
          $reportFile = "C:\SSDLC\zap_juice_shop_report.html"

          Write-Host "Starting OWASP ZAP headless active scan on $targetUrl..."
          & $zapExePath -cmd -quickurl $targetUrl -quickprogress -report $reportFile
          Write-Host "Active scan completed. Report generated at $reportFile."
