name: Start Juice Shop Server

on:
  workflow_dispatch:

jobs:
  start-server:
    runs-on: self-hosted

    steps:
      - name: Start Juice Shop and Wait for Port 3000
        shell: powershell
        run: |
          Set-Location 'C:\SSDLC\Nexus_Unzips'

          # Start server in background
          Write-Host "Starting Juice Shop server..."
          $proc = Start-Process pwsh -ArgumentList "cd 'C:\SSDLC\Nexus_Unzips'; npm start" -WindowStyle Hidden -PassThru

          # Wait for port 3000 to be ready
          $timeout = 60
          $elapsed = 0
          while ($true) {
              try {
                  $resp = Invoke-WebRequest -Uri 'http://localhost:3000' -UseBasicParsing -TimeoutSec 5
                  if ($resp.StatusCode -eq 200) {
                      Write-Host "✅ Juice Shop server started successfully on port 3000!"
                      break
                  }
              } catch { }
              Start-Sleep -Seconds 2
              $elapsed += 2
              if ($elapsed -ge $timeout) {
                  Write-Host "❌ Juice Shop server did not start within 60 seconds!"
                  exit 1
              }
          }
