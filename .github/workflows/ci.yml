name: Juice Shop Manual Trial Deployment

on:
  workflow_dispatch: # Manual trigger

jobs:
  trial-deploy:
    runs-on: self-hosted

    steps:
      # 1️⃣ Deploy Frontend to IIS
      - name: Deploy Frontend to IIS (Trial)
        shell: powershell
        env:
          DEPLOY_SOURCE: C:\SSDLC\Nexus_Unzips_backup
          DEPLOY_TARGET: C:\inetpub\wwwroot\JuiceShop
          IIS_APPPOOL: JuiceShopAppPool
          IIS_SITE: "JuiceShop"
        run: |
          Import-Module WebAdministration
          Write-Host "[INFO] Deploying frontend to IIS from backup path..."
          
          if (Test-Path $env:DEPLOY_TARGET) {
              Remove-Item -Path "$env:DEPLOY_TARGET\*" -Recurse -Force
          } else {
              New-Item -ItemType Directory -Path $env:DEPLOY_TARGET -Force | Out-Null
          }

          Copy-Item -Path "$env:DEPLOY_SOURCE\frontend\dist\frontend\*" -Destination $env:DEPLOY_TARGET -Recurse -Force

          if (-not (Test-Path "IIS:\AppPools\$env:IIS_APPPOOL")) {
              Write-Host "[INFO] Creating App Pool: $env:IIS_APPPOOL ..."
              New-WebAppPool -Name $env:IIS_APPPOOL
              Set-ItemProperty "IIS:\AppPools\$env:IIS_APPPOOL" -Name processModel.identityType -Value "ApplicationPoolIdentity"
          }

          if (-not (Test-Path "IIS:\Sites\$env:IIS_SITE")) {
              Write-Host "[INFO] Creating IIS site: $env:IIS_SITE ..."
              New-Website -Name $env:IIS_SITE -Port 8080 -PhysicalPath $env:DEPLOY_TARGET -ApplicationPool $env:IIS_APPPOOL
          } else {
              Write-Host "[INFO] Assigning App Pool to existing IIS site ..."
              Set-ItemProperty "IIS:\Sites\$env:IIS_SITE" -Name applicationPool -Value $env:IIS_APPPOOL
          }

          Restart-WebAppPool -Name $env:IIS_APPPOOL
          Write-Host "✅ Frontend deployed to IIS successfully!"

      # 2️⃣ Deploy Backend Node.js via NSSM
      - name: Deploy Backend Node.js Service via NSSM (Trial)
        shell: powershell
        env:
          DEPLOY_PATH: C:\SSDLC\Nexus_Unzips_backup
          NODE_PATH: "C:\Program Files\nodejs\node.exe"
          NSSM_PATH: "C:\SSDLC\nssm-2.24\nssm-2.24\win64\nssm.exe"
        run: |
          $serviceName = "JuiceShopServer"
          $nodeExe = $env:NODE_PATH
          $serverJs = Join-Path $env:DEPLOY_PATH "build\server.js"

          # Install dependencies for trial run
          Write-Host "[INFO] Installing backend dependencies (trial)..."
          cd (Join-Path $env:DEPLOY_PATH "build")
          npm install --production
          Write-Host "[INFO] Backend dependencies installed."

          $nssmExe = $env:NSSM_PATH
          if (-not (Get-Service -Name $serviceName -ErrorAction SilentlyContinue)) {
              Write-Host "[INFO] Installing Node.js service via NSSM (trial)..."
              & $nssmExe install $serviceName $nodeExe $serverJs
              & $nssmExe set $serviceName AppDirectory (Join-Path $env:DEPLOY_PATH "build")
              & $nssmExe set $serviceName AppStdout (Join-Path $env:DEPLOY_PATH "build\server-out.log")
              & $nssmExe set $serviceName AppStderr (Join-Path $env:DEPLOY_PATH "build\server-err.log")
          }

          $svc = Get-Service -Name $serviceName
          if ($svc.Status -eq "Running") {
              Restart-Service $serviceName -Force
          } else {
              Start-Service $serviceName
          }

          Write-Host "✅ Backend Node.js service deployed via NSSM successfully!"
