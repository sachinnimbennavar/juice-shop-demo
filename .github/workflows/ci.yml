name: Open OWASP ZAP via Desktop Shortcut

on:
  workflow_dispatch:

jobs:
  open-zap:
    runs-on: self-hosted

    steps:
      - name: Launch OWASP ZAP via Desktop Shortcut
        shell: cmd
        run: |
          echo Launching OWASP ZAP using desktop shortcut...
          start "" "C:\Users\Public\Desktop\ZAP 2.16.1.lnk"
          echo ✅ ZAP should now be open.
