name: Juice Shop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted
    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Build frontend
      - name: Build Angular frontend
        run: |
          set NODE_OPTIONS=--max_old_space_size=4096
          npx ng build --configuration production --source-map=false

      # Step 5: Build server (if any server build exists)
      - name: Build server
        run: |
          cd server
          npm install
          npm run build
          cd ..

      # Step 6: Run tests
      - name: Run tests
        run: npm test

      # Step 7: Upload builds to Nexus (robust)
      - name: Upload builds to Nexus
        shell: powershell
        run: |
          Write-Host "📦 Uploading frontend build files..."
          if (Test-Path frontend/dist) {
              cd frontend/dist
              Get-ChildItem -Recurse -File | ForEach-Object {
                  $relativePath = $_.FullName.Substring($PWD.Path.Length + 1).Replace("\","/")
                  Write-Host "Uploading $relativePath to Nexus"
                  & "C:\Windows\System32\curl.exe" -v -u "$env:NEXUS_USERNAME:$env:NEXUS_PASSWORD" `
                      --upload-file $_.FullName `
                      "$env:NEXUS_URL/frontend/$relativePath"
              }
              cd ../../
          } else {
              Write-Host "Frontend dist folder not found, skipping frontend upload."
          }

          Write-Host "📦 Uploading server build files..."
          if (Test-Path server/build) {
              cd server/build
              Get-ChildItem -Recurse -File | ForEach-Object {
                  $relativePath = $_.FullName.Substring($PWD.Path.Length + 1).Replace("\","/")
                  Write-Host "Uploading $relativePath to Nexus"
                  & "C:\Windows\System32\curl.exe" -v -u "$env:NEXUS_USERNAME:$env:NEXUS_PASSWORD" `
                      --upload-file $_.FullName `
                      "$env:NEXUS_URL/server/$relativePath"
              }
              cd ../..
          } else {
              Write-Host "Server build folder not found, skipping server upload."
          }
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
