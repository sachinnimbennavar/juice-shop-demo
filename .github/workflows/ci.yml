name: Juice Shop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set Node memory
      - name: Set Node memory
        run: set NODE_OPTIONS=--max_old_space_size=4096

      # 3️⃣ Cache frontend dependencies
      - name: Cache frontend dependencies
        uses: actions/cache@v3
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-npm-

      # 4️⃣ Cache frontend Angular build artifacts
      - name: Cache frontend build artifacts
        uses: actions/cache@v3
        with:
          path: |
            frontend/.angular/cache
            frontend/dist
          key: ${{ runner.os }}-frontend-build-${{ hashFiles('frontend/src/**/*') }}
          restore-keys: |
            ${{ runner.os }}-frontend-build-

      # 5️⃣ Cache server dependencies
      - name: Cache server dependencies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-server-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-server-npm-

      # 6️⃣ Cache server build output
      - name: Cache server build artifacts
        uses: actions/cache@v3
        with:
          path: dist
          key: ${{ runner.os }}-server-build-${{ hashFiles('tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-server-build-

      # 7️⃣ Install frontend dependencies
      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps --prefer-offline --no-audit --no-optional
        working-directory: frontend

      # 8️⃣ Build frontend
      - name: Build frontend
        run: npm run build -- --configuration production --watch=false
        working-directory: frontend

      # 9️⃣ Install server dependencies
      - name: Install server dependencies
        run: npm install --prefer-offline --no-audit --legacy-peer-deps --no-optional

      # 🔟 Start SonarQube scan in background (Windows PowerShell)
      - name: Start SonarQube Scan in background
        if: ${{ always() }}
        run: |
          if (Get-Command sonar-scanner -ErrorAction SilentlyContinue) {
              echo "Starting SonarQube scanner in background..."
              Start-Process powershell -ArgumentList '-NoProfile -Command "set SONAR_HOST_URL=http://127.0.0.1:9000; sonar-scanner"' -WindowStyle Hidden
          } else {
              echo "sonar-scanner not found, skipping analysis."
          }

      # 1️⃣1️⃣ Build server (TypeScript incremental build)
      - name: Build server
        run: npm run build:server
