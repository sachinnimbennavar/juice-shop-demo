name: Juice Shop Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy Juice Shop to IIS
        shell: powershell
        run: |
          $source = "C:\SSDLC\Nexus_Unzips\*"
          $destination = "C:\inetpub\wwwroot\JuiceShop"

          Write-Output "Clearing IIS deployment folder..."
          Remove-Item -Recurse -Force $destination\*
          Copy-Item -Path $source -Destination $destination -Recurse

          Write-Output "Installing Node.js dependencies..."
          cd $destination
          npm install

          $webConfigPath = "$destination\web.config"
          if (!(Test-Path $webConfigPath)) {
              $webConfig = @"
<configuration>
  <system.webServer>
    <handlers>
      <add name="iisnode" path="server.js" verb="*" modules="iisnode"/>
    </handlers>
    <rewrite>
      <rules>
        <rule name="StaticContent">
          <action type="Rewrite" url="server.js"/>
        </rule>
      </rules>
    </rewrite>
  </system.webServer>
</configuration>
"@
              $webConfig | Out-File -FilePath $webConfigPath -Encoding UTF8
          }

          Import-Module WebAdministration
          Stop-Website -Name "JuiceShop"
          Start-Website -Name "JuiceShop"

          Write-Output "✅ Juice Shop deployed successfully!"
