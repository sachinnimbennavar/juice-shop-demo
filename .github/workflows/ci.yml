name: Juice Shop IIS Deployment

on:
  workflow_dispatch: # Manual trigger

jobs:
  deploy-to-iis:
    runs-on: self-hosted

    steps:
      # 1️⃣ Deploy to IIS from unzipped folder
      - name: Deploy artifact to IIS
        shell: powershell
        env:
          ARTIFACT_PATH: C:\SSDLC\Nexus_Unzips
          IIS_SITE_PATH: C:\inetpub\wwwroot\JuiceShop
          IIS_APPPOOL: JuiceShopAppPool
        run: |
          Write-Host "[INFO] Deploying artifact to IIS..."
          
          # Clear existing IIS site folder
          if (Test-Path $env:IIS_SITE_PATH) {
              Write-Host "[INFO] Clearing existing files from $env:IIS_SITE_PATH ..."
              Remove-Item -Path "$env:IIS_SITE_PATH\*" -Recurse -Force
          } else {
              New-Item -ItemType Directory -Path $env:IIS_SITE_PATH -Force | Out-Null
          }

          # Copy all files from unzipped artifact
          Write-Host "[INFO] Copying files from $env:ARTIFACT_PATH to $env:IIS_SITE_PATH ..."
          Copy-Item -Path "$env:ARTIFACT_PATH\*" -Destination $env:IIS_SITE_PATH -Recurse -Force

          # Restart IIS App Pool
          Write-Host "[INFO] Restarting IIS App Pool: $env:IIS_APPPOOL ..."
          Import-Module WebAdministration
          Restart-WebAppPool -Name $env:IIS_APPPOOL

          Write-Host "✅ Deployment to IIS completed successfully!"
