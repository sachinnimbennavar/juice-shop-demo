name: Juice Shop CI - Download Builds from Local VM

on:
  workflow_dispatch:  # Manual trigger

jobs:
  download-builds:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Download frontend build
        shell: pwsh
        run: |
          $frontendUrl = "http://10.158.124.198:8081/repository/JuiceShopMavenDemo/com/example/juiceshop/frontend-build/20251015101652/frontend-build-20251015101652.zip"
          Write-Host "[INFO] Downloading frontend from: $frontendUrl"
          Invoke-WebRequest $frontendUrl -OutFile "frontend.zip"

      - name: Download server build
        shell: pwsh
        run: |
          $serverUrl = "http://10.158.124.198:8081/repository/JuiceShopMavenDemo/com/example/juiceshop/server-build/20251015101652/server-build-20251015101652.zip"
          Write-Host "[INFO] Downloading server from: $serverUrl"
          Invoke-WebRequest $serverUrl -OutFile "server.zip"

      - name: List downloaded files
        run: dir
