name: Test Prepare, Upload & Download Artifact

on:
  workflow_dispatch:

jobs:
  prepare-upload-download:
    runs-on: self-hosted

    steps:
      # 1️⃣ Prepare deployment artifact
      - name: Prepare deployment artifact
        shell: powershell
        run: |
          Write-Host "[INFO] Preparing deployment artifact..."
          $artifactFolder = "build_output"
          if (Test-Path $artifactFolder) { Remove-Item -Recurse -Force $artifactFolder }
          New-Item -ItemType Directory -Path $artifactFolder | Out-Null
          $filesToInclude = @("build","frontend/dist/frontend","server.js","package.json","web.config")
          foreach ($item in $filesToInclude) {
              if (Test-Path $item) {
                  $dest = Join-Path $artifactFolder $item
                  $destDir = Split-Path $dest
                  if (!(Test-Path $destDir)) { New-Item -ItemType Directory -Path $destDir -Force | Out-Null }
                  Copy-Item -Path $item -Destination $dest -Recurse -Force
              } else {
                  Write-Host "[WARN] File/folder not found: $item"
              }
          }
          Write-Host "[INFO] Deployment-ready artifact prepared at $artifactFolder"

      # 2️⃣ Upload artifact to Nexus
      - name: Upload artifact to Nexus
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          $version = (Get-Date -Format "yyyyMMddHHmmss")
          $zipName = "juiceshop-build-$version.zip"
          Compress-Archive -Path "build_output/*" -DestinationPath $zipName -Force
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }
          $uploadUrl = "${env:NEXUS_URL}/com/example/juiceshop/artifacts/$version/$zipName"
          Invoke-RestMethod -Uri $uploadUrl -Method Put -InFile $zipName -Headers $headers -ContentType "application/zip"
          Write-Host "[INFO] Artifact uploaded to Nexus: $zipName"

      # 3️⃣ Download & unzip latest artifact from Nexus
      - name: Juice Shop Deployment (Download & Unzip)
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081
          NEXUS_REPO: JuiceShopMavenDemo
          DEPLOY_PATH: C:\SSDLC\Nexus_Unzips
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          Write-Host "[INFO] Starting deployment..."
          if (Test-Path $env:DEPLOY_PATH) { Remove-Item "$env:DEPLOY_PATH\*" -Recurse -Force } else { New-Item -ItemType Directory -Path $env:DEPLOY_PATH -Force | Out-Null }

          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          $apiUrl = "${env:NEXUS_URL}/service/rest/v1/search?repository=${env:NEXUS_REPO}&group=com.example.juiceshop&name=artifacts"
          Write-Host "[INFO] Fetching available versions from Nexus..."
          $response = Invoke-RestMethod -Uri $apiUrl -Headers $headers -Method Get

          if ($null -eq $response.items -or $response.items.Count -eq 0) { Write-Error "No builds found in Nexus!"; exit 1 }

          $latest = $response.items | Sort-Object { $_.version } -Descending | Select-Object -First 1
          $latestVersion = $latest.version
          $zipUrl = $latest.assets[0].downloadUrl

          Write-Host "[INFO] Latest version: $latestVersion"
          Write-Host "[INFO] Download URL: $zipUrl"

          $zipFile = Join-Path $env:DEPLOY_PATH "juiceshop-build-$latestVersion.zip"
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipFile -Headers $headers

          if (-Not (Test-Path $zipFile)) { Write-Error "Failed to download ZIP!"; exit 1 }

          Write-Host "[INFO] Extracting ZIP to $env:DEPLOY_PATH..."
          Expand-Archive -Path $zipFile -DestinationPath $env:DEPLOY_PATH -Force

          Write-Host "[INFO] Deployment test completed successfully! Latest version: $latestVersion"
