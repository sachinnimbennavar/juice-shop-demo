name: Juice Shop Deployment Pipeline (Artifact → IIS)

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  deploy-juice-shop:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repo (optional, needed for local files)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Prepare artifact (no node_modules)
      - name: Prepare artifact
        shell: powershell
        run: |
          Write-Host "[INFO] Preparing artifact for Nexus upload..."
          $artifactDir = "$env:GITHUB_WORKSPACE\artifact"

          if (Test-Path $artifactDir) {
            Remove-Item -Path "$artifactDir\*" -Recurse -Force
          } else {
            New-Item -ItemType Directory -Path $artifactDir | Out-Null
          }

          $paths = @(
            "frontend/dist",
            "server.js",
            "routes",
            "data",
            "config",
            "package.json",
            "web.config"
          )

          foreach ($path in $paths) {
            if (Test-Path $path) {
              $dest = Join-Path $artifactDir $path
              $destDir = Split-Path $dest
              if (!(Test-Path $destDir)) {
                New-Item -ItemType Directory -Path $destDir -Force | Out-Null
              }
              Copy-Item -Path $path -Destination $dest -Recurse -Force
            } else {
              Write-Host "[WARN] Skipping missing path: $path"
            }
          }

          Write-Host "✅ Artifact prepared successfully at $artifactDir"

      # 3️⃣ Upload artifact to Nexus
      - name: Upload artifact to Nexus
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081
          NEXUS_REPO: JuiceShopMavenDemo
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          Write-Host "[INFO] Uploading artifact to Nexus..."
          $artifactDir = "$env:GITHUB_WORKSPACE\artifact"
          $version = Get-Date -Format "yyyyMMddHHmmss"
          $zipPath = "$artifactDir\full-repo-$version.zip"
          Compress-Archive -Path "$artifactDir\*" -DestinationPath $zipPath -Force

          $uploadUrl = "${env:NEXUS_URL}/repository/${env:NEXUS_REPO}/com/example/juiceshop/full-repo/$version/full-repo-$version.zip"

          $base64Auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          Invoke-WebRequest -Uri $uploadUrl -Method PUT -Headers $headers -InFile $zipPath
          Write-Host "✅ Artifact uploaded successfully to Nexus."

      # 4️⃣ Download latest artifact from Nexus
      - name: Download & unzip latest artifact
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081
          NEXUS_REPO: JuiceShopMavenDemo
          DEPLOY_PATH: C:\SSDLC\Nexus_Unzips
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          Write-Host "[INFO] Downloading latest artifact from Nexus..."
          if (Test-Path $env:DEPLOY_PATH) {
              Write-Host "[INFO] Clearing existing files..."
              Remove-Item -Path "$env:DEPLOY_PATH\*" -Recurse -Force
          } else {
              New-Item -ItemType Directory -Path $env:DEPLOY_PATH -Force | Out-Null
          }

          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $auth" }

          $apiUrl = "${env:NEXUS_URL}/service/rest/v1/search?repository=${env:NEXUS_REPO}&group=com.example.juiceshop&name=full-repo"
          $response = Invoke-RestMethod -Uri $apiUrl -Headers $headers -Method Get
          if ($null -eq $response.items -or $response.items.Count -eq 0) {
              Write-Host "[ERROR] No full-repo artifacts found!"
              exit 1
          }

          $latest = $response.items | Sort-Object { $_.version } -Descending | Select-Object -First 1
          $version = $latest.version
          $downloadUrl = $latest.assets[0].downloadUrl
          $zipFile = Join-Path $env:DEPLOY_PATH "full-repo-$version.zip"

          Write-Host "[INFO] Downloading version $version ..."
          Invoke-WebRequest -Uri $downloadUrl -OutFile $zipFile -Headers $headers
          Expand-Archive -Path $zipFile -DestinationPath $env:DEPLOY_PATH -Force

          Write-Host "✅ Artifact downloaded and extracted to $env:DEPLOY_PATH"

      # 5️⃣ Deploy to IIS
      - name: Deploy to IIS
        shell: powershell
        env:
          DEPLOY_SOURCE: C:\SSDLC\Nexus_Unzips
          DEPLOY_TARGET: C:\inetpub\wwwroot\JuiceShop
          IIS_APPPOOL: JuiceShopAppPool
          IIS_SITE: "Default Web Site"
        run: |
          Import-Module WebAdministration
          Write-Host "[INFO] Starting IIS deployment..."

          if (Test-Path $env:DEPLOY_TARGET) {
              Write-Host "[INFO] Cleaning existing site directory..."
              Remove-Item -Path "$env:DEPLOY_TARGET\*" -Recurse -Force
          } else {
              New-Item -ItemType Directory -Path $env:DEPLOY_TARGET -Force | Out-Null
          }

          Copy-Item -Path "$env:DEPLOY_SOURCE\*" -Destination $env:DEPLOY_TARGET -Recurse -Force

          if (-not (Test-Path "IIS:\AppPools\$env:IIS_APPPOOL")) {
              Write-Host "[INFO] Creating App Pool: $env:IIS_APPPOOL ..."
              New-WebAppPool -Name $env:IIS_APPPOOL | Out-Null
          }

          Set-ItemProperty "IIS:\Sites\$env:IIS_SITE" -Name applicationPool -Value $env:IIS_APPPOOL
          Restart-WebAppPool -Name $env:IIS_APPPOOL

          Write-Host "✅ IIS deployment completed successfully!"
