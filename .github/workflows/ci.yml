name: JuiceShop Build & Deploy (From Existing Extract)

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    env:
      DEPLOY_PATH: C:\JuiceShopServer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Ensure Deployment Directory Exists
        run: |
          Write-Host "[INFO] Checking deployment directory..."
          if (-Not (Test-Path $env:DEPLOY_PATH)) {
              New-Item -ItemType Directory -Path $env:DEPLOY_PATH
          }

      - name: Install Backend Dependencies
        run: |
          Write-Host "[INFO] Installing backend dependencies..."
          cd $env:DEPLOY_PATH
          npm install

      - name: Install Frontend Dependencies (skip postinstall loop)
        run: |
          Write-Host "[INFO] Installing frontend dependencies..."
          cd $env:DEPLOY_PATH\frontend
          npm install --legacy-peer-deps --ignore-scripts

      - name: Build Frontend
        run: |
          Write-Host "[INFO] Building frontend..."
          cd $env:DEPLOY_PATH\frontend
          npm run build

      - name: Build Server
        run: |
          Write-Host "[INFO] Building server..."
          cd $env:DEPLOY_PATH
          npm run build:server

      - name: Deployment Complete
        run: |
          Write-Host "[SUCCESS] Frontend and backend build complete."
