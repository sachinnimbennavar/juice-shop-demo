name: Juice Shop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 🧱 Frontend Build
      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
        shell: bash

      # ⚙️ Backend Build
      - name: Build Server
        run: |
          cd server
          npm install
          npm run build
        shell: bash

      # 🔍 SonarQube Analysis (keep your existing configuration)
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=juice-shop \
            -Dsonar.sources=. \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.login=$SONAR_TOKEN
        shell: bash

      # 📦 Nexus Upload Phase
      - name: Zip Frontend Build
        run: |
          cd frontend/dist
          zip -r ../../frontend-build.zip .
        shell: bash

      - name: Upload Frontend to Nexus
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          curl -v -u $NEXUS_USERNAME:$NEXUS_PASSWORD \
            --upload-file frontend-build.zip \
            "$NEXUS_URL/repository/juice-shop/frontend-build.zip"
        shell: bash

      # 🧩 Add Server Zip + Upload (NEW)
      - name: Zip Server Build
        run: |
          cd server
          zip -r ../server-build.zip .
        shell: bash

      - name: Upload Server to Nexus
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          curl -v -u $NEXUS_USERNAME:$NEXUS_PASSWORD \
            --upload-file server-build.zip \
            "$NEXUS_URL/repository/juice-shop/server-build.zip"
        shell: bash
