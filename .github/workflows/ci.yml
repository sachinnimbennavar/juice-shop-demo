name: Juice Shop CI/CD Pipeline

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    env:
      NODE_OPTIONS: --max_old_space_size=4096
      NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
      DEPLOY_DIR: C:\SSDLC\Nexus_Unzips
      IIS_SITE: "JuiceShop"               # 🔹 Update this with your IIS site name
      IIS_APPPOOL: "JuiceShopAppPool"     # 🔹 Update this with your App Pool name

    steps:
      # 1️⃣ Checkout repository (shallow for speed)
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      # 2️⃣ Cache frontend dependencies & Angular build
      - name: Cache frontend
        uses: actions/cache@v3
        with:
          path: |
            frontend/node_modules
            frontend/dist
            frontend/.angular
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      # 3️⃣ Cache backend dependencies
      - name: Cache server
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-server-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-server-

      # 4️⃣ Install frontend dependencies
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps --prefer-offline --no-audit
          cd ..

      # 5️⃣ Build frontend (Angular)
      - name: Build frontend
        run: |
          cd frontend
          npm run build -- --configuration production --watch=false --verbose
          cd ..

      # 6️⃣ Install backend dependencies
      - name: Install server dependencies
        run: npm install --prefer-offline --no-audit

      # 7️⃣ Build backend
      - name: Build backend
        run: npm run build:server

      # 8️⃣ Prepare & Upload artifact to Nexus
      - name: Upload artifact to Nexus
        shell: powershell
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          Write-Host "[INFO] Preparing artifact for Nexus upload..."
          $version = (Get-Date -Format "yyyyMMddHHmmss")
          $serverZip = "full-repo-$version.zip"
          $artifactDir = "build_output"

          # Prepare build_output directory
          if (Test-Path $artifactDir) { Remove-Item $artifactDir -Recurse -Force }
          New-Item -Path $artifactDir -ItemType Directory | Out-Null

          # Copy built frontend and backend (excluding node_modules)
          Copy-Item -Path "frontend/dist" -Destination "$artifactDir/frontend" -Recurse -Force
          Copy-Item -Path "server.js" -Destination $artifactDir -Force
          Copy-Item -Path "package.json" -Destination $artifactDir -Force

          # Compress and upload
          Compress-Archive -Path "$artifactDir/*" -DestinationPath $serverZip -Force

          $serverUrl = "${env:NEXUS_URL}/com/example/juiceshop/full-repo/$version/$serverZip"
          Write-Host "[INFO] Uploading $serverZip to Nexus → $serverUrl"
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }
          Invoke-RestMethod -Uri $serverUrl -Method Put -InFile $serverZip -Headers $headers -ContentType "application/zip"
          Write-Host "✅ Artifact uploaded successfully."

      # 9️⃣ Deploy artifact to IIS
      - name: Deploy artifact to IIS
        shell: powershell
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          Import-Module WebAdministration
          Write-Host "[INFO] Deploying artifact to IIS..."

          # 1️⃣ Clear existing deployment directory
          if (Test-Path $env:DEPLOY_DIR) {
              Write-Host "[INFO] Clearing old files from $env:DEPLOY_DIR..."
              Remove-Item -Path "$env:DEPLOY_DIR\*" -Recurse -Force -ErrorAction SilentlyContinue
          } else {
              Write-Host "[INFO] Creating deployment directory: $env:DEPLOY_DIR"
              New-Item -Path $env:DEPLOY_DIR -ItemType Directory | Out-Null
          }

          # 2️⃣ Find latest artifact version on Nexus
          $latestVersion = (Invoke-RestMethod -Uri "$env:NEXUS_URL/com/example/juiceshop/full-repo/" -UseBasicParsing | Select-String -Pattern "\d{14}" -AllMatches).Matches.Value | Sort-Object | Select-Object -Last 1
          if (-not $latestVersion) { throw "❌ No artifact version found on Nexus!" }

          # 3️⃣ Download artifact
          $artifactUrl = "$env:NEXUS_URL/com/example/juiceshop/full-repo/$latestVersion/full-repo-$latestVersion.zip"
          $downloadPath = "$env:DEPLOY_DIR\artifact.zip"
          Write-Host "[INFO] Downloading artifact → $artifactUrl"

          $base64Auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }
          Invoke-RestMethod -Uri $artifactUrl -Method Get -Headers $headers -OutFile $downloadPath -ErrorAction Stop

          # 4️⃣ Extract artifact
          Write-Host "[INFO] Extracting artifact to $env:DEPLOY_DIR..."
          Expand-Archive -Path $downloadPath -DestinationPath $env:DEPLOY_DIR -Force

          # 5️⃣ Assign App Pool & restart site
          $sitePath = "IIS:\Sites\$env:IIS_SITE"
          if (Test-Path $sitePath) {
              Write-Host "[INFO] Assigning App Pool '$env:IIS_APPPOOL' to site '$env:IIS_SITE'..."
              Set-ItemProperty $sitePath -Name applicationPool -Value $env:IIS_APPPOOL
              Write-Host "[INFO] Restarting IIS site..."
              Stop-WebSite $env:IIS_SITE -ErrorAction SilentlyContinue
              Start-WebSite $env:IIS_SITE
              Write-Host "✅ Deployment completed and site restarted successfully."
          } else {
              Write-Host "⚠️ IIS site '$env:IIS_SITE' not found. Please verify the site name in IIS Manager."
              Write-Host "💡 To check: Get-ChildItem IIS:\Sites"
          }
