name: Juice Shop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build -- --configuration production --source-map=false

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Build server
        working-directory: server
        run: npm run build

      - name: SonarQube Analysis
        uses: sonarsource/sonarcloud-github-action@v2
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=juice-shop-demo
            -Dsonar.organization=your-org
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      - name: Compress and upload frontend build
        shell: pwsh
        run: |
          $frontendZip = "frontend.zip"
          if (Test-Path $frontendZip) { Remove-Item $frontendZip }
          Compress-Archive -Path frontend/dist/* -DestinationPath $frontendZip
          Write-Host "Uploading $frontendZip to Nexus"
          & "C:\Windows\System32\curl.exe" -v -u "$env:NEXUS_USERNAME:$env:NEXUS_PASSWORD" `
            --upload-file $frontendZip `
            "$env:NEXUS_URL/frontend/$frontendZip"

      - name: Compress and upload server build
        shell: pwsh
        run: |
          $serverBuildPath = "server/build"
          $serverZip = "server.zip"
          if (-Not (Test-Path $serverBuildPath)) {
            Write-Host "Server build folder not found. Skipping upload."
          } else {
            if (Test-Path $serverZip) { Remove-Item $serverZip }
            Compress-Archive -Path "$serverBuildPath/*" -DestinationPath $serverZip
            Write-Host "Uploading $serverZip to Nexus"
            & "C:\Windows\System32\curl.exe" -v -u "$env:NEXUS_USERNAME:$env:NEXUS_PASSWORD" `
              --upload-file $serverZip `
              "$env:NEXUS_URL/server/$serverZip"
          }
