name: Open ZAP GUI and Run Scan via API

on:
  workflow_dispatch:

jobs:
  zap-scan:
    runs-on: self-hosted

    steps:
      # 1️⃣ Launch ZAP GUI via desktop shortcut
      - name: Launch OWASP ZAP GUI
        shell: cmd
        run: |
          echo Launching OWASP ZAP GUI...
          start "" "C:\Users\Public\Desktop\ZAP 2.16.1.lnk"
          echo ✅ ZAP GUI launch initiated.

      # 2️⃣ Wait 2 minutes for ZAP to initialize
      - name: Wait for 2 minutes
        shell: cmd
        run: |
          echo Waiting 2 minutes for ZAP to initialize...
          timeout /t 120
          echo ✅ Wait complete.

      # 3️⃣ Trigger quick scan and download report
      - name: Run Quick Scan and Download Report
        shell: powershell
        run: |
          $ZAP_API = "http://localhost:8082"
          $TARGET = "http://localhost:3000"
          $REPORT_PATH = "C:\SSDLC\ZapScan_Reports\zap_report.html"

          # Ensure report folder exists
          if (-not (Test-Path "C:\SSDLC\ZapScan_Reports")) { New-Item -ItemType Directory -Path "C:\SSDLC\ZapScan_Reports" }

          # Start quick scan
          Write-Host "Starting ZAP quick scan on $TARGET..."
          Invoke-WebRequest "$ZAP_API/JSON/ascan/action/scan/?url=$TARGET" | Out-Null

          # Wait until scan completes
          Write-Host "Waiting for scan to complete..."
          do {
              Start-Sleep -Seconds 5
              $status = (Invoke-WebRequest "$ZAP_API/JSON/ascan/view/status/").Content | ConvertFrom-Json
          } while ([int]$status.status -lt 100)

          Write-Host "Scan complete. Downloading HTML report..."
          Invoke-WebRequest "$ZAP_API/OTHER/core/other/htmlreport/" -OutFile $REPORT_PATH
          Write-Host "✅ Report saved to $REPORT_PATH"
