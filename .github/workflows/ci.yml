name: Nexus Upload Optimized

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  nexus-upload:
    name: Nexus Upload
    runs-on: self-hosted

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v3

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      # --- FRONTEND BUILD ---
      - name: 🏗️ Install & Build Frontend
        working-directory: frontend
        run: |
          echo "Installing frontend dependencies..."
          npm install --legacy-peer-deps
          echo "Building frontend..."
          npm run build --if-present

      # --- SERVER BUILD ---
      - name: 🏗️ Install & Build Server
        working-directory: server
        run: |
          echo "Installing server dependencies..."
          npm install --legacy-peer-deps
          echo "Building server (TypeScript compile)..."
          npx tsc || echo "No TypeScript errors"

      # --- PACKAGE ARTIFACTS ---
      - name: 📦 Create build zips
        run: |
          echo "🧩 Preparing frontend and server zips..."
          mkdir -p dist
          powershell Compress-Archive -Path frontend/dist -DestinationPath dist/frontend-build.zip -Force
          powershell Compress-Archive -Path server -DestinationPath dist/server-build.zip -Force
          echo "✅ Zips created successfully."

      # --- NEXUS UPLOAD ---
      - name: 🚀 Upload to Nexus
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_REPO: "juice-shop-builds"
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          echo "⬆️ Uploading zips to Nexus..."
          $frontendZip = "dist/frontend-build.zip"
          $serverZip = "dist/server-build.zip"

          curl -u "$env:NEXUS_USERNAME:$env:NEXUS_PASSWORD" `
            --upload-file $frontendZip `
            "$env:NEXUS_URL/repository/$env:NEXUS_REPO/frontend-build-${{ github.run_number }}.zip"

          curl -u "$env:NEXUS_USERNAME:$env:NEXUS_PASSWORD" `
            --upload-file $serverZip `
            "$env:NEXUS_URL/repository/$env:NEXUS_REPO/server-build-${{ github.run_number }}.zip"

          echo "✅ Nexus upload completed successfully."
