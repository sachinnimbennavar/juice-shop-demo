name: Deploy Juice Shop Server

on:
  workflow_dispatch: # Manual trigger

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      # 1️⃣ Checkout repo (if needed for other files)
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Download precompiled server from Nexus
      - name: Download precompiled Juice Shop server
        run: |
          $url = "https://nexus.example.com/repo/juiceshop-precompiled.zip"
          $output = "C:\JuiceShopServer.zip"
          Invoke-WebRequest -Uri $url -OutFile $output
          Expand-Archive -Path $output -DestinationPath "C:\JuiceShopServer" -Force

      # 3️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 4️⃣ Install dependencies
      - name: Install dependencies
        run: npm install --prefix C:\JuiceShopServer

      # 5️⃣ Start Juice Shop server
      - name: Start server
        run: node C:\JuiceShopServer\app.js
