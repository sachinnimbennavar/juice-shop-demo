name: Juice Shop IIS Full Deployment

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      # 2️⃣ Fix missing provider-metadata.json file error
      - name: Create missing provider-metadata.json to avoid ENOENT error
        shell: powershell
        run: |
          $path = ".\.well-known\csaf"
          if (-not (Test-Path $path)) {
            New-Item -ItemType Directory -Force -Path $path
          }
          $file = "$path\provider-metadata.json"
          if (-not (Test-Path $file)) {
            '{}' | Out-File -Encoding utf8 $file
          }

      # 3️⃣ Install frontend dependencies
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps
          cd ..

      # 4️⃣ Build frontend
      - name: Build frontend
        run: |
          cd frontend
          npm run build -- --configuration production
          cd ..

      # 5️⃣ Install server dependencies
      - name: Install server dependencies
        run: npm install --prefer-offline --no-audit

      # 6️⃣ Build server
      - name: Build server
        run: npm run build:server

      # 7️⃣ IIS Deployment
      - name: Juice Shop IIS Deployment
        shell: powershell
        env:
          DEPLOY_PATH: C:\SSDLC\Nexus_Unzips
          IIS_SITE_NAME: JuiceShopDemo
          IIS_ROOT: C:\inetpub\wwwroot
          FRONTEND_SOURCE: C:\SSDLC\Nexus_Unzips\frontend\dist\frontend
          SERVER_SOURCE: C:\SSDLC\Nexus_Unzips\server
        run: |
          Write-Host "=== Juice Shop IIS Deployment Started ==="

          Import-Module WebAdministration

          # Stop existing IIS site if it exists
          $site = Get-Website -Name $env:IIS_SITE_NAME -ErrorAction SilentlyContinue
          if ($null -ne $site) {
              Write-Host "[INFO] Stopping existing IIS site $($env:IIS_SITE_NAME)..."
              Stop-Website -Name $env:IIS_SITE_NAME
          }

          # Create IIS root folder if missing
          $iisPath = Join-Path $env:IIS_ROOT $env:IIS_SITE_NAME
          if (-Not (Test-Path $iisPath)) {
              Write-Host "[INFO] Creating IIS directory $iisPath..."
              New-Item -ItemType Directory -Path $iisPath -Force | Out-Null
          }

          # Clear IIS folder
          Write-Host "[INFO] Clearing existing files from $iisPath..."
          Get-ChildItem $iisPath -Recurse -Force | Remove-Item -Force -Recurse

          # Copy frontend
          if (Test-Path $env:FRONTEND_SOURCE) {
              Write-Host "[INFO] Copying frontend from $($env:FRONTEND_SOURCE) to $iisPath..."
              Copy-Item -Path (Join-Path $env:FRONTEND_SOURCE '*') -Destination $iisPath -Recurse -Force
          } else {
              Write-Host "[WARNING] Frontend build folder not found: $($env:FRONTEND_SOURCE)"
          }

          # Copy server
          if (Test-Path $env:SERVER_SOURCE) {
              Write-Host "[INFO] Copying server from $($env:SERVER_SOURCE) to $iisPath..."
              Copy-Item -Path (Join-Path $env:SERVER_SOURCE '*') -Destination $iisPath -Recurse -Force
          } else {
              Write-Host "[WARNING] Server build folder not found: $($env:SERVER_SOURCE)"
          }

          # Start IIS site or create if missing
          $site = Get-Website -Name $env:IIS_SITE_NAME -ErrorAction SilentlyContinue
          if ($null -ne $site) {
              Write-Host "[INFO] Starting IIS site $($env:IIS_SITE_NAME)..."
              Start-Website -Name $env:IIS_SITE_NAME
          } else {
              Write-Host "[INFO] Creating new IIS site $($env:IIS_SITE_NAME) on port 8080..."
              New-Website -Name $env:IIS_SITE_NAME -Port 8080 -PhysicalPath $iisPath -Force | Out-Null
          }

          Write-Host "=== Deployment Completed Successfully ==="
