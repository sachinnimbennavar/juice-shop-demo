name: Juice Shop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_only:
        description: "Run only deployment (skip build)"
        required: false
        default: "false"
      run_build:
        description: "Run build (set to false if deploy_only=true)"
        required: false
        default: "true"

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set Node memory
      - name: Set Node memory
        run: set NODE_OPTIONS=--max_old_space_size=4096

      # 3️⃣ Cache frontend
      - name: Cache frontend
        if: ${{ github.event.inputs.run_build == 'true' }}
        uses: actions/cache@v3
        with:
          path: |
            frontend/node_modules
            frontend/dist
            frontend/.angular
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      # 4️⃣ Cache server
      - name: Cache server
        if: ${{ github.event.inputs.run_build == 'true' }}
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-server-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-server-

      # 5️⃣ Install frontend dependencies
      - name: Install frontend dependencies
        if: ${{ github.event.inputs.run_build == 'true' }}
        run: |
          cd frontend
          npm install --legacy-peer-deps --prefer-offline --no-audit
          cd ..

      # 6️⃣ Build frontend
      - name: Build frontend
        if: ${{ github.event.inputs.run_build == 'true' }}
        run: |
          cd frontend
          npm run build -- --configuration production --watch=false --verbose
          cd ..

      # 7️⃣ Install server dependencies
      - name: Install server dependencies
        if: ${{ github.event.inputs.run_build == 'true' }}
        run: npm install --prefer-offline --no-audit

      # 8️⃣ Build server
      - name: Build server
        if: ${{ github.event.inputs.run_build == 'true' }}
        run: npm run build:server

      # 9️⃣ Optional SonarQube
      - name: SonarQube Scan
        if: ${{ github.event.inputs.run_build == 'true' }}
        run: |
          if (Get-Command sonar-scanner -ErrorAction SilentlyContinue) {
              echo "Running SonarQube scanner..."
              set SONAR_HOST_URL=http://127.0.0.1:9000
              sonar-scanner
          } else {
              echo "sonar-scanner not found, skipping SonarQube analysis."
          }

      # 🔟 Nexus Upload Phase
      - name: Upload build artifacts to Nexus
        if: ${{ github.event.inputs.run_build == 'true' }}
        shell: powershell
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          Write-Host "[INFO] Preparing frontend and server zips..."
          if (Test-Path "frontend/dist") {
              Compress-Archive -Path "frontend/dist/*" -DestinationPath "frontend-build.zip" -Force
          }
          $serverPaths = @("app.ts","server.ts","package.json","tsconfig.json","models","routes","lib","data","views","rsn","config","build") | Where-Object { Test-Path $_ }
          if ($serverPaths.Count -gt 0) { Compress-Archive -Path $serverPaths -DestinationPath "server-build.zip" -Force }
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }
          if (Test-Path "frontend-build.zip") { Invoke-RestMethod -Uri "${env:NEXUS_URL}/repository/juice-shop/frontend-build-${env:GITHUB_RUN_NUMBER}.zip" -Method Put -InFile "frontend-build.zip" -Headers $headers }
          if (Test-Path "server-build.zip") { Invoke-RestMethod -Uri "${env:NEXUS_URL}/repository/juice-shop/server-build-${env:GITHUB_RUN_NUMBER}.zip" -Method Put -InFile "server-build.zip" -Headers $headers }

      # 11️⃣ Deployment stage
      - name: Deploy from Nexus
        if: ${{ github.event.inputs.deploy_only == 'true' || (github.event.inputs.run_build == 'true' && github.event.inputs.deploy_only != 'true') }}
        shell: powershell
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          FRONTEND_DEST: C:\inetpub\wwwroot\juice-shop
          SERVER_DEST: C:\JuiceShopServer
        run: |
          Write-Host "[INFO] Starting deployment..."

          function Get-LatestZip {
              param ([string]$artifactPrefix)

              $pair = "$($env:NEXUS_USERNAME):$($env:NEXUS_PASSWORD)"
              $authHeader = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair))
              $headers = @{ Authorization = "Basic $authHeader" }

              # Raw repository, no group
              $uri = "$env:NEXUS_URL/service/rest/v1/search/assets?repository=juice-shop-artifacts"
              Write-Host "[INFO] Querying Nexus: $uri"

              try {
                  $response = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
              } catch {
                  Write-Host "[ERROR] Nexus API call failed: $_"
                  return $null
              }

              if ($null -eq $response.items -or $response.items.Count -eq 0) {
                  Write-Host "[WARN] No items found in Nexus for repository 'juice-shop-artifacts'"
                  return $null
              }

              # Filter by artifact prefix (frontend-build* / server-build*)
              $filtered = $response.items | Where-Object { $_
