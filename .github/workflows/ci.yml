name: Juice Shop CI - Upload Only

on:
  workflow_dispatch: # manual trigger

jobs:
  package-and-upload:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout code (needed to access source files)
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Package & upload everything to Nexus
      - name: Package and upload build artifacts to Nexus
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          Write-Host "Packaging and uploading build artifacts..."

          $timestamp = Get-Date -Format "yyyyMMddHHmmss"
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          # Create temp folders for packaging
          $tempFolder = "temp_artifacts_$timestamp"
          New-Item -ItemType Directory -Force -Path $tempFolder | Out-Null

          # Copy everything except node_modules and .git
          $exclude = @("node_modules", ".git")
          Get-ChildItem -Recurse -Force | Where-Object { $exclude -notcontains $_.Name } | ForEach-Object {
              $dest = Join-Path $tempFolder $_.FullName.Substring((Get-Location).Path.Length + 1)
              if ($_.PSIsContainer) {
                  New-Item -ItemType Directory -Force -Path $dest | Out-Null
              } else {
                  $parentDir = Split-Path $dest
                  if (!(Test-Path $parentDir)) { New-Item -ItemType Directory -Force -Path $parentDir | Out-Null }
                  Copy-Item $_.FullName -Destination $dest -Force
              }
          }

          # Compress the full repository
          $fullZip = "juice-shop-full-$timestamp.zip"
          Compress-Archive -Path "$tempFolder/*" -DestinationPath $fullZip -Force

          # Generate SHA256 checksum
          $checksumFile = "$($fullZip -replace '.zip','.sha256')"
          $checksum = Get-FileHash -Path $fullZip -Algorithm SHA256
          $checksum.Value | Out-File -FilePath $checksumFile

          # Upload ZIP
          $nexusZipUrl = "${env:NEXUS_URL}/com/example/juiceshop/full-build/$timestamp/$fullZip"
          Write-Host "Uploading ZIP to Nexus → $nexusZipUrl"
          Invoke-RestMethod -Uri $nexusZipUrl -Method Put -InFile $fullZip -Headers $headers

          # Upload checksum
          $nexusChecksumUrl = "${env:NEXUS_URL}/com/example/juiceshop/full-build/$timestamp/$($fullZip -replace '.zip','.sha256')"
          Write-Host "Uploading checksum → $nexusChecksumUrl"
          Invoke-RestMethod -Uri $nexusChecksumUrl -Method Put -InFile $checksumFile -Headers $headers

          Write-Host "✅ Full repository packaged and uploaded successfully."
