name: Juice Shop Deployment

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  deploy:
    runs-on: self-hosted

    env:
      NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
      DEPLOY_PATH: C:\SSDLC\Nexus_Unzips

    steps:
      - name: 🧩 Checkout code
        uses: actions/checkout@v3

      - name: ⚙️ Setup PowerShell environment
        shell: powershell
        run: |
          Write-Host "[INFO] Deployment job started..."
          Write-Host "Working directory: $PWD"

      - name: 🚀 Download and unzip latest full-repo ZIP from Nexus
        shell: powershell
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          # Prepare Basic Auth
          $base64Auth = [System.Convert]::ToBase64String(
              [System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}")
          )
          $headers = @{ Authorization = "Basic $base64Auth" }

          # Fetch metadata XML to get latest version
          $metaUrl = "${env:NEXUS_URL}/com/example/juiceshop/full-repo/maven-metadata.xml"
          Write-Host "[INFO] Fetching latest version metadata from $metaUrl ..."
          try {
              [xml]$metaXml = Invoke-WebRequest -Uri $metaUrl -Headers $headers
              $latestVersion = $metaXml.metadata.versioning.latest
              Write-Host "[INFO] Latest full-repo version: $latestVersion"
          }
          catch {
              Write-Host "[ERROR] Failed to fetch latest version from Nexus."
              Write-Host $_.Exception.Message
              exit 1
          }

          # Construct ZIP URL
          $zipFileName = "full-repo-$latestVersion.zip"
          $zipUrl = "${env:NEXUS_URL}/com/example/juiceshop/full-repo/$latestVersion/$zipFileName"
          $zipFilePath = "$PWD\$zipFileName"
          Write-Host "[INFO] Downloading latest ZIP: $zipUrl ..."

          try {
              Invoke-WebRequest -Uri $zipUrl -OutFile $zipFilePath -Headers $headers
              Write-Host "[INFO] ZIP downloaded to $zipFilePath"
          }
          catch {
              Write-Host "[ERROR] Failed to download ZIP from Nexus."
              Write-Host $_.Exception.Message
              exit 1
          }

          # Unzip to deployment path
          if (-Not (Test-Path "${env:DEPLOY_PATH}")) {
              Write-Host "[INFO] Creating deployment directory: ${env:DEPLOY_PATH}"
              New-Item -ItemType Directory -Path "${env:DEPLOY_PATH}" | Out-Null
          }

          Write-Host "[INFO] Extracting ZIP to ${env:DEPLOY_PATH} ..."
          Expand-Archive -Path $zipFilePath -DestinationPath "${env:DEPLOY_PATH}" -Force
          Write-Host "[SUCCESS] Full-repo deployed successfully to ${env:DEPLOY_PATH}"
