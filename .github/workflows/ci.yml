name: Juice Shop CI - Deploy Latest Builds

on:
  workflow_dispatch:   # manual trigger

jobs:
  deploy:
    name: Deploy Latest Builds
    runs-on: windows-latest
    needs: upload  # assumes you have an "upload" job that runs before

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Starting Deployment
        run: |
          Write-Host "[INFO] Starting deployment..."

      - name: Fetch latest versions from Nexus metadata
        run: |
          $baseUrl = "http://127.0.0.1:8081/repository/JuiceShopMavenDemo/com/example/juiceshop"

          Write-Host "[INFO] Reading latest version for frontend-build..."
          $frontendMetadataUrl = "$baseUrl/frontend-build/maven-metadata.xml"
          $frontendMetadata = Invoke-WebRequest $frontendMetadataUrl -UseBasicParsing
          $frontendVersion = [regex]::Match($frontendMetadata.Content, "<latest>(\d{14})</latest>").Groups[1].Value

          Write-Host "[INFO] Reading latest version for server-build..."
          $serverMetadataUrl = "$baseUrl/server-build/maven-metadata.xml"
          $serverMetadata = Invoke-WebRequest $serverMetadataUrl -UseBasicParsing
          $serverVersion = [regex]::Match($serverMetadata.Content, "<latest>(\d{14})</latest>").Groups[1].Value

          if (-not $frontendVersion -or -not $serverVersion) {
              Write-Host "[ERROR] Could not extract version(s) from metadata!"
              exit 1
          }

          Write-Host "[INFO] Latest Frontend Version: $frontendVersion"
          Write-Host "[INFO] Latest Server Version: $serverVersion"

          echo "FRONTEND_VERSION=$frontendVersion" >> $env:GITHUB_ENV
          echo "SERVER_VERSION=$serverVersion" >> $env:GITHUB_ENV

      - name: Download and extract latest artifacts
        run: |
          $baseUrl = "http://127.0.0.1:8081/repository/JuiceShopMavenDemo/com/example/juiceshop"
          $frontendUrl = "$baseUrl/frontend-build/${env:FRONTEND_VERSION}/frontend-build-${env:FRONTEND_VERSION}.zip"
          $serverUrl   = "$baseUrl/server-build/${env:SERVER_VERSION}/server-build-${env:SERVER_VERSION}.zip"

          Write-Host "[INFO] Downloading frontend from: $frontendUrl"
          Write-Host "[INFO] Downloading server from: $serverUrl"

          New-Item -ItemType Directory -Force -Path "C:\deploy\frontend" | Out-Null
          New-Item -ItemType Directory -Force -Path "C:\deploy\server" | Out-Null

          Invoke-WebRequest $frontendUrl -OutFile "frontend.zip"
          Invoke-WebRequest $serverUrl -OutFile "server.zip"

          Write-Host "[INFO] Extracting frontend..."
          Expand-Archive frontend.zip -DestinationPath "C:\deploy\frontend" -Force

          Write-Host "[INFO] Extracting server..."
          Expand-Archive server.zip -DestinationPath "C:\deploy\server" -Force

      - name: Verify deployment
        run: |
          if (Test-Path "C:\deploy\frontend\frontend\index.html" -and
              Test-Path "C:\deploy\server\package.json") {
              Write-Host "[SUCCESS] Deployment verified successfully."
          } else {
              Write-Host "[ERROR] Deployment verification failed!"
              exit 1
          }

      - name: ✅ Deployment completed
        run: |
          Write-Host "[SUCCESS] Latest builds deployed successfully!"
