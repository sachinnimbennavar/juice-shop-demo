name: Juice Shop Deployment Only

on:
  workflow_dispatch:

jobs:
  deploy-only:
    runs-on: self-hosted

    env:
      DEPLOY_PATH: "C:\\SSDLC\\Nexus_Unzips"
      IIS_SITE: "JuiceShop"
      IIS_APPPOOL: "JuiceShopAppPool"
      NODE_EXE: "C:\\Program Files\\nodejs\\node.exe"
      NSSM_EXE: "C:\\SSDLC\\nssm-2.24\\nssm-2.24\\win64\\nssm.exe"
      ARTIFACT_DIR: "C:\\SSDLC\\ci-artifacts"
      ARTIFACT_NAME: "full-repo.zip"
      SEVEN_ZIP_EXE: "C:\\Program Files\\7-Zip\\7z.exe"  # Path to 7z.exe

    steps:
      # 1️⃣ Prepare deployment artifact using 7-Zip
      - name: Prepare deployment artifact
        shell: powershell
        run: |
          Write-Host "[INFO] Preparing deployment artifact with 7-Zip..."
          if (Test-Path $env:ARTIFACT_DIR) { Remove-Item -Recurse -Force $env:ARTIFACT_DIR }
          New-Item -ItemType Directory -Path $env:ARTIFACT_DIR | Out-Null

          $version = (Get-Date -Format "yyyyMMddHHmmss")
          $artifactZip = Join-Path $env:ARTIFACT_DIR "full-repo-$version.zip"

          # Only include paths that exist
          $pathsToZip = @()
          if (Test-Path "frontend\dist\frontend") { $pathsToZip += "frontend\dist\frontend" }
          if (Test-Path "build") { $pathsToZip += "build" }
          if (Test-Path "node_modules") { $pathsToZip += "node_modules" }
          if (Test-Path "package.json") { $pathsToZip += "package.json" }
          if (Test-Path "web.config") { $pathsToZip += "web.config" }

          if ($pathsToZip.Count -eq 0) {
              Write-Host "⚠️ No files found to package. Skipping artifact creation."
          } else {
              & "$env:SEVEN_ZIP_EXE" a -tzip $artifactZip @pathsToZip -mx=9
              Write-Host "✅ Artifact packaged at: $artifactZip"
          }

      # 2️⃣ Upload artifact to Nexus Maven repository
      - name: Upload artifact to Nexus (Maven)
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          $version = (Get-Date -Format "yyyyMMddHHmmss")
          $artifactZip = Join-Path $env:ARTIFACT_DIR "full-repo-$version.zip"

          Write-Host "[INFO] Uploading $artifactZip to Nexus Maven repository..."

          & mvn deploy:deploy-file `
              -DgroupId=com.example.juiceshop `
              -DartifactId=full-repo `
              -Dversion=$version `
              -Dpackaging=zip `
              -Dfile=$artifactZip `
              -DrepositoryId=juiceshop-repo `
              -Durl=$env:NEXUS_URL `
              -Dusername=$env:NEXUS_USERNAME `
              -Dpassword=$env:NEXUS_PASSWORD

          Write-Host "✅ Artifact uploaded successfully to Maven repo."

      # 3️⃣ Deploy frontend to IIS
      - name: Deploy Frontend to IIS
        shell: powershell
        run: |
          Import-Module WebAdministration
          $src = Join-Path $env:DEPLOY_PATH "frontend\dist\frontend"
          $dest = "C:\\inetpub\\wwwroot\\$env:IIS_SITE"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item -Path "$src\*" -Destination $dest -Recurse -Force

          if (-not (Test-Path "IIS:\AppPools\$env:IIS_APPPOOL")) {
              New-WebAppPool -Name $env:IIS_APPPOOL | Out-Null
              Set-ItemProperty "IIS:\AppPools\$env:IIS_APPPOOL" -Name processModel.identityType -Value "ApplicationPoolIdentity"
          }

          if (-not (Test-Path "IIS:\Sites\$env:IIS_SITE")) {
              New-Website -Name $env:IIS_SITE -Port 8080 -PhysicalPath $dest -ApplicationPool $env:IIS_APPPOOL
          } else {
              Set-ItemProperty "IIS:\Sites\$env:IIS_SITE" -Name applicationPool -Value $env:IIS_APPPOOL
          }
          Restart-WebAppPool -Name $env:IIS_APPPOOL
          Write-Host "✅ Frontend deployed to IIS"

      # 4️⃣ Deploy backend Node.js via NSSM
      - name: Deploy Backend Node.js
        shell: powershell
        run: |
          $serviceName = "JuiceShopServer"
          $nodeExe = $env:NODE_EXE
          $serverJs = Join-Path $env:DEPLOY_PATH "build\server.js"
          $nssmExe = $env:NSSM_EXE

          if (-not (Get-Service -Name $serviceName -ErrorAction SilentlyContinue)) {
              & $nssmExe install $serviceName $nodeExe $serverJs
              & $nssmExe set $serviceName AppDirectory (Join-Path $env:DEPLOY_PATH "build")
              & $nssmExe set $serviceName AppStdout (Join-Path $env:DEPLOY_PATH "build\server-out.log")
              & $nssmExe set $serviceName AppStderr (Join-Path $env:DEPLOY_PATH "build\server-err.log")
          }

          $svc = Get-Service -Name $serviceName
          if ($svc.Status -eq "Running") { Restart-Service $serviceName -Force } else { Start-Service $serviceName }
          Write-Host "✅ Backend Node.js service started via NSSM"
