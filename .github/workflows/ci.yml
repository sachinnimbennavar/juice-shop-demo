name: Juice Shop IIS Deployment Only

on:
  workflow_dispatch:  # Manual trigger from GitHub Actions

jobs:
  deploy:
    name: Deploy to IIS from local unzipped folder
    runs-on: self-hosted

    steps:
      - name: Deploy to IIS
        shell: powershell
        run: |
          Import-Module WebAdministration

          $siteName = "JuiceShopDemo"
          $source = "C:\SSDLC\Nexus_Unzips"
          $destination = "C:\inetpub\wwwroot\JuiceShopDemo"

          Write-Host "=== Juice Shop IIS Deployment Started ==="

          if (-not (Test-Path $source)) {
              Write-Error "Source path $source not found! Make sure CI/CD pipeline completed unzip phase."
              exit 1
          }

          # Stop existing IIS site if it exists
          if (Test-Path "IIS:\Sites\$siteName") {
              Write-Host "Stopping existing IIS site $siteName..."
              Stop-Website -Name $siteName
          } else {
              Write-Host "No existing site found. It will be created."
          }

          # Clear target folder
          if (Test-Path $destination) {
              Write-Host "Clearing old files from $destination..."
              Remove-Item -Path "$destination\*" -Recurse -Force
          } else {
              Write-Host "Creating directory $destination..."
              New-Item -ItemType Directory -Path $destination -Force | Out-Null
          }

          # Copy new build files
          Write-Host "Copying files from $source to $destination..."
          Copy-Item -Path "$source\*" -Destination $destination -Recurse -Force
          Write-Host "✅ Files copied successfully."

          # Start or create IIS site
          if (Test-Path "IIS:\Sites\$siteName") {
              Write-Host "Starting existing IIS site..."
              Start-Website -Name $siteName
              Write-Host "✅ IIS site restarted successfully."
          } else {
              Write-Host "Creating new IIS site on port 8080..."
              New-Website -Name $siteName -Port 8080 -PhysicalPath $destination -Force | Out-Null
              Write-Host "✅ New IIS site created and running on port 8080."
          }

          Write-Host "=== Deployment Completed Successfully ==="
