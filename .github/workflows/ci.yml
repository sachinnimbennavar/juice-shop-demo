name: JuiceShop-Manual-Deployment

on:
  workflow_dispatch:  # This allows you to run manually from GitHub Actions

jobs:
  deploy:
    runs-on: windows-latest
    env:
      DEPLOY_PATH_SERVER: C:\JuiceShopServer

    steps:
      - name: Checkout code (optional)
        uses: actions/checkout@v3

      - name: Stop Running Server
        run: |
          # Stop PM2 process if running
          if (pm2 list | findstr JuiceShop) {
            pm2 stop JuiceShop
          }

      - name: Extract Frontend & Backend
        run: |
          # Remove old folders
          Remove-Item -Recurse -Force $env:DEPLOY_PATH_SERVER\frontend
          Remove-Item -Recurse -Force $env:DEPLOY_PATH_SERVER\backend

          # Extract new zips
          Expand-Archive -Path "$env:DEPLOY_PATH_SERVER\frontend.zip" -DestinationPath "$env:DEPLOY_PATH_SERVER\frontend"
          Expand-Archive -Path "$env:DEPLOY_PATH_SERVER\backend.zip" -DestinationPath "$env:DEPLOY_PATH_SERVER\backend"

      - name: Install Frontend Dependencies & Build
        run: |
          cd $env:DEPLOY_PATH_SERVER\frontend
          npm install
          npm run build

      - name: Install Backend Dependencies
        run: |
          cd $env:DEPLOY_PATH_SERVER\backend
          npm install

      - name: Copy Frontend Build to Backend
        run: |
          # Remove old public folder
          Remove-Item -Recurse -Force "$env:DEPLOY_PATH_SERVER\backend\public"
          # Copy new frontend build
          Copy-Item -Recurse "$env:DEPLOY_PATH_SERVER\frontend\dist\frontend\*" "$env:DEPLOY_PATH_SERVER\backend\public\"

      - name: Start Backend Server
        run: |
          cd $env:DEPLOY_PATH_SERVER\backend
          npm install -g pm2
          if (pm2 list | findstr JuiceShop) {
            pm2 restart JuiceShop
          } else {
            pm2 start server.js --name JuiceShop
            pm2 save
          }
