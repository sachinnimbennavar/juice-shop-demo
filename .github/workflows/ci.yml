name: Juice Shop IIS Deployment

on:
  workflow_dispatch:  # Manual trigger

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1️⃣ Test workflow dispatch
      - name: Print test message
        run: echo "✅ Workflow triggered successfully on $(hostname)"

      # 2️⃣ IIS Deployment (frontend & backend) from existing unzipped folder
      - name: Deploy Frontend & Backend to IIS
        shell: powershell
        run: |
          Import-Module WebAdministration

          # Frontend
          $FE_SRC = "C:\SSDLC\Nexus_Unzips\frontend\dist\frontend"
          $FE_DEST = "C:\inetpub\wwwroot\JuiceShopFrontend"
          if (-Not (Test-Path $FE_SRC)) { 
              Write-Error "Frontend source path not found: $FE_SRC"; exit 1 
          }
          if (-Not (Test-Path $FE_DEST)) { New-Item -ItemType Directory -Path $FE_DEST | Out-Null }
          Remove-Item "$FE_DEST\*" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item "$FE_SRC\*" $FE_DEST -Recurse
          $siteFE = Get-Website -Name "JuiceShopFrontend" -ErrorAction SilentlyContinue
          if ($null -ne $siteFE) { Stop-Website -Name "JuiceShopFrontend"; Start-Website -Name "JuiceShopFrontend" }
          else { New-Website -Name "JuiceShopFrontend" -Port 8081 -PhysicalPath $FE_DEST | Out-Null }

          # Backend
          $BE_SRC = "C:\SSDLC\Nexus_Unzips\server"
          $BE_DEST = "C:\inetpub\wwwroot\JuiceShopBackend"
          if (-Not (Test-Path $BE_SRC)) { 
              Write-Error "Backend source path not found: $BE_SRC"; exit 1 
          }
          if (-Not (Test-Path $BE_DEST)) { New-Item -ItemType Directory -Path $BE_DEST | Out-Null }
          Remove-Item "$BE_DEST\*" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item "$BE_SRC\*" $BE_DEST -Recurse
          $siteBE = Get-Website -Name "JuiceShopBackend" -ErrorAction SilentlyContinue
          if ($null -ne $siteBE) { Stop-Website -Name "JuiceShopBackend"; Start-Website -Name "JuiceShopBackend" }
          else { New-Website -Name "JuiceShopBackend" -Port 8080 -PhysicalPath $BE_DEST | Out-Null }

          Write-Host "✅ Frontend and Backend deployed to IIS successfully!"
