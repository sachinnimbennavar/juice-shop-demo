name: Open OWASP ZAP and Scan Juice Shop

on:
  workflow_dispatch:

jobs:
  zap-scan:
    runs-on: self-hosted

    steps:
      # 1️⃣ Launch ZAP GUI via desktop shortcut only if not already running
      - name: Launch OWASP ZAP via Desktop Shortcut
        shell: powershell
        run: |
          $zapProcess = Get-Process -Name "ZAP" -ErrorAction SilentlyContinue
          if (-not $zapProcess) {
              Write-Host "ZAP is not running. Launching OWASP ZAP..."
              Start-Process "C:\Users\Public\Desktop\ZAP 2.16.1.lnk"
              Write-Host "Waiting 1 minute for ZAP to fully open..."
              Start-Sleep -Seconds 60
              Write-Host "✅ ZAP GUI should now be fully open."
          } else {
              Write-Host "ZAP is already running. Skipping launch."
          }

      # 2️⃣ Trigger active scan on Juice Shop (localhost:3000) via ZAP API
      - name: Trigger ZAP Scan
        shell: powershell
        run: |
          Write-Host "Starting scan for http://localhost:3000..."
          # Run ZAP in daemon mode for automation
          $zapPath = "C:\Program Files\OWASP\ZAP\zap.bat"
          Start-Process $zapPath -ArgumentList "-daemon" -NoNewWindow
          Start-Sleep -Seconds 10  # wait a bit for ZAP daemon to start

          # Use ZAP CLI to start the scan
          zap-cli --zap-url http://localhost:8080 --start-scanner --target http://localhost:3000
          Write-Host "✅ Scan started. You can monitor progress in ZAP GUI or generate report manually."
