name: Juice Shop Deploy Only

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  deploy:
    name: Deploy Latest Build
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy from Maven Nexus
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          FRONTEND_DEST: C:\inetpub\wwwroot\juice-shop
          SERVER_DEST: C:\JuiceShopServer
          SERVER_PROCESS_NAME: JuiceShopServer
        run: |
          Write-Host "[INFO] Starting deployment..."

          $base64Auth = [System.Convert]::ToBase64String(
              [System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}")
          )
          $headers = @{ Authorization = "Basic $base64Auth" }

          # --- Function to get the latest version folder name ---
          function Get-LatestVersion {
              param([string]$artifactPath)
              $url = "$($env:NEXUS_URL)/$artifactPath/"
              Write-Host "[INFO] Fetching list from $url ..."
              try {
                  $response = Invoke-RestMethod -Uri $url -Headers $headers
              } catch {
                  Write-Host "[ERROR] Failed to fetch artifact list. $_"
                  exit 1
              }

              # Extract folder names using regex for timestamp or version format
              $matches = [regex]::Matches($response, '>(\d{8,14})/<')
              if ($matches.Count -eq 0) {
                  Write-Host "[ERROR] No version folders found!"
                  exit 1
              }

              # Return latest timestamp
              return ($matches | ForEach-Object { $_.Groups[1].Value } | Sort-Object | Select-Object -Last 1)
          }

          # --- Function to download and extract zip ---
          function Download-And-Extract {
              param([string]$url, [string]$destination)
              Write-Host "[INFO] Downloading $url ..."
              $zipFile = Join-Path $env:TEMP ([System.IO.Path]::GetFileName($url))
              try {
                  Invoke-WebRequest -Uri $url -OutFile $zipFile -Headers $headers
              } catch {
                  Write-Host "[ERROR] Failed to download $url"
                  exit 1
              }
              if (-not (Test-Path $destination)) {
                  New-Item -ItemType Directory -Path $destination -Force | Out-Null
              }
              Expand-Archive -Path $zipFile -DestinationPath $destination -Force
              Write-Host "[INFO] Extracted to $destination"
          }

          # --- Get latest versions ---
          $latestFrontend = Get-LatestVersion -artifactPath "com/example/juiceshop/frontend-build"
          $latestServer = Get-LatestVersion -artifactPath "com/example/juiceshop/server-build"

          Write-Host "[INFO] Latest Frontend Build: $latestFrontend"
          Write-Host "[INFO] Latest Server Build: $latestServer"

          # --- Construct artifact URLs ---
          $frontendUrl = "$($env:NEXUS_URL)/com/example/juiceshop/frontend-build/$latestFrontend/frontend-build-$latestFrontend.zip"
          $serverUrl   = "$($env:NEXUS_URL)/com/example/juiceshop/server-build/$latestServer/server-build-$latestServer.zip"

          # --- Deploy frontend ---
          Download-And-Extract -url $frontendUrl -destination $env:FRONTEND_DEST

          # --- Deploy server ---
          Download-And-Extract -url $serverUrl -destination $env:SERVER_DEST

          # --- Restart Node.js server via NSSM ---
          if (Get-Command nssm -ErrorAction SilentlyContinue) {
              Write-Host "[INFO] Restarting $env:SERVER_PROCESS_NAME ..."
              if (Get-Service -Name $env:SERVER_PROCESS_NAME -ErrorAction SilentlyContinue) {
                  Stop-Service -Name $env:SERVER_PROCESS_NAME -Force
                  Start-Sleep -Seconds 5
              }
              if (-not (Get-Service -Name $env:SERVER_PROCESS_NAME -ErrorAction SilentlyContinue)) {
                  nssm install $env:SERVER_PROCESS_NAME "C:\Program Files\nodejs\node.exe" "$env:SERVER_DEST\build\server.js"
              }
              Start-Service -Name $env:SERVER_PROCESS_NAME
              Write-Host "[INFO] Deployment completed successfully!"
          } else {
              Write-Host "[WARN] NSSM not installed. Start the Node server manually."
          }
