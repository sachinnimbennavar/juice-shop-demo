name: Juice Shop Full Repo Upload

on:
  workflow_dispatch:

jobs:
  full-repo-upload:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Install dependencies and build project
      - name: Install dependencies and build project
        shell: powershell
        run: |
          Write-Host "[INFO] Installing dependencies..."
          npm install --legacy-peer-deps
          if (Test-Path "package.json") {
            Write-Host "[INFO] Running build (if defined)..."
            npm run build --if-present
          }
          Write-Host "[INFO] Build step complete."

      # 3️⃣ Create full repo ZIP preserving order
      - name: Create full repo ZIP
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          $version = (Get-Date -Format "yyyyMMddHHmmss")
          $serverZip = "full-repo-$version.zip"
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          Write-Host "[INFO] Preparing ZIP file $serverZip ..."

          # Folder and file order (includes build, logs, node_modules explicitly)
          $itemsInOrder = @(
              ".dependabot",".github",".gitlab",".well-known",".zap",
              "build","config","data","encryptionkeys","frontend","ftp","i18n",
              "lib","logs","models","monitoring","node_modules","routes","rsn",
              "screenshots","test","uploads","vagrant","views",
              ".codeclimate.yml",".devcontainer.json",".dockerignore",".eslintrc.js",".gitignore",
              ".gitlab-ci.yml",".gitpod.yml",".mailmap",".npmrc",
              "app.json","app.ts","CODE_OF_CONDUCT.md","config.schema.yml","CONTRIBUTING.md","crowdin.yaml",
              "ctf.key","cypress.config.ts","docker-compose.test.yml","Dockerfile","Gruntfile.js",
              "HALL_OF_FAME.md","LICENSE","package.json","README.md","REFERENCES.md","SECURITY.md",
              "server.ts","SOLUTIONS.md","swagger.yml","threat-model.json","tsconfig.json"
          )

          # Ensure critical folders exist
          foreach ($folder in @("build","logs","node_modules")) {
            if (Test-Path $folder) {
              Write-Host "[INFO] Verified folder present: $folder"
            } else {
              Write-Host "[WARNING] Folder missing: $folder"
            }
          }

          # Keep only existing items
          $itemsToZip = $itemsInOrder | Where-Object { Test-Path $_ }

          # Remove old ZIP if exists
          if (Test-Path $serverZip) { Remove-Item $serverZip -Force }

          # Add items sequentially to ZIP
          foreach ($item in $itemsToZip) {
              Write-Host "Adding $item to ZIP..."
              Compress-Archive -Path $item -Update -DestinationPath $serverZip
          }

          Write-Host "✅ Full repo ZIP created: $serverZip"

          # 4️⃣ Upload ZIP to Nexus
          $serverUrl = "${env:NEXUS_URL}/com/example/juiceshop/full-repo/$version/$serverZip"
          Write-Host "⬆️ Uploading to Nexus → $serverUrl"
          Invoke-RestMethod -Uri $serverUrl -Method Put -InFile $serverZip -Headers $headers -ContentType "application/zip"
          Write-Host "✅ Full repo uploaded successfully."
