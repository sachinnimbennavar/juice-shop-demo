name: Juice Shop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend-build:
    runs-on: self-hosted
    steps:
      - name: Restore repository cache
        uses: actions/cache@v3
        with:
          path: ./repo
          key: repo-${{ hashFiles('**/*') }}

      - name: Checkout repo if cache missed
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v3
        with:
          path: ./repo

      - name: Set Node memory
        run: set NODE_OPTIONS=--max_old_space_size=4096

      # Cache frontend dependencies
      - name: Cache frontend
        uses: actions/cache@v3
        with:
          path: |
            repo/frontend/node_modules
            repo/frontend/.angular
          key: ${{ runner.os }}-frontend-${{ hashFiles('repo/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install frontend dependencies
        run: |
          cd repo/frontend
          npm ci --legacy-peer-deps --prefer-offline --no-audit
          cd ../..

      - name: Build frontend
        run: |
          cd repo/frontend
          npm run build -- --configuration production --watch=false
          cd ../..

  server-build:
    runs-on: self-hosted
    steps:
      - name: Restore repository cache
        uses: actions/cache@v3
        with:
          path: ./repo
          key: repo-${{ hashFiles('**/*') }}

      - name: Checkout repo if cache missed
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v3
        with:
          path: ./repo

      - name: Set Node memory
        run: set NODE_OPTIONS=--max_old_space_size=4096

      # Cache server dependencies
      - name: Cache server
        uses: actions/cache@v3
        with:
          path: repo/node_modules
          key: ${{ runner.os }}-server-${{ hashFiles('repo/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-server-

      - name: Install server dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build server
        run: npm run build:server
        working-directory: ./repo

  sonar-analysis:
    runs-on: self-hosted
    needs:
      - frontend-build
      - server-build
    steps:
      - name: Restore repository cache
        uses: actions/cache@v3
        with:
          path: ./repo
          key: repo-${{ hashFiles('**/*') }}

      - name: SonarQube Scan
        run: |
          if (Get-Command sonar-scanner -ErrorAction SilentlyContinue) {
              echo "Running SonarQube scanner..."
              set SONAR_HOST_URL=http://127.0.0.1:9000
              sonar-scanner
          } else {
              echo "sonar-scanner not found, skipping analysis."
          }
