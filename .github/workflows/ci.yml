name: Juice Shop Deployment (Resume from Extracted ZIPs)

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  deploy:
    runs-on: self-hosted

    env:
      DEPLOY_PATH_FRONTEND: C:\JuiceShopServer\frontend
      DEPLOY_PATH_SERVER: C:\JuiceShopServer

    steps:
      - name: ⚙️ Setup PowerShell environment
        shell: powershell
        run: |
          Write-Host "[INFO] Deployment job started..."
          Write-Host "Working directory: $PWD"

      - name: 🖥️ Install backend dependencies
        shell: powershell
        run: |
          Write-Host "[INFO] Installing server dependencies..."
          cd $env:DEPLOY_PATH_SERVER
          if (Test-Path "package-lock.json") {
              Write-Host "[INFO] Cleaning previous node_modules..."
              Remove-Item -Recurse -Force node_modules
          }
          npm install --legacy-peer-deps
          Write-Host "[SUCCESS] Backend dependencies installed."

      - name: 🖌️ Install frontend dependencies & build
        shell: powershell
        run: |
          Write-Host "[INFO] Installing frontend dependencies..."
          cd $env:DEPLOY_PATH_FRONTEND
          if (Test-Path "package-lock.json") {
              Write-Host "[INFO] Cleaning previous node_modules..."
              Remove-Item -Recurse -Force node_modules
          }
          npm install --legacy-peer-deps
          Write-Host "[INFO] Building frontend..."
          npm run build:frontend
          Write-Host "[SUCCESS] Frontend build complete."

      - name: 🚀 Build server
        shell: powershell
        run: |
          Write-Host "[INFO] Building server..."
          cd $env:DEPLOY_PATH_SERVER
          npm run build:server
          Write-Host "[SUCCESS] Server build complete."

      - name: ✅ Deployment Complete
        shell: powershell
        run: |
          Write-Host "🎉 Deployment completed successfully!"
