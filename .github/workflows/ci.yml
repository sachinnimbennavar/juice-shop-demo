name: Re-run Backend Build Only

on:
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: windows-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Use same Node version
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      # Run backend build only (PowerShell safe)
      - name: Build backend
        shell: powershell
        run: |
          Write-Host "[INFO] Starting backend build..."
          try {
            npm run --silent build:server
            if ($LASTEXITCODE -eq 0) {
              Write-Host "[INFO] ✅ Backend build completed successfully."
            } else {
              Write-Host "[INFO] ⚠️ Backend build script returned non-zero exit code."
            }
          } catch {
            Write-Host "[INFO] ⚠️ No backend build step found — skipping."
          }
