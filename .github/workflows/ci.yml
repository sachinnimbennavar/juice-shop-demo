name: 🧪 Juice Shop SSDLC Pipeline

on:
  workflow_dispatch:

jobs:
  build-upload-deploy:
    runs-on: self-hosted
    timeout-minutes: 180
    env:
      NODE_OPTIONS: --max_old_space_size=4096
      ARTIFACT_DIR: C:\SSDLC\Artifacts
      NEXUS_UNZIP_DIR: C:\SSDLC\Nexus_Unzips
      ZAP_REPORT_DIR: C:\SSDLC\ZapScan_Reports
      ZAP_PATH: "C:\\Program Files\\OWASP\\Zed Attack Proxy\\zap.bat"

    steps:
    # 1️⃣ Checkout
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Set Node memory (redundant but kept per your request)
    - name: Set Node memory
      shell: powershell
      run: |
        setx NODE_OPTIONS "--max_old_space_size=4096"
        Write-Host "Increased Node memory limit to 4 GB."

    # 3️⃣ Install backend dependencies
    - name: Install backend dependencies
      shell: powershell
      run: |
        Write-Host "[INFO] Installing backend dependencies..."
        npm install

    # 4️⃣ Build frontend
    - name: Build Angular frontend
      shell: powershell
      run: |
        Write-Host "[INFO] Building Angular frontend..."
        cd frontend
        npm install
        npm run build -- --configuration production
        cd ..

    # 5️⃣ Compile TypeScript backend
    - name: Compile TypeScript backend
      shell: powershell
      run: |
        Write-Host "[INFO] Compiling backend (TypeScript to JS)..."
        npx tsc

    # 6️⃣ Prepare deployment artifact
    - name: Prepare artifact for Nexus upload
      shell: powershell
      run: |
        $artifactDir = $env:ARTIFACT_DIR
        if (Test-Path $artifactDir) { Remove-Item $artifactDir -Recurse -Force }
        New-Item -Path $artifactDir -ItemType Directory | Out-Null
        Write-Host "[INFO] Copying build output to artifact folder..."
        Copy-Item -Path "*" -Destination $artifactDir -Recurse -Force
        Remove-Item -Path "$artifactDir/frontend/node_modules" -Recurse -Force -ErrorAction SilentlyContinue
        Compress-Archive -Path "$artifactDir\*" -DestinationPath "$artifactDir\juice-shop-full.zip" -Force
        Write-Host "[INFO] Artifact prepared successfully."

    # 7️⃣ Upload artifact to Nexus
    - name: Upload artifact to Nexus
      shell: powershell
      env:
        NEXUS_URL: ${{ secrets.NEXUS_URL }}
        NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
        NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      run: |
        Write-Host "[INFO] Uploading artifact to Nexus..."
        $zipPath = "$env:ARTIFACT_DIR\\juice-shop-full.zip"
        $uploadUrl = "$env:NEXUS_URL/repository/ssdls-artifacts/juice-shop-full.zip"
        Invoke-RestMethod -Uri $uploadUrl -Method PUT -InFile $zipPath -Credential (New-Object PSCredential($env:NEXUS_USERNAME,(ConvertTo-SecureString $env:NEXUS_PASSWORD -AsPlainText -Force)))
        Write-Host "[INFO] Artifact uploaded successfully."

    # 8️⃣ Download & unzip artifact
    - name: Download & unzip artifact from Nexus
      shell: powershell
      env:
        NEXUS_URL: ${{ secrets.NEXUS_URL }}
        NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
        NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      run: |
        $unzipPath = $env:NEXUS_UNZIP_DIR
        if (Test-Path $unzipPath) { Remove-Item $unzipPath -Recurse -Force }
        New-Item -ItemType Directory -Force -Path $unzipPath | Out-Null
        $zipPath = "$unzipPath\\juice-shop-full.zip"
        $downloadUrl = "$env:NEXUS_URL/repository/ssdls-artifacts/juice-shop-full.zip"
        Write-Host "[INFO] Downloading artifact from Nexus..."
        Invoke-WebRequest -Uri $downloadUrl -OutFile $zipPath -UseBasicParsing -Credential (New-Object PSCredential($env:NEXUS_USERNAME,(ConvertTo-SecureString $env:NEXUS_PASSWORD -AsPlainText -Force)))
        Expand-Archive -Path $zipPath -DestinationPath $unzipPath -Force
        Write-Host "[INFO] Artifact unzipped at $unzipPath."

    # 9️⃣ Install dependencies after unzip
    - name: Install dependencies (post-unzip)
      shell: powershell
      run: |
        cd $env:NEXUS_UNZIP_DIR
        npm install --production
        Write-Host "[INFO] Dependencies installed after unzip."

    # 🔟 Start Node server
    - name: Start Juice Shop server
      shell: powershell
      run: |
        Write-Host "[INFO] Starting Juice Shop server..."
        Start-Process powershell -ArgumentList "cd $env:NEXUS_UNZIP_DIR; npm start" -NoNewWindow
        Start-Sleep -Seconds 20
        Write-Host "[INFO] Juice Shop should now be running at http://localhost:3000"

    # 1️⃣1️⃣ Run OWASP ZAP scan
    - name: Run OWASP ZAP scan
      shell: powershell
      run: |
        $zapReportPath = "$env:ZAP_REPORT_DIR"
        if (Test-Path $zapReportPath) { Remove-Item $zapReportPath -Recurse -Force }
        New-Item -Path $zapReportPath -ItemType Directory | Out-Null
        Write-Host "[INFO] Starting OWASP ZAP scan on http://localhost:3000"
        & "$env:ZAP_PATH" -cmd -quickurl http://localhost:3000 -quickout "$zapReportPath\ZAP-Report.html" -quickprogress
        Write-Host "[INFO] ZAP scan complete. Report available at $zapReportPath"

