name: Juice Shop IIS Full Deployment

# Make the workflow manually triggerable
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted  # Windows machine with IIS + ARR + iisnode

    steps:
      # 1️⃣ Initial step to ensure workflow dispatch works
      - name: Print test message
        run: echo "✅ Workflow dispatch triggered successfully on $(hostname)"

      # 2️⃣ IIS Deployment
      - name: IIS Deployment
        shell: powershell
        env:
          SITE_NAME: JuiceShopDemo
          DEPLOY_PATH: C:\SSDLC\Nexus_Unzips
          IIS_PATH: C:\inetpub\wwwroot\JuiceShopDemo
        run: |
          Write-Host "=== Juice Shop IIS Deployment Started ==="
          Import-Module WebAdministration

          # Stop and remove existing site if exists
          $site = Get-Website -Name $env:SITE_NAME -ErrorAction SilentlyContinue
          if ($null -ne $site) {
              Write-Host "[INFO] Stopping existing IIS site $($env:SITE_NAME)..."
              Stop-Website -Name $env:SITE_NAME
          }

          # Clear IIS folder or create if missing
          if (Test-Path $env:IIS_PATH) {
              Write-Host "[INFO] Clearing existing files from $($env:IIS_PATH)..."
              Get-ChildItem $env:IIS_PATH -Recurse -Force | Remove-Item -Force -Recurse
          } else {
              Write-Host "[INFO] Creating IIS directory $($env:IIS_PATH)..."
              New-Item -ItemType Directory -Path $env:IIS_PATH -Force | Out-Null
          }

          # Copy files from unzipped deployment folder
          Write-Host "[INFO] Copying files from $($env:DEPLOY_PATH) to $($env:IIS_PATH)..."
          Copy-Item -Path (Join-Path $env:DEPLOY_PATH '*') -Destination $env:IIS_PATH -Recurse -Force
          Write-Host "✅ Files copied successfully."

          # Create or start IIS site
          $site = Get-Website -Name $env:SITE_NAME -ErrorAction SilentlyContinue
          if ($null -ne $site) {
              Write-Host "[INFO] Starting IIS site $($env:SITE_NAME)..."
              Start-Website -Name $env:SITE_NAME
          } else {
              Write-Host "[INFO] Creating new IIS site $($env:SITE_NAME) on port 8080..."
              New-Website -Name $env:SITE_NAME -Port 8080 -PhysicalPath $env:IIS_PATH -Force | Out-Null
          }

          Write-Host "=== Deployment Completed Successfully ==="
