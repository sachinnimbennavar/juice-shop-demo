name: Juice Shop Deployment

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  deploy:
    runs-on: self-hosted

    env:
      NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
      DEPLOY_PATH: C:\SSDLC\Nexus_Unzips  # Where to unzip the latest full repo

    steps:
      - name: 🧩 Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: ⚙️ Setup PowerShell environment
        shell: powershell
        run: |
          Write-Host "[INFO] Deployment job started..."
          Write-Host "Working directory: $PWD"

      - name: 🚀 Download & unzip latest Nexus full-repo ZIP
        shell: powershell
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          # Prepare Basic Auth
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          # Get latest version by listing the directory on Nexus
          $metadataUrl = "${env:NEXUS_URL}/com/example/juiceshop/full-repo/"
          Write-Host "[INFO] Fetching latest version from $metadataUrl ..."

          try {
              # Get list of versions (directories)
              $response = Invoke-WebRequest -Uri $metadataUrl -Headers $headers
              $links = ($response.ParsedHtml.getElementsByTagName("a") | ForEach-Object { $_.innerText }) -match '\d{14}' 
              if ($links.Count -eq 0) { throw "No versions found!" }
              $latestVersion = ($links | Sort-Object | Select-Object -Last 1)
              Write-Host "[INFO] Latest full-repo version: $latestVersion"
          } catch {
              Write-Host "[ERROR] Failed to fetch latest version: $_"
              exit 1
          }

          # Download latest ZIP
          $zipFileName = "full-repo-$latestVersion.zip"
          $zipUrl = "${env:NEXUS_URL}/com/example/juiceshop/full-repo/$latestVersion/$zipFileName"
          $zipFilePath = Join-Path $PWD $zipFileName
          Write-Host "[INFO] Downloading $zipUrl ..."
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipFilePath -Headers $headers

          if (-Not (Test-Path $zipFilePath)) { 
              Write-Host "[ERROR] ZIP file not downloaded!"
              exit 1
          }

          # Ensure deploy path exists
          if (-Not (Test-Path "${env:DEPLOY_PATH}")) { New-Item -ItemType Directory -Path "${env:DEPLOY_PATH}" }

          # Unzip to deploy path
          Write-Host "[INFO] Extracting $zipFileName to ${env:DEPLOY_PATH} ..."
          Expand-Archive -Path $zipFilePath -DestinationPath "${env:DEPLOY_PATH}" -Force
          Write-Host "[SUCCESS] Deployment completed successfully!"
