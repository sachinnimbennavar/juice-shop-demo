name: Open OWASP ZAP and Scan Juice Shop

on:
  workflow_dispatch:

jobs:
  zap-scan:
    runs-on: self-hosted

    steps:
      # 1️⃣ Launch OWASP ZAP GUI from Desktop Shortcut
      - name: Launch OWASP ZAP via Desktop Shortcut
        shell: powershell
        run: |
          $zapProcess = Get-Process -Name "ZAP" -ErrorAction SilentlyContinue
          if (-not $zapProcess) {
              Write-Host "ZAP is not running. Launching via desktop shortcut..."
              Start-Process "C:\Users\Public\Desktop\ZAP 2.16.1.lnk"
              Write-Host "Waiting 2 minutes for ZAP to initialize..."
              Start-Sleep -Seconds 120
              Write-Host "ZAP GUI should now be open on port 8082."
          } else {
              Write-Host "ZAP is already running. Skipping launch."
          }

      # 2️⃣ Trigger Active Scan against Juice Shop
      - name: Run ZAP Active Scan on Juice Shop
        shell: powershell
        run: |
          Write-Host "Starting ZAP active scan on http://localhost:3000..."
          $zapPath = "C:\SSDLC\ZAP_2.16.1"
          $target = "http://localhost:3000"
          $reportPath = "C:\SSDLC\zap_juice_shop_report.html"

          & "$zapPath\zap-cli.exe" --zap-url http://127.0.0.1 --port 8082 status --timeout 300
          & "$zapPath\zap-cli.exe" session new
          & "$zapPath\zap-cli.exe" open-url $target
          & "$zapPath\zap-cli.exe" spider $target
          Write-Host "Crawling complete. Starting active scan..."
          & "$zapPath\zap-cli.exe" active-scan $target
          Write-Host "Scan complete. Generating HTML report..."
          & "$zapPath\zap-cli.exe" report -o $reportPath -f html
          Write-Host "Scan completed. Report saved at $reportPath."
