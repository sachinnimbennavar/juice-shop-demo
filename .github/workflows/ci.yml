name: Juice Shop Artifact Upload and Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    env:
      NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
      DEPLOY_DIR: C:\SSDLC\Nexus_Unzips
      IIS_SITE: "JuiceShop"               # 🔹 Update this to your actual IIS site name
      IIS_APPPOOL: "JuiceShopAppPool"     # 🔹 Update this to your actual App Pool name

    steps:
      # 1️⃣ Prepare artifact for Nexus upload
      - name: Prepare artifact for Nexus upload
        shell: powershell
        run: |
          Write-Host "[INFO] Preparing artifact for Nexus upload..."
          $version = (Get-Date -Format "yyyyMMddHHmmss")
          $artifactDir = "build_output"
          $serverZip = "full-repo-$version.zip"

          # Clean old build_output
          if (Test-Path $artifactDir) { Remove-Item $artifactDir -Recurse -Force }
          New-Item -Path $artifactDir -ItemType Directory | Out-Null

          # Copy frontend and backend artifacts (no node_modules)
          if (Test-Path "frontend/dist") {
              Copy-Item -Path "frontend/dist" -Destination "$artifactDir/frontend" -Recurse -Force
          } else {
              Write-Host "[WARN] frontend/dist not found!"
          }

          if (Test-Path "server.js") {
              Copy-Item -Path "server.js" -Destination $artifactDir -Force
          } else {
              Write-Host "[WARN] server.js not found!"
          }

          if (Test-Path "package.json") {
              Copy-Item -Path "package.json" -Destination $artifactDir -Force
          } else {
              Write-Host "[WARN] package.json not found!"
          }

          Compress-Archive -Path "$artifactDir/*" -DestinationPath $serverZip -Force
          Write-Host "[INFO] Artifact packaged: $serverZip"

          echo "version=$version" >> $env:GITHUB_ENV

      # 2️⃣ Upload artifact to Nexus
      - name: Upload artifact to Nexus
        shell: powershell
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          $version = $env:version
          $serverZip = "full-repo-$version.zip"
          $serverUrl = "${env:NEXUS_URL}/com/example/juiceshop/full-repo/$version/$serverZip"

          Write-Host "[INFO] Uploading $serverZip to Nexus → $serverUrl"
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          if (-not (Test-Path $serverZip)) {
              throw "❌ Artifact file $serverZip not found!"
          }

          Invoke-RestMethod -Uri $serverUrl -Method Put -InFile $serverZip -Headers $headers -ContentType "application/zip" -ErrorAction Stop
          Write-Host "✅ Artifact uploaded successfully."

      # 3️⃣ Download & deploy latest artifact from Nexus to IIS
      - name: Download and Deploy Artifact to IIS
        shell: powershell
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          Import-Module WebAdministration
          Write-Host "[INFO] Starting deployment..."

          # 1️⃣ Clear deployment folder
          if (Test-Path $env:DEPLOY_DIR) {
              Write-Host "[INFO] Clearing old files from $env:DEPLOY_DIR..."
              Remove-Item -Path "$env:DEPLOY_DIR\*" -Recurse -Force -ErrorAction SilentlyContinue
          } else {
              Write-Host "[INFO] Creating deployment directory: $env:DEPLOY_DIR"
              New-Item -Path $env:DEPLOY_DIR -ItemType Directory | Out-Null
          }

          # 2️⃣ Find latest version
          $base64Auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }
          $searchUrl = "${env:NEXUS_URL}/service/rest/v1/search?repository=JuiceShopMavenDemo&group=com.example.juiceshop&name=full-repo"
          Write-Host "[INFO] Searching latest artifact → $searchUrl"
          $response = Invoke-RestMethod -Uri $searchUrl -Headers $headers -Method Get

          if ($null -eq $response.items -or $response.items.Count -eq 0) {
              throw "❌ No full-repo versions found in Nexus!"
          }

          $latest = $response.items | Sort-Object { $_.version } -Descending | Select-Object -First 1
          $latestVersion = $latest.version
          $zipDownloadUrl = $latest.assets[0].downloadUrl
          Write-Host "[INFO] Latest version: $latestVersion"
          Write-Host "[INFO] Download URL: $zipDownloadUrl"

          $zipFilePath = Join-Path $env:DEPLOY_DIR "full-repo-$latestVersion.zip"
          Write-Host "[INFO] Downloading artifact to $zipFilePath..."
          Invoke-WebRequest -Uri $zipDownloadUrl -OutFile $zipFilePath -Headers $headers

          # 3️⃣ Extract artifact
          Write-Host "[INFO] Extracting artifact..."
          Expand-Archive -Path $zipFilePath -DestinationPath $env:DEPLOY_DIR -Force

          # 4️⃣ Configure IIS
          $sitePath = "IIS:\Sites\$env:IIS_SITE"
          if (Test-Path $sitePath) {
              Write-Host "[INFO] Assigning App Pool '$env:IIS_APPPOOL' to site '$env:IIS_SITE'..."
              Set-ItemProperty $sitePath -Name applicationPool -Value $env:IIS_APPPOOL
              Write-Host "[INFO] Restarting IIS site..."
              Stop-WebSite $env:IIS_SITE -ErrorAction SilentlyContinue
              Start-WebSite $env:IIS_SITE
              Write-Host "✅ Deployment completed successfully!"
          } else {
              Write-Host "⚠️ IIS site '$env:IIS_SITE' not found. Please verify site name in IIS Manager."
              Write-Host "💡 To check: Get-ChildItem IIS:\Sites"
          }
