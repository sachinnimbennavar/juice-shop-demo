name: Juice Shop Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy latest frontend & server build
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
          FRONTEND_PATH: C:\inetpub\wwwroot\juice-shop
          SERVER_PATH: C:\JuiceShopServer
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          Write-Host "[INFO] Starting deployment..."

          # Build Basic Auth header
          $base64Auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          function Get-LatestZip {
              param ($artifactPath)
              $url = "$env:NEXUS_URL/com/example/juiceshop/${artifactPath}/"
              Write-Host "[INFO] Fetching available files from $url ..."

              try {
                  $html = Invoke-WebRequest -Uri $url -Headers $headers -UseBasicParsing
              } catch {
                  $errMsg = $_.Exception.Message
                  Write-Host "[ERROR] Failed to fetch ${artifactPath}: ${errMsg}"
                  exit 1
              }

              # Find all ZIP files matching artifact
              $zipFiles = ($html.Links | ForEach-Object { $_.href } | Where-Object { $_ -match "^${artifactPath}-\d{14}\.zip$" })
              if (-not $zipFiles) {
                  Write-Host "[ERROR] No ZIP files found for ${artifactPath}!"
                  exit 1
              }

              # Pick latest based on timestamp in filename
              $latestZip = ($zipFiles | Sort-Object)[-1]
              Write-Host "[INFO] Latest ${artifactPath} ZIP detected: ${latestZip}"
              return $latestZip
          }

          function Deploy-Zip {
              param ($artifactPath, $deployPath)
              $latestZip = Get-LatestZip -artifactPath $artifactPath
              $zipUrl = "$env:NEXUS_URL/com/example/juiceshop/${artifactPath}/${latestZip}"
              $tempZip = "$env:TEMP/${artifactPath}.zip"

              Write-Host "[INFO] Downloading ${artifactPath} from ${zipUrl} ..."
              try {
                  Invoke-WebRequest -Uri $zipUrl -OutFile $tempZip -Headers $headers
              } catch {
                  $errMsg = $_.Exception.Message
                  Write-Host "[ERROR] Failed to download ${artifactPath}: ${errMsg}"
                  exit 1
              }

              Write-Host "[INFO] Extracting ${artifactPath} to ${deployPath} ..."
              if (Test-Path $deployPath) { Remove-Item -Recurse -Force $deployPath }
              Expand-Archive -Path $tempZip -DestinationPath $deployPath

              Remove-Item $tempZip
              Write-Host "[SUCCESS] ${artifactPath} deployed successfully."
          }

          # Deploy frontend
          Deploy-Zip -artifactPath "frontend-build" -deployPath $env:FRONTEND_PATH

          # Deploy server
          Deploy-Zip -artifactPath "server-build" -deployPath $env:SERVER_PATH

          Write-Host "`n✅ Deployment completed successfully!"
