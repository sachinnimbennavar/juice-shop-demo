name: Juice Shop CI - Upload to Maven Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: self-hosted

    env:
      NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      BUILD_VERSION: ${{ github.run_id }}  # unique version per CI run

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Increase Node memory (8 GB) to prevent Angular out-of-memory
      - name: Configure Node memory
        run: set NODE_OPTIONS=--max_old_space_size=8192

      # 3️⃣ Cache frontend dependencies
      - name: Cache frontend dependencies
        uses: actions/cache@v3
        with:
          path: |
            frontend/node_modules
            frontend/dist
            frontend/.angular
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      # 4️⃣ Cache server dependencies
      - name: Cache server dependencies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-server-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-server-

      # 5️⃣ Install frontend dependencies
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps --prefer-offline --no-audit
          cd ..

      # 6️⃣ Build frontend
      - name: Build frontend
        run: |
          cd frontend
          npm run build -- --configuration production --watch=false --verbose
          cd ..

      # 7️⃣ Install server dependencies
      - name: Install server dependencies
        run: npm install --prefer-offline --no-audit

      # 8️⃣ Build server
      - name: Build server
        run: npm run build:server

      # 9️⃣ Package frontend & server into ZIPs
      - name: Package build artifacts
        run: |
          Compress-Archive -Path frontend/dist/* -DestinationPath frontend-build-$BUILD_VERSION.zip -Force
          $serverPaths = @(
              "app.ts","server.ts","package.json","tsconfig.json",
              "models","routes","lib","data","views","rsn","config","build"
          ) | Where-Object { Test-Path $_ }
          if ($serverPaths.Count -gt 0) {
              Compress-Archive -Path $serverPaths -DestinationPath "server-build-$BUILD_VERSION.zip" -Force
          }

      # 🔟 Upload frontend to Maven
      - name: Upload frontend build to Nexus
        run: |
          mvn deploy:deploy-file `
            -DgroupId=com.example.juiceshop `
            -DartifactId=frontend-build `
            -Dversion=$BUILD_VERSION `
            -Dpackaging=zip `
            -Dfile=frontend-build-$BUILD_VERSION.zip `
            -DrepositoryId=nexus `
            -Durl=$NEXUS_URL
        shell: bash

      # 1️⃣1️⃣ Upload server to Maven
      - name: Upload server build to Nexus
        run: |
          mvn deploy:deploy-file `
            -DgroupId=com.example.juiceshop `
            -DartifactId=server-build `
            -Dversion=$BUILD_VERSION `
            -Dpackaging=zip `
            -Dfile=server-build-$BUILD_VERSION.zip `
            -DrepositoryId=nexus `
            -Durl=$NEXUS_URL
        shell: bash

      # 1️⃣2️⃣ Deploy latest builds from Nexus
      - name: Deploy latest builds
        shell: powershell
        run: |
          Write-Host "[INFO] Starting deployment..."
          $base64Auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          function Get-LatestVersion {
              param ($artifactId)
              $metadataUrl = "$env:NEXUS_URL/com/example/juiceshop/${artifactId}/maven-metadata.xml"
              $metadata = Invoke-RestMethod -Uri $metadataUrl -Headers $headers
              return $metadata.metadata.versioning.latest
          }

          function Deploy-Zip {
              param ($artifactId, $deployPath)
              $latestVersion = Get-LatestVersion -artifactId $artifactId
              $zipUrl = "$env:NEXUS_URL/com/example/juiceshop/${artifactId}/${latestVersion}/${artifactId}-${latestVersion}.zip"
              $tempZip = "$env:TEMP/${artifactId}.zip"

              Write-Host "[INFO] Downloading $artifactId version $latestVersion ..."
              Invoke-WebRequest -Uri $zipUrl -OutFile $tempZip -Headers $headers

              if (Test-Path $deployPath) { Remove-Item -Recurse -Force $deployPath }
              Expand-Archive -Path $tempZip -DestinationPath $deployPath
              Remove-Item $tempZip

              Write-Host "[SUCCESS] $artifactId deployed successfully to $deployPath"
          }

          Deploy-Zip -artifactId "frontend-build" -deployPath "C:\inetpub\wwwroot\juice-shop"
          Deploy-Zip -artifactId "server-build" -deployPath "C:\JuiceShopServer"

          Write-Host "`n✅ Deployment completed successfully!"
