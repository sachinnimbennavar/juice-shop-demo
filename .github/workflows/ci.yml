name: Juice Shop CI - Deploy Latest Builds

on:
  workflow_dispatch:

jobs:
  deploy-latest:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repository (needed only for scripts/config)
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Deploy frontend and server from Nexus
      - name: Deploy latest builds from Nexus
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          FRONTEND_PATH: C:\inetpub\wwwroot\juice-shop
          SERVER_PATH: C:\JuiceShopServer
        run: |
          Write-Host "[INFO] Starting deployment..."

          # -------------------------------
          # Set up authentication header
          # -------------------------------
          $base64Auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          # -------------------------------
          # Helper: Get latest version from Nexus
          # -------------------------------
          function Get-LatestVersion($artifactId) {
              $artifactFolderUrl = "${env:NEXUS_URL}/com/example/juiceshop/$artifactId/"
              Write-Host "[INFO] Fetching available files from $artifactFolderUrl ..."
              
              try {
                  $response = Invoke-RestMethod -Uri $artifactFolderUrl -Headers $headers -UseBasicParsing
                  $versions = ($response.items | ForEach-Object { $_.text })  # JSON API response
                  if ($versions.Count -eq 0) { throw "No versions found" }

                  # Sort numerically
                  $latestVersion = ($versions | ForEach-Object { [Version]$_ } | Sort-Object -Descending | Select-Object -First 1).ToString()
                  return $latestVersion
              } catch {
                  Write-Warning "[WARN] Cannot fetch files for $artifactId. Falling back to local detection."
                  return $null
              }
          }

          # -------------------------------
          # Helper: Deploy artifact
          # -------------------------------
          function Deploy-Artifact($artifactId, $deployPath, $filePrefix) {
              $version = Get-LatestVersion $artifactId
              if ($version) {
                  $zipUrl = "${env:NEXUS_URL}/com/example/juiceshop/$artifactId/$version/$filePrefix-$version.zip"
                  Write-Host "[INFO] Downloading $artifactId ZIP from $zipUrl ..."

                  $outFile = "$filePrefix.zip"
                  $maxRetries = 3
                  for ($i=1; $i -le $maxRetries; $i++) {
                      try {
                          Invoke-WebRequest -Uri $zipUrl -OutFile $outFile -Headers $headers -UseBasicParsing
                          break
                      } catch {
                          Write-Warning "[WARN] Download attempt $i failed: $_"
                          if ($i -eq $maxRetries) { throw "Failed to download $artifactId after $maxRetries attempts" }
                          Start-Sleep -Seconds 5
                      }
                  }

                  Write-Host "[INFO] Extracting $artifactId to $deployPath ..."
                  Remove-Item -Recurse -Force "$deployPath\*" -ErrorAction SilentlyContinue
                  Expand-Archive -Path $outFile -DestinationPath $deployPath -Force
                  Write-Host "[SUCCESS] $artifactId deployed successfully. Version: $version"
              }
          }

          # -------------------------------
          # Deploy Frontend & Server
          # -------------------------------
          Deploy-Artifact "frontend-build" ${env:FRONTEND_PATH} "frontend-build"
          Deploy-Artifact "server-build" ${env:SERVER_PATH} "server-build"

          Write-Host "✅ Deployment completed successfully!"
