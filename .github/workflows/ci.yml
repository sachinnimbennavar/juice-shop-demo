name: Juice Shop Full Repo Upload (Optimized)

on:
  workflow_dispatch:

jobs:
  full-repo-upload:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js v22.19.0
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.19.0

      # 3️⃣ Install backend dependencies (skip optional warnings)
      - name: Install backend dependencies
        shell: powershell
        run: |
          Write-Host "[INFO] Installing backend dependencies..."
          npm install --legacy-peer-deps

      # 4️⃣ Build frontend and backend
      - name: Build frontend
        shell: powershell
        run: |
          Write-Host "[INFO] Building frontend..."
          cd frontend
          npm install --legacy-peer-deps
          npm run build
          cd ..

      - name: Build backend
        shell: powershell
        run: |
          Write-Host "[INFO] Building backend..."
          if (Test-Path "server.ts") {
              npx tsc || Write-Host "[INFO] Backend build skipped or already compiled."
          } else {
              Write-Host "[INFO] No backend build step found — skipping."
          }

      # 5️⃣ Create full repo ZIP using 7-Zip
      - name: Create full repo ZIP
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          $version = (Get-Date -Format "yyyyMMddHHmmss")
          $serverZip = "full-repo-$version.zip"
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          $itemsInOrder = @(
            ".dependabot",".github",".gitlab",".well-known",".zap","build","config","data","encryptionkeys",
            "frontend","ftp","i18n","lib","logs","models","monitoring","node_modules","routes","rsn",
            "screenshots","test","uploads","vagrant","views",
            ".codeclimate.yml",".devcontainer.json",".dockerignore",".eslintrc.js",".gitignore",
            ".gitlab-ci.yml",".gitpod.yml",".mailmap",".npmrc",
            "app.json","app.ts","CODE_OF_CONDUCT.md","config.schema.yml","CONTRIBUTING.md","crowdin.yaml",
            "ctf.key","cypress.config.ts","docker-compose.test.yml","Dockerfile","Gruntfile.js",
            "HALL_OF_FAME.md","LICENSE","package.json","README.md","REFERENCES.md","SECURITY.md",
            "server.ts","SOLUTIONS.md","swagger.yml","threat-model.json","tsconfig.json"
          )

          # Only include existing items
          $items = $itemsInOrder | Where-Object { Test-Path $_ } | ForEach-Object { "`"$_`"" }
          $itemsString = $items -join " "

          Write-Host "[INFO] Creating ZIP with 7-Zip..."
          & "C:\Program Files\7-Zip\7z.exe" a -tzip $serverZip $itemsString
          Write-Host "[INFO] Full repo ZIP created: $serverZip"

          # 6️⃣ Upload ZIP to Nexus
          $serverUrl = "${env:NEXUS_URL}/com/example/juiceshop/full-repo/$version/$serverZip"
          Write-Host "[INFO] Uploading to Nexus → $serverUrl"
          Invoke-RestMethod -Uri $serverUrl -Method Put -InFile $serverZip -Headers $headers -ContentType "application/zip"
          Write-Host "[INFO] Full repo uploaded successfully."
