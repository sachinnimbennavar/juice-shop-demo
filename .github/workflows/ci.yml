name: Juice Shop Maven Upload

on:
  workflow_dispatch:

jobs:
  upload-only:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repository (needed to access build artifacts)
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Upload existing build artifacts to Maven repo
      - name: Package and Upload to Maven Repo
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          $version = (Get-Date -Format "yyyyMMddHHmmss")
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          # --------------------------
          # Upload frontend build
          # --------------------------
          $frontendSource = "frontend/dist"
          if (Test-Path $frontendSource) {
              $frontendZip = "frontend-build-$version.zip"
              Compress-Archive -Path "$frontendSource/*" -DestinationPath $frontendZip -Force
              $frontendUrl = "${env:NEXUS_URL}/com/example/juiceshop/frontend-build/$version/$frontendZip"
              Write-Host "Uploading frontend ZIP → $frontendUrl"
              Invoke-RestMethod -Uri $frontendUrl -Method Put -InFile $frontendZip -Headers $headers -ContentType "application/zip"
              Write-Host "✅ Frontend uploaded successfully."
          } else {
              Write-Host "⚠️ frontend/dist not found, skipping frontend upload."
          }

          # --------------------------
          # Upload server build
          # --------------------------
          $serverPaths = @(
              "app.ts","server.ts","package.json","tsconfig.json",
              "models","routes","lib","data","views","rsn","config","build"
          ) | Where-Object { Test-Path $_ }

          if ($serverPaths.Count -gt 0) {
              $serverZip = "server-build-$version.zip"
              Compress-Archive -Path $serverPaths -DestinationPath $serverZip -Force
              $serverUrl = "${env:NEXUS_URL}/com/example/juiceshop/server-build/$version/$serverZip"
              Write-Host "Uploading server ZIP → $serverUrl"
              Invoke-RestMethod -Uri $serverUrl -Method Put -InFile $serverZip -Headers $headers -ContentType "application/zip"
              Write-Host "✅ Server uploaded successfully."
          } else {
              Write-Host "⚠️ No server files found, skipping server upload."
          }

          Write-Host "✅ All available builds uploaded successfully!"
