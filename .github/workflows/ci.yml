name: Juice Shop CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-upload:
    name: Build & Upload Artifacts
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Node memory
      - name: Configure Node memory
        run: set NODE_OPTIONS=--max_old_space_size=4096

      # 3️⃣ Cache frontend dependencies
      - name: Cache frontend dependencies
        uses: actions/cache@v3
        with:
          path: |
            frontend/node_modules
            frontend/dist
            frontend/.angular
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      # 4️⃣ Cache server dependencies
      - name: Cache server dependencies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-server-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-server-

      # 5️⃣ Install frontend dependencies
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps --prefer-offline --no-audit
          cd ..

      # 6️⃣ Build frontend
      - name: Build frontend
        run: |
          cd frontend
          npm run build -- --configuration production --watch=false --verbose
          cd ..

      # 7️⃣ Install server dependencies
      - name: Install server dependencies
        run: npm install --prefer-offline --no-audit

      # 8️⃣ Build server
      - name: Build server
        run: npm run build:server

      # 9️⃣ Upload ZIPs to Nexus repo
      - name: Upload build ZIPs to Nexus Maven repo
        shell: powershell
        env:
          NEXUS_URL: http://10.158.124.198:8081/repository/JuiceShopMavenDemo
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          Write-Host "🟢 Packaging and uploading build artifacts to Maven repo..."
          $timestamp = (Get-Date -Format "yyyyMMddHHmmss")

          # Prepare Basic Auth
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          # ===== FRONTEND =====
          if (Test-Path "frontend/dist") {
              Write-Host "[INFO] Packaging frontend build..."
              Compress-Archive -Path "frontend/dist/*" -DestinationPath "frontend-build-$timestamp.zip" -Force

              $frontendUrl = "${env:NEXUS_URL}/com/example/juiceshop/frontend-build/$timestamp/frontend-build-$timestamp.zip"
              Write-Host "[INFO] Uploading frontend ZIP → $frontendUrl"
              Invoke-RestMethod -Uri $frontendUrl -Method Put -InFile "frontend-build-$timestamp.zip" -Headers $headers
              Write-Host "[SUCCESS] Frontend uploaded successfully."
          } else {
              Write-Host "[WARN] frontend/dist not found, skipping frontend upload."
          }

          # ===== SERVER =====
          $serverPaths = @(
              "app.ts","server.ts","package.json","tsconfig.json",
              "models","routes","lib","data","views","rsn","config","build"
          ) | Where-Object { Test-Path $_ }

          if ($serverPaths.Count -gt 0) {
              Write-Host "[INFO] Packaging server build..."
              Compress-Archive -Path $serverPaths -DestinationPath "server-build-$timestamp.zip" -Force

              $serverUrl = "${env:NEXUS_URL}/com/example/juiceshop/server-build/$timestamp/server-build-$timestamp.zip"
              Write-Host "[INFO] Uploading server ZIP → $serverUrl"
              Invoke-RestMethod -Uri $serverUrl -Method Put -InFile "server-build-$timestamp.zip" -Headers $headers
              Write-Host "[SUCCESS] Server uploaded successfully."
          } else {
              Write-Host "[WARN] No server files found, skipping server upload."
          }

          Write-Host "✅ All available builds uploaded to Maven repo successfully!"

  deploy:
    name: Deploy to Server
    runs-on: self-hosted
    needs: build-and-upload  # ⬅ ensures deploy runs only after build completes

    env:
      NEXUS_URL: http://10.158.124.198:8081
      DEPLOY_PATH: C:\JuiceShopServer

    steps:
      - name: 🧩 Checkout code
        uses: actions/checkout@v3

      - name: 🚀 Deploy latest frontend and server from Nexus
        shell: pwsh
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          Write-Host "[INFO] Starting deployment..."
          # Prepare Basic Auth
          $pair = "${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes($pair))
          $headers = @{ Authorization = "Basic $base64Auth" }

          # ===== FRONTEND =====
          Write-Host "[INFO] Fetching latest frontend build from Nexus..."
          $frontendApi = "$env:NEXUS_URL/service/rest/v1/search?repository=JuiceShopMavenDemo&group=com.example.juiceshop&name=frontend-build"
          $frontendResp = Invoke-RestMethod -Uri $frontendApi -Headers $headers
          if (-not $frontendResp.items) { throw "No frontend builds found in Nexus!" }
          $latestFrontend = ($frontendResp.items.version | Sort-Object -Descending | Select-Object -First 1)
          Write-Host "[INFO] Latest frontend version: $latestFrontend"
          $frontendUrl = "$env:NEXUS_URL/repository/JuiceShopMavenDemo/com/example/juiceshop/frontend-build/$latestFrontend/frontend-build-$latestFrontend.zip"
          Invoke-WebRequest -Uri $frontendUrl -OutFile "frontend.zip" -Headers $headers
          Expand-Archive -Path "frontend.zip" -DestinationPath "$env:DEPLOY_PATH\frontend" -Force
          Write-Host "[SUCCESS] Frontend extracted to $env:DEPLOY_PATH\frontend"

          # ===== SERVER =====
          Write-Host "[INFO] Fetching latest server build from Nexus..."
          $serverApi = "$env:NEXUS_URL/service/rest/v1/search?repository=JuiceShopMavenDemo&group=com.example.juiceshop&name=server-build"
          $serverResp = Invoke-RestMethod -Uri $serverApi -Headers $headers
          if (-not $serverResp.items) { throw "No server builds found in Nexus!" }
          $latestServer = ($serverResp.items.version | Sort-Object -Descending | Select-Object -First 1)
          Write-Host "[INFO] Latest server version: $latestServer"
          $serverUrl = "$env:NEXUS_URL/repository/JuiceShopMavenDemo/com/example/juiceshop/server-build/$latestServer/server-build-$latestServer.zip"
          Invoke-WebRequest -Uri $serverUrl -OutFile "server.zip" -Headers $headers
          Expand-Archive -Path "server.zip" -DestinationPath "$env:DEPLOY_PATH\server" -Force
          Write-Host "[SUCCESS] Server extracted to $env:DEPLOY_PATH\server"

          # ===== VERIFICATION =====
          Write-Host "[VERIFY] Checking extracted files..."
          $frontendCount = (Get-ChildItem "$env:DEPLOY_PATH\frontend" -Recurse | Measure-Object).Count
          $serverCount = (Get-ChildItem "$env:DEPLOY_PATH\server" -Recurse | Measure-Object).Count
          Write-Host "[INFO] Frontend files extracted: $frontendCount"
          Write-Host "[INFO] Server files extracted: $serverCount"

          if ($frontendCount -lt 10 -or $serverCount -lt 10) {
              throw "[ERROR] Extraction seems incomplete. Check Nexus packages."
          }

          Write-Host "✅ Deployment completed successfully!"
