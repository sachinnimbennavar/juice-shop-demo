name: Juice Shop IIS Full Deployment

# Manual trigger
on:
  workflow_dispatch:

jobs:
  deploy-iis:
    runs-on: self-hosted  # Windows machine with IIS + ARR + iisnode

    steps:
      # 1️⃣ Set environment variables
      - name: Set Paths and URLs
        shell: powershell
        run: |
          $env:FRONTEND_SOURCE = "C:\SSDLC\Nexus_Unzips\frontend\dist\frontend"
          $env:FRONTEND_IIS_PATH = "C:\inetpub\wwwroot\JuiceShopFrontend"
          $env:BACKEND_SOURCE = "C:\SSDLC\Nexus_Unzips\server"
          $env:BACKEND_IIS_PATH = "C:\inetpub\wwwroot\JuiceShopBackend"
          $env:BACKEND_URL = "http://localhost/JuiceShopBackend"

      # 2️⃣ Deploy frontend to IIS
      - name: Deploy Frontend
        shell: powershell
        run: |
          Write-Host "[INFO] Deploying frontend..."
          if (-Not (Test-Path $env:FRONTEND_IIS_PATH)) { New-Item -ItemType Directory -Path $env:FRONTEND_IIS_PATH | Out-Null }
          Remove-Item -Path "$env:FRONTEND_IIS_PATH\*" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$env:FRONTEND_SOURCE\*" -Destination $env:FRONTEND_IIS_PATH -Recurse

          # Update API URL in frontend environment file
          $envFile = Join-Path $env:FRONTEND_IIS_PATH "assets\environment.prod.js"
          if (Test-Path $envFile) {
              (Get-Content $envFile) -replace 'apiUrl\s*:\s*["\'].*["\']', "apiUrl: '$env:BACKEND_URL'" | Set-Content $envFile
              Write-Host "[INFO] Frontend API URL updated."
          }

          # Create Angular web.config for HTML5 routing
          $webConfigPath = Join-Path $env:FRONTEND_IIS_PATH "web.config"
          @"
<configuration>
  <system.webServer>
    <rewrite>
      <rules>
        <rule name='Angular Routes' stopProcessing='true'>
          <match url='.*' />
          <conditions logicalGrouping='MatchAll'>
            <add input='{REQUEST_FILENAME}' matchType='IsFile' negate='true' />
            <add input='{REQUEST_FILENAME}' matchType='IsDirectory' negate='true' />
          </conditions>
          <action type='Rewrite' url='/index.html' />
        </rule>
      </rules>
    </rewrite>
  </system.webServer>
</configuration>
"@ | Out-File -FilePath $webConfigPath -Encoding UTF8
          Write-Host "[INFO] Frontend deployed successfully."

      # 3️⃣ Deploy backend to IIS
      - name: Deploy Backend
        shell: powershell
        run: |
          Write-Host "[INFO] Deploying backend..."
          if (-Not (Test-Path $env:BACKEND_IIS_PATH)) { New-Item -ItemType Directory -Path $env:BACKEND_IIS_PATH | Out-Null }
          Remove-Item -Path "$env:BACKEND_IIS_PATH\*" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$env:BACKEND_SOURCE\*" -Destination $env:BACKEND_IIS_PATH -Recurse

          # Create iisnode web.config for Node.js backend
          $backendWebConfig = Join-Path $env:BACKEND_IIS_PATH "web.config"
          @"
<configuration>
  <system.webServer>
    <handlers>
      <add name='iisnode' path='server.js' verb='*' modules='iisnode'/>
    </handlers>
    <rewrite>
      <rules>
        <rule name='Nodejs' stopProcessing='true'>
          <match url='.*' />
          <action type='Rewrite' url='server.js'/>
        </rule>
      </rules>
    </rewrite>
    <iisnode nodeProcessCommandLine='C:\Program Files\nodejs\node.exe' />
  </system.webServer>
</configuration>
"@ | Out-File -FilePath $backendWebConfig -Encoding UTF8
          Write-Host "[INFO] Backend deployed successfully."

      # 4️⃣ Restart IIS
      - name: Restart IIS
        shell: powershell
        run: |
          Write-Host "[INFO] Restarting IIS..."
          iisreset
          Write-Host "[INFO] IIS restarted. Juice Shop frontend and backend are live!"
