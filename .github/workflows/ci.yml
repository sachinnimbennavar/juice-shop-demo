name: Juice Shop Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy latest build from Nexus
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081
          REPOSITORY: JuiceShopMavenDemo
          GROUP_ID: com.example.juiceshop
          FRONTEND_ARTIFACT: frontend-build
          SERVER_ARTIFACT: server-build
        run: |
          Write-Host "[INFO] Starting deployment..."

          $GroupId = $env:GROUP_ID
          $Repo = $env:REPOSITORY
          $BaseUrl = $env:NEXUS_URL
          $Headers = @{ "Accept" = "application/json" }

          # 🧠 Function: Fetch latest artifact using Nexus REST API
          function Get-LatestArtifactUrl {
              param ($artifact)
              $SearchUrl = "$BaseUrl/service/rest/v1/search/assets?repository=$Repo&group=$GroupId&name=$artifact"
              Write-Host "[INFO] Fetching latest $artifact from Nexus..."
              try {
                  $response = Invoke-RestMethod -Uri $SearchUrl -Headers $Headers -UseBasicParsing
              } catch {
                  Write-Host "[ERROR] Failed to query Nexus API: $($_.Exception.Message)"
                  exit 1
              }

              if (-not $response.items) {
                  Write-Host "[ERROR] No artifacts found for $artifact in Nexus!"
                  exit 1
              }

              $latest = $response.items | Sort-Object version | Select-Object -Last 1
              Write-Host "[INFO] Latest version detected: $($latest.version)"
              return $latest.downloadUrl
          }

          # 🧩 Function: Download + extract artifact
          function Deploy-Artifact {
              param ($artifactName, $downloadUrl, $targetPath)
              $tempZip = "$env:TEMP\$artifactName.zip"
              Write-Host "[INFO] Downloading $artifactName from $downloadUrl ..."
              Invoke-WebRequest -Uri $downloadUrl -OutFile $tempZip
              Write-Host "[INFO] Extracting $artifactName to $targetPath ..."
              if (Test-Path $targetPath) { Remove-Item -Recurse -Force $targetPath }
              Expand-Archive -Path $tempZip -DestinationPath $targetPath
              Remove-Item $tempZip
              Write-Host "[SUCCESS] $artifactName deployed successfully."
          }

          # 🚀 Deploy both frontend and server automatically
          try {
              $frontendUrl = Get-LatestArtifactUrl -artifact $env:FRONTEND_ARTIFACT
              Deploy-Artifact -artifactName "Frontend" -downloadUrl $frontendUrl -targetPath "C:\inetpub\wwwroot\juice-shop"

              $serverUrl = Get-LatestArtifactUrl -artifact $env:SERVER_ARTIFACT
              Deploy-Artifact -artifactName "Server" -downloadUrl $serverUrl -targetPath "C:\JuiceShopServer"

              Write-Host "`n✅ Deployment completed successfully!"
          }
          catch {
              Write-Host "[ERROR] Deployment failed: $($_.Exception.Message)"
              exit 1
          }
