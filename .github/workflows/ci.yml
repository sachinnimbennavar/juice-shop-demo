name: Juice Shop CI - Upload to Maven Repo

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  upload-to-maven:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repository (needed to access frontend-build and server files)
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Upload build ZIPs to Maven repo
      - name: Upload build ZIPs to Nexus Maven repo
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          Write-Host "🟢 Packaging and uploading build artifacts to Maven repo..."
          $timestamp = (Get-Date -Format "yyyyMMddHHmmss")

          # Prepare Basic Auth header
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          # ===== FRONTEND =====
          if (Test-Path "frontend-build") {
              Write-Host "[INFO] Packaging frontend build..."
              # Correct way: pass the folder path directly, not as an array
              Compress-Archive -Path "frontend-build" -DestinationPath "frontend-build-$timestamp.zip" -Force

              $frontendUrl = "${env:NEXUS_URL}/com/example/juiceshop/frontend-build/$timestamp/frontend-build-$timestamp.zip"
              Write-Host "[INFO] Uploading frontend ZIP → $frontendUrl"
              Invoke-RestMethod -Uri $frontendUrl -Method Put -InFile "frontend-build-$timestamp.zip" -Headers $headers -ContentType "application/zip"
              Write-Host "[SUCCESS] Frontend uploaded successfully."
          } else {
              Write-Host "[WARN] frontend-build folder not found, skipping frontend upload."
              Write-Host "[DEBUG] Listing current directory for troubleshooting:"
              Get-ChildItem -Recurse -Depth 2 | Select-Object FullName
          }

          # ===== SERVER =====
          $serverPaths = @(
              "app.ts","server.ts","package.json","tsconfig.json",
              "models","routes","lib","data","views","rsn","config","build"
          ) | Where-Object { Test-Path $_ }

          if ($serverPaths.Count -gt 0) {
              Write-Host "[INFO] Packaging server build..."
              Compress-Archive -Path $serverPaths -DestinationPath "server-build-$timestamp.zip" -Force

              $serverUrl = "${env:NEXUS_URL}/com/example/juiceshop/server-build/$timestamp/server-build-$timestamp.zip"
              Write-Host "[INFO] Uploading server ZIP → $serverUrl"
              Invoke-RestMethod -Uri $serverUrl -Method Put -InFile "server-build-$timestamp.zip" -Headers $headers -ContentType "application/zip"
              Write-Host "[SUCCESS] Server uploaded successfully."
          } else {
              Write-Host "[WARN] No server files found, skipping server upload."
          }

          Write-Host "✅ All available builds uploaded to Maven repo successfully!"
