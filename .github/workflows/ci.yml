# === Deploy Job ===
name: Juice Shop CI - Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout code (optional, if needed)
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Download frontend ZIP from Nexus
      - name: Download frontend build ZIP
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          BUILD_VERSION: "20251013135542"  # replace with latest timestamp
        run: |
          $frontendUrl = "${env:NEXUS_URL}/com/example/juiceshop/frontend-build/$env:BUILD_VERSION/frontend-build-$env:BUILD_VERSION.zip"
          Write-Host "[INFO] Downloading frontend ZIP from $frontendUrl"

          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          Invoke-WebRequest -Uri $frontendUrl -OutFile "frontend-build.zip" -Headers $headers
          Write-Host "[SUCCESS] Frontend ZIP downloaded."

      # 3️⃣ Extract frontend ZIP
      - name: Extract frontend build
        shell: powershell
        run: |
          if (Test-Path "frontend-build.zip") {
              Write-Host "[INFO] Extracting frontend ZIP..."
              Expand-Archive -Path "frontend-build.zip" -DestinationPath "C:\inetpub\wwwroot\juice-shop-frontend" -Force
              Write-Host "[SUCCESS] Frontend deployed to C:\inetpub\wwwroot\juice-shop-frontend"
          } else {
              Write-Host "[WARN] Frontend ZIP not found, skipping extraction."
          }

      # 4️⃣ (Optional) Download & extract server build similarly
      - name: Download & extract server build
        shell: powershell
        env:
          BUILD_VERSION: "20251013135542"
        run: |
          $serverUrl = "${env:NEXUS_URL}/com/example/juiceshop/server-build/$env:BUILD_VERSION/server-build-$env:BUILD_VERSION.zip"
          Write-Host "[INFO] Downloading server ZIP from $serverUrl"
          Invoke-WebRequest -Uri $serverUrl -OutFile "server-build.zip" -Headers $headers

          if (Test-Path "server-build.zip") {
              Expand-Archive -Path "server-build.zip" -DestinationPath "C:\JuiceShopServer" -Force
              Write-Host "[SUCCESS] Server deployed to C:\JuiceShopServer"
          } else {
              Write-Host "[WARN] Server ZIP not found, skipping extraction."
          }
