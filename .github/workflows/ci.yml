name: JuiceShop-CD-Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: windows-latest
    env:
      DEPLOY_PATH_SERVER: C:\JuiceShopServer
      NODE_PATH: C:\Program Files\nodejs

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd $env:DEPLOY_PATH_SERVER\frontend
          npm ci
          npm run build

      - name: Install Backend Dependencies
        run: |
          cd $env:DEPLOY_PATH_SERVER\backend
          npm ci
          npm run build

      - name: Start/Restart JuiceShop Server
        run: |
          cd $env:DEPLOY_PATH_SERVER\backend
          # Use PM2 to manage the server process
          npm install -g pm2
          if pm2 list | findstr JuiceShop; then
            pm2 restart JuiceShop
          else
            pm2 start server.js --name JuiceShop
            pm2 save
          fi

      - name: Optional: Audit Dependencies
        run: |
          cd $env:DEPLOY_PATH_SERVER\frontend
          npm audit fix --force
          cd $env:DEPLOY_PATH_SERVER\backend
          npm audit fix --force
