name: Juice Shop CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & SonarQube Analysis
    runs-on: [self-hosted, Windows, X64]   # Matches your runner "DES-50048"

    steps:
      # ---------------------------
      # 1️⃣ Checkout Code
      # ---------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------
      # 2️⃣ Setup Node.js (v20 LTS)
      # ---------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ---------------------------
      # 3️⃣ Install Dependencies
      # ---------------------------
      - name: Install dependencies
        run: |
          npm ci

      # ---------------------------
      # 4️⃣ Build Angular App
      # ---------------------------
      - name: Build Angular app
        run: |
          npx ng build --configuration production --source-map=false

      # ---------------------------
      # 5️⃣ SonarQube Scan
      # ---------------------------
      - name: SonarQube Scan
        env:
          SONAR_HOST_URL: http://localhost:9000
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          npx sonar-scanner `
            -Dsonar.projectKey=juice-shop-demo `
            -Dsonar.sources=. `
            -Dsonar.host.url=%SONAR_HOST_URL% `
            -Dsonar.login=%SONAR_TOKEN% `
            -Dsonar.exclusions=node_modules/**,dist/**,**/*.spec.ts `
            -Dsonar.projectVersion=1.0.${{ github.run_number }}
