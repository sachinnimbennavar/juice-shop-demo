name: Juice Shop Run from Unzipped Nexus ZIP

on:
  workflow_dispatch:

jobs:
  run-juice-shop:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout (optional, only for scripts)
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set environment variables
      - name: Set environment variables
        shell: powershell
        run: |
          $env:JUICESHOP_PATH = "C:\DeleteafterTest\full-repo-20251024124650"
          Write-Host "[INFO] Juice Shop path: $env:JUICESHOP_PATH"

      # 3️⃣ Install backend dependencies if missing
      - name: Install backend dependencies
        shell: powershell
        run: |
          cd "$env:JUICESHOP_PATH\server"
          if (-Not (Test-Path "node_modules")) {
              Write-Host "[INFO] node_modules not found. Installing dependencies..."
              npm install --legacy-peer-deps
          } else {
              Write-Host "[INFO] node_modules already exists. Skipping npm install."
          }

      # 4️⃣ Start Juice Shop server
      - name: Start Juice Shop server
        shell: powershell
        run: |
          cd "$env:JUICESHOP_PATH\server"
          Write-Host "[INFO] Starting Juice Shop server..."
          Start-Process "node" -ArgumentList "server.js" -NoNewWindow
          Write-Host "[INFO] Juice Shop server started in background."
