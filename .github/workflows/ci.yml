name: Open OWASP ZAP and Scan Juice Shop

on:
  workflow_dispatch:

jobs:
  zap-scan:
    runs-on: self-hosted

    steps:
      # 1️⃣ Launch ZAP GUI via desktop shortcut only if not already running
      - name: Launch OWASP ZAP via Desktop Shortcut
        shell: powershell
        run: |
          $zapProcess = Get-Process -Name "ZAP" -ErrorAction SilentlyContinue
          if (-not $zapProcess) {
              Write-Host "ZAP is not running. Launching OWASP ZAP..."
              Start-Process "C:\Users\Public\Desktop\ZAP 2.16.1.lnk"
              Write-Host "Waiting 1 minute for ZAP to fully open..."
              Start-Sleep -Seconds 60
              Write-Host "✅ ZAP GUI should now be fully open."
          } else {
              Write-Host "ZAP is already running. Skipping launch."
          }

      # 2️⃣ Instruction to manually scan Juice Shop
      - name: Scan Juice Shop in ZAP GUI
        shell: powershell
        run: |
          Write-Host "⚠️ Juice Shop is already running at http://localhost:3000"
          Write-Host "⚠️ Please switch to ZAP GUI and start an active scan manually."
          Write-Host "Once scanning is complete, generate the report manually (Report -> Generate HTML Report)."
