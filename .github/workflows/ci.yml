name: JuiceShop-CD-Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    steps:
    # 1️⃣ Checkout repository (to have workflow and zip references)
    - name: Checkout code
      uses: actions/checkout@v3

    # 2️⃣ List files for debugging
    - name: List repository files
      run: dir /s

    # 3️⃣ Stop any previous backend server on port 3000
    - name: Stop previous backend server
      run: |
        $port = 3000
        $processes = Get-NetTCPConnection -LocalPort $port -ErrorAction SilentlyContinue | ForEach-Object { Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue }
        if ($processes) {
          Write-Host "Stopping processes on port $port..."
          $processes | ForEach-Object { $_.Kill() }
        } else {
          Write-Host "No process running on port $port"
        }

    # 4️⃣ Extract frontend zip
    - name: Extract frontend zip
      run: |
        Expand-Archive -Path "C:\JuiceShopServer\frontend.zip" -DestinationPath "C:\JuiceShopServer\frontend" -Force

    # 5️⃣ Extract backend zip
    - name: Extract backend zip
      run: |
        Expand-Archive -Path "C:\JuiceShopServer\server.zip" -DestinationPath "C:\JuiceShopServer\server" -Force

    # 6️⃣ Verify key frontend files exist
    - name: Verify frontend files
      run: |
        if (!(Test-Path "C:\JuiceShopServer\frontend\package.json")) { Write-Error "Frontend package.json missing!" ; exit 1 }
        if (!(Test-Path "C:\JuiceShopServer\frontend\angular.json")) { Write-Host "Note: angular.json may not exist in runtime zip" }

    # 7️⃣ Verify key backend files exist
    - name: Verify backend files
      run: |
        if (!(Test-Path "C:\JuiceShopServer\server\package.json")) { Write-Error "Backend package.json missing!" ; exit 1 }
        if (!(Test-Path "C:\JuiceShopServer\server\app.ts")) { Write-Error "Backend app.ts missing!" ; exit 1 }

    # 8️⃣ Install frontend dependencies
    - name: Install frontend dependencies
      run: |
        cd C:\JuiceShopServer\frontend
        npm install --legacy-peer-deps --prefer-offline --no-audit

    # 9️⃣ Build frontend
    - name: Build frontend
      run: |
        cd C:\JuiceShopServer\frontend
        npm run build -- --configuration production --watch=false --verbose

    # 🔟 Install backend dependencies
    - name: Install backend dependencies
      run: |
        cd C:\JuiceShopServer\server
        npm install --prefer-offline --no-audit

    # 1️⃣1️⃣ Build backend
    - name: Build backend
      run: |
        cd C:\JuiceShopServer\server
        npm run build:server

    # 1️⃣2️⃣ Copy frontend dist to backend public folder
    - name: Copy frontend to backend
      run: |
        $frontendDist = "C:\JuiceShopServer\frontend\dist"
        $backendPublic = "C:\JuiceShopServer\server\public"
        if (Test-Path $backendPublic) { Remove-Item -Recurse -Force $backendPublic }
        Copy-Item $frontendDist -Destination $backendPublic -Recurse

    # 1️⃣3️⃣ Start backend server
    - name: Start backend server
      run: |
        cd C:\JuiceShopServer\server
        start /b npm start
        echo "Backend server started on http://localhost:3000"
