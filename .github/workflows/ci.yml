name: Juice Shop CI - Deploy Latest Builds

on:
  workflow_dispatch:

jobs:
  deploy-latest:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy latest builds from Nexus
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          FRONTEND_PATH: C:\inetpub\wwwroot\juice-shop
          SERVER_PATH: C:\JuiceShopServer
        run: |
          Write-Host "[INFO] Starting deployment..."

          # -------------------------------
          # Auth header
          # -------------------------------
          $base64Auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          # -------------------------------
          # Function to get latest version folder
          # -------------------------------
          function Get-LatestTimestamp($artifactId) {
              $artifactUrl = "${env:NEXUS_URL}/com/example/juiceshop/${artifactId}/"
              Write-Host "[INFO] Listing folders for ${artifactId} at ${artifactUrl} ..."
              try {
                  $response = Invoke-WebRequest -Uri $artifactUrl -Headers $headers
                  # Extract folder names (timestamps) from HTML links
                  $links = ($response.ParsedHtml.getElementsByTagName("a") | ForEach-Object { $_.href.TrimEnd('/') })
                  $timestamps = $links | Where-Object { $_ -match '^\d{14}$' } | Sort-Object -Descending
                  if ($timestamps.Count -eq 0) { throw "No versions found" }
                  return $timestamps[0]
              } catch {
                  Write-Warning "[WARN] Cannot fetch folders for ${artifactId}"
                  return $null
              }
          }

          # -------------------------------
          # Function to download and deploy
          # -------------------------------
          function Deploy-Artifact($artifactId, $deployPath, $filePrefix) {
              $latest = Get-LatestTimestamp ${artifactId}
              if ($latest) {
                  $zipUrl = "${env:NEXUS_URL}/com/example/juiceshop/${artifactId}/${latest}/${filePrefix}-${latest}.zip"
                  Write-Host "[INFO] Downloading ${artifactId} from ${zipUrl} ..."
                  $outFile = "${filePrefix}.zip"
                  Invoke-WebRequest -Uri $zipUrl -OutFile $outFile -Headers $headers
                  Write-Host "[INFO] Extracting ${artifactId} to ${deployPath} ..."
                  Remove-Item -Recurse -Force "${deployPath}\*" -ErrorAction SilentlyContinue
                  Expand-Archive -Path $outFile -DestinationPath $deployPath -Force
                  Write-Host "[SUCCESS] ${artifactId} deployed successfully. Version: ${latest}"
              }
          }

          # -------------------------------
          # Deploy frontend and server
          # -------------------------------
          Deploy-Artifact "frontend-build" ${env:FRONTEND_PATH} "frontend-build"
          Deploy-Artifact "server-build" ${env:SERVER_PATH} "server-build"

          Write-Host "✅ Deployment completed successfully!"
