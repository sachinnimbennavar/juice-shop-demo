name: Juice Shop IIS Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      # 2️⃣ Install frontend dependencies
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps --prefer-offline --no-audit
          cd ..

      # 3️⃣ Build frontend
      - name: Build frontend
        run: |
          cd frontend
          npm run build -- --configuration production --watch=false --verbose
          cd ..

      # 4️⃣ IIS Deployment (frontend only)
      - name: IIS Frontend Deployment
        shell: powershell
        env:
          SITE_NAME: JuiceShopSite
          BUILD_PATH: frontend/dist
          IIS_PATH: C:\inetpub\wwwroot\JuiceShop
        run: |
          Import-Module WebAdministration -ErrorAction Stop

          Write-Host "[INFO] Starting IIS frontend deployment..."
          if (-Not (Test-Path $env:BUILD_PATH)) {
              Write-Error "[ERROR] Frontend build path '$env:BUILD_PATH' not found!"
              exit 1
          }

          # Stop existing IIS site if exists
          $site = Get-Website -Name $env:SITE_NAME -ErrorAction SilentlyContinue
          if ($null -ne $site) { Stop-Website -Name $env:SITE_NAME }

          # Clear or create IIS path
          if (Test-Path $env:IIS_PATH) {
              Get-ChildItem $env:IIS_PATH -Recurse -Force | Remove-Item -Force -Recurse
          } else {
              New-Item -ItemType Directory -Path $env:IIS_PATH -Force | Out-Null
          }

          # Copy build output to IIS
          Copy-Item -Path (Join-Path $env:BUILD_PATH '*') -Destination $env:IIS_PATH -Recurse -Force

          # Start or create the site
          $site = Get-Website -Name $env:SITE_NAME -ErrorAction SilentlyContinue
          if ($null -ne $site) {
              Start-Website -Name $env:SITE_NAME
          } else {
              New-Website -Name $env:SITE_NAME -Port 8080 -PhysicalPath $env:IIS_PATH -Force | Out-Null
          }

          Write-Host "✅ Frontend deployed to IIS successfully."

      # 5️⃣ Run Node.js server as Windows service
      - name: Node.js Server as Windows Service
        shell: powershell
        env:
          SERVER_PATH: C:\SSDLC\Nexus_Unzips
          SERVICE_NAME: JuiceShopServer
        run: |
          Write-Host "[INFO] Starting Node.js server service..."
          $service = Get-Service -Name $env:SERVICE_NAME -ErrorAction SilentlyContinue
          $nodePath = (Get-Command node).Source
          $appPath = Join-Path $env:SERVER_PATH "server.js"

          if (-Not (Test-Path $appPath)) {
              Write-Error "[ERROR] server.js not found at $appPath"
              exit 1
          }

          if ($null -eq $service) {
              Write-Host "Creating Windows service $($env:SERVICE_NAME)..."
              sc.exe create $env:SERVICE_NAME binPath= "`"$nodePath`" `"$appPath`"" start= auto
          }

          Restart-Service -Name $env:SERVICE_NAME -Force
          Write-Host "✅ Node.js server running as Windows service."
