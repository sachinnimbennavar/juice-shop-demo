name: Juice Shop IIS Deployment

on:
  workflow_dispatch:  # Manual trigger

jobs:
  deploy-to-iis:
    runs-on: self-hosted

    steps:
      - name: Build and Deploy Frontend to IIS
        shell: powershell
        env:
          BUILD_PATH: C:\SSDLC\Nexus_Unzips\frontend
          IIS_PATH: C:\inetpub\wwwroot\JuiceShop
        run: |
          Write-Host "[INFO] Starting IIS Frontend Deployment..."

          if (-Not (Test-Path $env:BUILD_PATH)) {
              Write-Error "Frontend folder not found at $env:BUILD_PATH"
              exit 1
          }

          Write-Host "[INFO] Installing dependencies..."
          cd $env:BUILD_PATH
          npm install --legacy-peer-deps --no-audit

          Write-Host "[INFO] Building Angular frontend..."
          $env:NODE_OPTIONS="--max_old_space_size=4096"
          npx ng build --configuration production --verbose

          $distPath = Join-Path $env:BUILD_PATH "dist"
          if (-Not (Test-Path $distPath)) {
              Write-Error "Frontend build failed: dist folder not found."
              exit 1
          }

          Write-Host "[INFO] Preparing IIS deployment folder..."
          Import-Module WebAdministration -ErrorAction Stop
          if (-Not (Test-Path $env:IIS_PATH)) {
              New-Item -ItemType Directory -Path $env:IIS_PATH -Force | Out-Null
          } else {
              Remove-Item -Path "$env:IIS_PATH\*" -Recurse -Force
          }

          Write-Host "[INFO] Copying frontend build to IIS path..."
          Copy-Item -Path (Join-Path $distPath '*') -Destination $env:IIS_PATH -Recurse -Force

          if (-Not (Get-Website | Where-Object { $_.Name -eq "JuiceShopSite" })) {
              Write-Host "[INFO] Creating IIS site JuiceShopSite on port 8080..."
              New-Website -Name "JuiceShopSite" -Port 8080 -PhysicalPath $env:IIS_PATH -Force | Out-Null
          } else {
              Write-Host "[INFO] Restarting existing IIS site JuiceShopSite..."
              Restart-WebAppPool -Name "JuiceShopSite"
          }

          Write-Host "✅ IIS Frontend deployment completed successfully."

      - name: (Optional) Run Node.js Server as a Windows Service
        shell: powershell
        env:
          SERVER_PATH: C:\SSDLC\Nexus_Unzips
        run: |
          Write-Host "[INFO] Starting Node.js server as a background service..."
          cd $env:SERVER_PATH
          if (Test-Path "server.js") {
              Write-Host "[INFO] Launching Node server..."
              Start-Process "node" "server.js" -WindowStyle Hidden
              Write-Host "✅ Node.js server started successfully."
          } else {
              Write-Host "[WARN] server.js not found — skipping Node service start."
          }
