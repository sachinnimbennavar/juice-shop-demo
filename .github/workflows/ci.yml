name: Juice Shop IIS Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Set Paths and URLs
        shell: powershell
        run: |
          $env:FRONTEND_PATH = "C:\SSDLC\Nexus_Unzips\frontend"
          $env:FRONTEND_DIST = Join-Path $env:FRONTEND_PATH "dist\frontend"
          $env:FRONTEND_IIS = "C:\inetpub\wwwroot\JuiceShopFrontend"
          $env:BACKEND_PATH = "C:\SSDLC\Nexus_Unzips\server"
          $env:BACKEND_IIS = "C:\inetpub\wwwroot\JuiceShopBackend"
          $env:BACKEND_URL = "http://localhost/JuiceShopBackend"

      - name: Build Frontend if missing
        shell: powershell
        run: |
          if (-Not (Test-Path $env:FRONTEND_DIST)) {
              Write-Host "[INFO] Frontend dist folder not found. Building frontend..."
              cd $env:FRONTEND_PATH
              npm install --legacy-peer-deps
              npm run build -- --configuration production
              cd ..
          } else {
              Write-Host "[INFO] Frontend dist folder exists. Skipping build."
          }

      - name: Deploy Frontend to IIS
        shell: powershell
        run: |
          Import-Module WebAdministration
          if (-Not (Test-Path $env:FRONTEND_IIS)) { New-Item -ItemType Directory -Path $env:FRONTEND_IIS | Out-Null }
          Remove-Item -Path "$env:FRONTEND_IIS\*" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$env:FRONTEND_DIST\*" -Destination $env:FRONTEND_IIS -Recurse -Force

          # Update API URL
          $envFile = Join-Path $env:FRONTEND_IIS "assets\environment.prod.js"
          if (Test-Path $envFile) {
              (Get-Content $envFile) -replace 'apiUrl\s*:\s*["\'].*["\']', "apiUrl: '$env:BACKEND_URL'" | Set-Content $envFile
          }

          # Angular routing web.config
          $webConfigPath = Join-Path $env:FRONTEND_IIS "web.config"
          @"
<configuration>
  <system.webServer>
    <rewrite>
      <rules>
        <rule name='Angular Routes' stopProcessing='true'>
          <match url='.*' />
          <conditions logicalGrouping='MatchAll'>
            <add input='{REQUEST_FILENAME}' matchType='IsFile' negate='true' />
            <add input='{REQUEST_FILENAME}' matchType='IsDirectory' negate='true' />
          </conditions>
          <action type='Rewrite' url='/index.html' />
        </rule>
      </rules>
    </rewrite>
  </system.webServer>
</configuration>
"@ | Out-File -FilePath $webConfigPath -Encoding UTF8
          Write-Host "[INFO] Frontend deployed successfully."

      - name: Deploy Backend to IIS
        shell: powershell
        run: |
          if (-Not (Test-Path $env:BACKEND_IIS)) { New-Item -ItemType Directory -Path $env:BACKEND_IIS | Out-Null }
          Remove-Item -Path "$env:BACKEND_IIS\*" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$env:BACKEND_PATH\*" -Destination $env:BACKEND_IIS -Recurse -Force

          # iisnode web.config for backend
          $backendWebConfig = Join-Path $env:BACKEND_IIS "web.config"
          @"
<configuration>
  <system.webServer>
    <handlers>
      <add name='iisnode' path='server.js' verb='*' modules='iisnode'/>
    </handlers>
    <rewrite>
      <rules>
        <rule name='Nodejs' stopProcessing='true'>
          <match url='.*' />
          <action type='Rewrite' url='server.js'/>
        </rule>
      </rules>
    </rewrite>
    <iisnode nodeProcessCommandLine='C:\Program Files\nodejs\node.exe' />
  </system.webServer>
</configuration>
"@ | Out-File -FilePath $backendWebConfig -Encoding UTF8
          Write-Host "[INFO] Backend deployed successfully."

      - name: Restart IIS
        shell: powershell
        run: |
          Write-Host "[INFO] Restarting IIS..."
          iisreset
          Write-Host "[INFO] IIS restarted. Juice Shop frontend and backend are live!"
