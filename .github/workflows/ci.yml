name: Juice Shop Start from Extracted Builds

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  start:
    runs-on: self-hosted

    env:
      DEPLOY_PATH_FRONTEND: C:\JuiceShopServer\frontend
      DEPLOY_PATH_SERVER: C:\JuiceShopServer
      NODE_OPTIONS: --max_old_space_size=4096

    steps:
      - name: ⚙️ Setup PowerShell environment
        shell: powershell
        run: |
          Write-Host "[INFO] Starting job from extracted builds..."
          Write-Host "Working directory: $PWD"

      - name: 🛑 Stop Existing Processes
        shell: powershell
        run: |
          Write-Host "[INFO] Stopping old backend processes (node server)..."
          Get-Process node -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "*server.js*" } | Stop-Process -Force
          
          Write-Host "[INFO] Stopping old frontend processes (ng serve)..."
          Get-Process node -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "*ng*" } | Stop-Process -Force

      - name: 📦 Install Dependencies
        shell: powershell
        run: |
          Write-Host "[INFO] Installing backend dependencies..."
          Set-Location "${env:DEPLOY_PATH_SERVER}"
          npm install --prefer-offline --no-audit
          
          Write-Host "[INFO] Installing frontend dependencies..."
          Set-Location "${env:DEPLOY_PATH_FRONTEND}"
          npm install --legacy-peer-deps --prefer-offline --no-audit

      - name: 🚀 Start Backend and Frontend
        shell: powershell
        run: |
          Write-Host "[INFO] Starting backend..."
          Start-Process -NoNewWindow -FilePath "node" -ArgumentList "server.js" -WorkingDirectory "${env:DEPLOY_PATH_SERVER}"

          Write-Host "[INFO] Starting frontend..."
          Start-Process -NoNewWindow -FilePath "npx" -ArgumentList "ng serve --port 4200 --host 0.0.0.0 --disable-host-check" -WorkingDirectory "${env:DEPLOY_PATH_FRONTEND}"

          Write-Host "[SUCCESS] Both frontend and backend started successfully!"
