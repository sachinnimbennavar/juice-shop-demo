name: Juice Shop CD - Deploy from Maven Repo

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repo (optional but helps with context)
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Deploy artifacts from Nexus
      - name: Deploy Juice Shop from Maven Repo
        shell: powershell
        env:
          NEXUS_URL: http://127.0.0.1:8081/repository/JuiceShopMavenDemo
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          Write-Host "[INFO] Starting deployment..."

          # Prepare auth
          $base64Auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}"))
          $headers = @{ Authorization = "Basic $base64Auth" }

          # === Detect latest version automatically ===
          Write-Host "[INFO] Fetching latest version from Nexus..."
          $metadataUrl = "${env:NEXUS_URL}/com/example/juiceshop/frontend-build/maven-metadata.xml"
          $metadata = Invoke-RestMethod -Uri $metadataUrl -Headers $headers -UseBasicParsing
          $latestVersion = ($metadata.metadata.versioning.release)
          
          if (-not $latestVersion) {
              Write-Host "[ERROR] Could not determine latest build version!"
              exit 1
          }

          Write-Host "[INFO] Latest version detected: $latestVersion"

          # === FRONTEND DEPLOY ===
          $frontendZip = "frontend-build.zip"
          $frontendUrl = "${env:NEXUS_URL}/com/example/juiceshop/frontend-build/$latestVersion/frontend-build-$latestVersion.zip"
          Write-Host "[INFO] Downloading frontend from $frontendUrl ..."
          Invoke-WebRequest -Uri $frontendUrl -OutFile $frontendZip -Headers $headers

          $frontendPath = "C:\inetpub\wwwroot\juice-shop"
          if (Test-Path $frontendPath) { Remove-Item $frontendPath -Recurse -Force }
          Expand-Archive -Path $frontendZip -DestinationPath $frontendPath -Force
          Write-Host "[SUCCESS] Frontend deployed successfully."

          # === SERVER DEPLOY ===
          $serverZip = "server-build.zip"
          $serverUrl = "${env:NEXUS_URL}/com/example/juiceshop/server-build/$latestVersion/server-build-$latestVersion.zip"
          Write-Host "[INFO] Downloading server from $serverUrl ..."
          Invoke-WebRequest -Uri $serverUrl -OutFile $serverZip -Headers $headers

          $serverPath = "C:\JuiceShopServer"
          if (Test-Path $serverPath) { Remove-Item $serverPath -Recurse -Force }
          Expand-Archive -Path $serverZip -DestinationPath $serverPath -Force
          Write-Host "[SUCCESS] Server deployed successfully."

          Write-Host "✅ Deployment completed successfully!"
